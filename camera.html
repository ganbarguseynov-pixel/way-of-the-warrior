<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Камера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключаем библиотеку для распознавания штрих-кодов на случай, если встроенная не работает -->
<script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.9.15/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@undecaf/barcode-detector-polyfill@0.9.20/dist/index.js"></script>
<link rel="stylesheet" href="style.css">
<style>
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal.active { display: flex; }
    .modal-content { background: #1c1c1e; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px; box-sizing: border-box; position: relative; }
    .modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 20px; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body>

<div class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1 style="text-align: center;">Анализ еды</h1>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('search')">🔍 Поиск</button>
<button class="tab-btn" onclick="switchTab('photo')">📷 Фото</button>
<button class="tab-btn" onclick="switchTab('barcode')">📊 Штрих-код</button>
</div>

<!-- ВКЛАДКА ПОИСКА -->
<div id="tab-search" class="tab-content active">
<div class="form-group"><input type="text" id="food-search-input" placeholder="Введите название"></div>
<button class="btn" onclick="searchFood()">Найти</button>
<div id="search-result" style="margin-top: 20px;"></div>
</div>

<!-- ВКЛАДКА ФОТО -->
<div id="tab-photo" class="tab-content">
<div id="photo-buttons">
<button class="btn" onclick="startCamera()">📷 Сделать фото</button>
<button class="btn" style="background-color: #2c2c2e; color: white;" onclick="document.getElementById('gallery-input').click()">🖼️ Выбрать из галереи</button>
</div>
<input type="file" id="gallery-input" accept="image/*" style="display: none;" onchange="handleImage(event)">
<div id="camera-container" style="display: none;">
<button id="switch-camera-btn" onclick="switchCamera()">🔄</button>
<button id="close-camera-btn" onclick="resetCameraScreen()">✖</button>
<video id="camera-video" autoplay playsinline></video>
<div id="camera-controls"><button id="capture-btn" onclick="takePhoto()"></button></div>
</div>
<img id="photo-preview" style="width: 100%; border-radius: 16px; margin-bottom: 20px; display: none;">
<button class="btn" id="remove-photo-btn" style="display: none; background-color: #ff3b30; color: white; margin-bottom: 10px;" onclick="resetCameraScreen()">❌ Удалить фото</button>
<div id="loading-spinner" style="display: none; text-align: center; margin-top: 20px; font-size: 18px;">🤖 ИИ анализирует фото...</div>
<div id="food-result" style="display: none; background: #1c1c1e; padding: 20px; border-radius: 16px; margin-top: 20px;">
<h2 id="food-name" style="margin-top: 0; color: var(--accent-color);">Название</h2>
<div class="nutrition-row"><span>Калории:</span> <b id="food-calories">0 ккал</b></div>
<div class="nutrition-row"><span>Белки:</span> <b id="food-protein">0 г</b></div>
<div class="nutrition-row"><span>Жиры:</span> <b id="food-fat">0 г</b></div>
<div class="nutrition-row"><span>Углеводы:</span> <b id="food-carbs">0 г</b></div>
<button class="btn" style="background-color: #34c759; color: white; margin-top: 15px;" onclick="saveXPAndGoBack()">Добавить (+20 XP)</button>
<button class="btn" style="background-color: transparent; color: #ff3b30; margin-top: 10px;" onclick="resetCameraScreen()">Отмена</button>
</div>
</div>

<!-- ВКЛАДКА ШТРИХ-КОДА -->
<div id="tab-barcode" class="tab-content">
    <p style="text-align: center; color: #8e8e93; margin-bottom: 20px;">Наведите камеру на штрих-код продукта</p>
    <div id="barcode-scanner-container" style="position: relative; width: 100%; height: 60vh; border-radius: 16px; overflow: hidden; background: #000;">
        <video id="barcode-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
        <div style="position: absolute; top: 50%; left: 10%; right: 10%; height: 2px; background: red; box-shadow: 0 0 10px red;"></div>
    </div>
    <div id="barcode-result" style="margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold;"></div>
</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="food-modal" class="modal">
    <div class="modal-content">
        <button class="modal-close" onclick="closeModal()">✖</button>
        <img id="modal-image" src="" style="width: 100%; height: 200px; object-fit: contain; background: #2c2c2e; border-radius: 12px; margin-bottom: 15px; display: none;">
        <h2 id="modal-name" style="color: var(--accent-color); margin-top: 0;">Название</h2>
        <div style="background: #2c2c2e; padding: 15px; border-radius: 12px; margin-bottom: 15px;">
            <h4 style="margin-top: 0;">На 100 грамм:</h4>
            <div class="nutrition-row"><span>Калории:</span> <b id="modal-calories">0 ккал</b></div>
            <div class="nutrition-row"><span>Белки:</span> <b id="modal-protein">0 г</b></div>
            <div class="nutrition-row"><span>Жиры:</span> <b id="modal-fat">0 г</b></div>
            <div class="nutrition-row"><span>Углеводы:</span> <b id="modal-carbs">0 г</b></div>
        </div>
        <div style="margin-bottom: 20px;">
            <h4 style="margin-bottom: 5px;">Описание:</h4>
            <p id="modal-desc" style="color: #8e8e93; font-size: 14px; margin: 0;">Описание отсутствует.</p>
        </div>
        <button class="btn" style="background-color: #34c759; color: white;" onclick="confirmFoodSelection()">✅ Выбрать это</button>
    </div>
</div>

<script>
const AI_SERVER_URL = 'https://sport-app-bqlu.onrender.com';
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

let selectedFoodData = null;
window.foodList = [];

function switchTab(tabName) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(`tab-${tabName}`).classList.add('active');
    event.target.classList.add('active');
    if (tabName === 'photo') resetCameraScreen();
    if (tabName === 'barcode') startBarcodeScanner();
    else stopBarcodeScanner();
}

async function searchFood() {
    const query = document.getElementById('food-search-input').value;
    if (!query) return;
    const resultDiv = document.getElementById('search-result');
    resultDiv.innerHTML = '<p style="text-align:center;">Поиск...</p>';
    try {
        const response = await fetch(`${AI_SERVER_URL}/search?q=${encodeURIComponent(query)}`);
        const data = await response.json();
        if (data.products && data.products.length > 0) {
            window.foodList = data.products;
            let html = '';
            data.products.forEach((p, index) => {
                let imgHtml = p.image_url ? `<img src="${p.image_url}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px; margin-right: 15px;">` : `<div style="width: 50px; height: 50px; background: #2c2c2e; border-radius: 8px; margin-right: 15px;"></div>`;
                html += `<div class="leaderboard-item" style="cursor: pointer; margin-bottom: 10px;" onclick="openFoodModal(${index})">${imgHtml}<div class="user-info"><p style="margin:0; font-weight:bold; font-size:15px;">${p.product_name}</p><p style="margin:0; font-size:12px; color:#8e8e93;">${p.calories_100g || 0} ккал на 100г</p></div></div>`;
            });
            resultDiv.innerHTML = html;
        } else {
            resultDiv.innerHTML = '<p style="text-align:center; color: #ff3b30;">Ничего не найдено.</p>';
        }
    } catch (e) {
        resultDiv.innerHTML = '<p style="text-align:center; color: #ff3b30;">Ошибка связи с сервером</p>';
    }
}

// --- СКАНЕР ШТРИХ-КОДОВ ---
let barcodeStream = null;
let barcodeInterval = null;

async function startBarcodeScanner() {
    const video = document.getElementById('barcode-video');
    const resultDiv = document.getElementById('barcode-result');
    resultDiv.innerText = "Запуск камеры...";
    
    try {
        barcodeStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = barcodeStream;
        
        // Проверяем поддержку BarcodeDetector
        if ('BarcodeDetector' in window) {
            const barcodeDetector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128'] });
            resultDiv.innerText = "Наведите на штрих-код...";
            
            barcodeInterval = setInterval(async () => {
                try {
                    const barcodes = await barcodeDetector.detect(video);
                    if (barcodes.length > 0) {
                        clearInterval(barcodeInterval);
                        const code = barcodes[0].rawValue;
                        resultDiv.innerText = `Найден: ${code}. Загрузка...`;
                        stopBarcodeScanner();
                        await fetchProductByBarcode(code);
                    }
                } catch (e) {}
            }, 300);
        } else {
            resultDiv.innerText = "Ваш телефон не поддерживает сканер. Используйте поиск.";
        }
    } catch (err) {
        resultDiv.innerText = "Ошибка доступа к камере.";
    }
}

function stopBarcodeScanner() {
    if (barcodeStream) { barcodeStream.getTracks().forEach(t => t.stop()); barcodeStream = null; }
    if (barcodeInterval) { clearInterval(barcodeInterval); barcodeInterval = null; }
}

async function fetchProductByBarcode(code) {
    try {
        const response = await fetch(`${AI_SERVER_URL}/barcode?code=${code}`);
        const data = await response.json();
        if (data.products && data.products.length > 0) {
            window.foodList = data.products;
            openFoodModal(0);
        } else {
            tg.showAlert("Продукт с таким штрих-кодом не найден в базе.");
            document.getElementById('barcode-result').innerText = "";
            startBarcodeScanner(); // Перезапускаем сканер
        }
    } catch (e) {
        tg.showAlert("Ошибка сервера.");
    }
}

// --- ОСТАЛЬНОЙ КОД (МОДАЛКА И КАМЕРА) ---
function openFoodModal(index) {
    const food = window.foodList[index];
    selectedFoodData = food;
    document.getElementById('modal-name').innerText = food.product_name;
    document.getElementById('modal-calories').innerText = (food.calories_100g || 0) + " ккал";
    document.getElementById('modal-protein').innerText = (food.proteins_100g || 0) + " г";
    document.getElementById('modal-fat').innerText = (food.fat_100g || 0) + " г";
    document.getElementById('modal-carbs').innerText = (food.carbs_100g || 0) + " г";
    document.getElementById('modal-desc').innerText = food.ingredients;
    const imgElement = document.getElementById('modal-image');
    if (food.image_url) { imgElement.src = food.image_url; imgElement.style.display = 'block'; } else { imgElement.style.display = 'none'; }
    document.getElementById('food-modal').classList.add('active');
}
function closeModal() { document.getElementById('food-modal').classList.remove('active'); }
function confirmFoodSelection() {
    if (!selectedFoodData) return;
    document.getElementById('food-result').style.display = 'block';
    document.getElementById('food-name').innerText = selectedFoodData.product_name;
    document.getElementById('food-calories').innerText = (selectedFoodData.calories_100g || 0) + " ккал/100г";
    document.getElementById('food-protein').innerText = (selectedFoodData.proteins_100g || 0) + " г";
    document.getElementById('food-fat').innerText = (selectedFoodData.fat_100g || 0) + " г";
    document.getElementById('food-carbs').innerText = (selectedFoodData.carbs_100g || 0) + " г";
    closeModal();
    document.getElementById('search-result').innerHTML = '';
}

let videoStream = null;
async function startCamera() { try { document.getElementById('photo-buttons').style.display = 'none'; document.getElementById('camera-container').style.display = 'flex'; videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); document.getElementById('camera-video').srcObject = videoStream; } catch (err) { tg.showAlert("Ошибка камеры."); resetCameraScreen(); } }
function takePhoto() { if (!videoStream) return; const video = document.getElementById('camera-video'); const canvas = document.createElement('canvas'); canvas.width = video.videoWidth; canvas.height = video.videoHeight; canvas.getContext('2d').drawImage(video, 0, 0); stopCamera(); canvas.toBlob(async function(blob) { const file = new File([blob], "photo.jpg", { type: "image/jpeg" }); document.getElementById('photo-preview').src = URL.createObjectURL(blob); document.getElementById('photo-preview').style.display = 'block'; document.getElementById('remove-photo-btn').style.display = 'block'; await sendPhotoToServer(file); }, 'image/jpeg', 0.8); }
function stopCamera() { if (videoStream) { videoStream.getTracks().forEach(track => track.stop()); videoStream = null; } document.getElementById('camera-container').style.display = 'none'; }
function resetCameraScreen() { stopCamera(); document.getElementById('photo-preview').style.display = 'none'; document.getElementById('food-result').style.display = 'none'; document.getElementById('photo-buttons').style.display = 'block'; document.getElementById('remove-photo-btn').style.display = 'none'; document.getElementById('loading-spinner').style.display = 'none'; document.getElementById('gallery-input').value = ""; document.getElementById('search-result').innerHTML = ''; closeModal(); }
async function handleImage(event) { const file = event.target.files[0]; if (!file) return; document.getElementById('photo-buttons').style.display = 'none'; document.getElementById('photo-preview').src = URL.createObjectURL(file); document.getElementById('photo-preview').style.display = 'block'; document.getElementById('remove-photo-btn').style.display = 'block'; await sendPhotoToServer(file); }
async function sendPhotoToServer(file) { document.getElementById('loading-spinner').style.display = 'block'; document.getElementById('food-result').style.display = 'none'; const formData = new FormData(); formData.append('image', file); try { const response = await fetch(`${AI_SERVER_URL}/analyze`, { method: 'POST', body: formData }); const data = await response.json(); document.getElementById('loading-spinner').style.display = 'none'; if (data.food !== "Не удалось распознать") { document.getElementById('food-result').style.display = 'block'; document.getElementById('food-name').innerText = data.food; document.getElementById('food-calories').innerText = data.calories + " ккал"; document.getElementById('food-protein').innerText = data.protein + " г"; document.getElementById('food-fat').innerText = data.fat + " г"; document.getElementById('food-carbs').innerText = data.carbs + " г"; } else { tg.showAlert("ИИ не смог распознать еду."); resetCameraScreen(); } } catch (error) { document.getElementById('loading-spinner').style.display = 'none'; tg.showAlert("Сервер просыпается."); resetCameraScreen(); } }
function saveXPAndGoBack() { localStorage.setItem('pendingXP', '20'); window.location.href = 'index.html'; }
</script>
</body>
</html>
