<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Камера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
.modal.active { display: flex; }
.modal-content { background: #1c1c1e; border-radius: 20px; width: 100%; max-width: 400px; max-height: 90vh; overflow-y: auto; padding: 20px; box-sizing: border-box; position: relative; }
.modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 20px; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }

#barcode-camera-container { position: relative; width: 100%; height: 60vh; border-radius: 16px; overflow: hidden; margin-bottom: 20px; background: #000; display: flex; flex-direction: column; justify-content: space-between; }
#barcode-camera-video { width: 100%; height: 100%; object-fit: cover; display: block; background-color: #000; }
#barcode-camera-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; z-index: 5; }
#barcode-capture-btn { width: 75px; height: 75px; border-radius: 50%; background: white; border: 5px solid rgba(0,0,0,0.2); cursor: pointer; }
#barcode-capture-btn:active { transform: scale(0.95); background: #ddd; }
#barcode-close-camera-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }
#barcode-switch-camera-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }

.result-card { background: #1c1c1e; padding: 25px 20px; border-radius: 16px; margin-top: 20px; text-align: center; }
.result-title { margin-top: 0; color: var(--accent-color); font-size: 24px; word-break: break-word; line-height: 1.2; }
.result-desc { color: #8e8e93; font-size: 15px; margin-bottom: 20px; line-height: 1.4; padding: 0 10px; }
.macro-box { background: #2c2c2e; padding: 15px; border-radius: 12px; display: inline-block; width: 100%; max-width: 300px; margin: 0 auto; }
.macro-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; padding: 0 10px; }
.macro-row:last-child { margin-bottom: 0; }
</style>
</head>
<body>

<div class="inner-screen">
<button class="back-btn" onclick="window.location.href='index.html'">← Назад в приложение</button>
<h1 style="text-align: center;">Анализ еды</h1>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('search')">🔍 Поиск</button>
<button class="tab-btn" onclick="switchTab('photo')">📷 Фото</button>
<button class="tab-btn" onclick="switchTab('barcode')">📊 Штрих-код</button>
</div>

<!-- ВКЛАДКА ПОИСКА -->
<div id="tab-search" class="tab-content active">
<div class="form-group"><input type="text" id="food-search-input" placeholder="Введите название"></div>
<button class="btn" onclick="searchFood()">Найти</button>
<div id="search-result" style="margin-top: 20px;"></div>
</div>

<!-- ВКЛАДКА ФОТО -->
<div id="tab-photo" class="tab-content">
<div id="photo-buttons">
<button class="btn" onclick="startCamera('food')">📷 Сделать фото</button>
<button class="btn" style="background-color: #2c2c2e; color: white;" onclick="document.getElementById('gallery-input').click()">🖼️ Выбрать из галереи</button>
</div>
<input type="file" id="gallery-input" accept="image/*" style="display: none;" onchange="handleImage(event)">
<div id="camera-container" style="display: none;">
<button id="switch-camera-btn" onclick="switchCamera()">🔄</button>
<button id="close-camera-btn" onclick="resetCameraScreen()">✖</button>
<video id="camera-video" autoplay playsinline></video>
<div id="camera-controls"><button id="capture-btn" onclick="takePhoto()"></button></div>
</div>
<img id="photo-preview" style="width: 100%; border-radius: 16px; margin-bottom: 20px; display: none;">
<button class="btn" id="remove-photo-btn" style="display: none; background-color: #ff3b30; color: white; margin-bottom: 10px;" onclick="resetCameraScreen()">❌ Удалить фото</button>
<div id="loading-spinner" style="display: none; text-align: center; margin-top: 20px; font-size: 18px;">🤖 ИИ анализирует фото...</div>

<div id="food-result" style="display: none;" class="result-card">
    <h2 id="food-name" class="result-title">Название</h2>
    <p id="food-desc" class="result-desc">Описание...</p>
    
    <div class="macro-box">
        <div class="macro-row"><span>Калории:</span> <b id="food-calories">0 ккал</b></div>
        <div class="macro-row"><span>Белки:</span> <b id="food-protein">0 г</b></div>
        <div class="macro-row"><span>Жиры:</span> <b id="food-fat">0 г</b></div>
        <div class="macro-row"><span>Углеводы:</span> <b id="food-carbs">0 г</b></div>
    </div>

    <button class="btn" style="background-color: #34c759; color: white; margin-top: 20px;" onclick="saveXPAndGoBack()">Добавить (+20 XP)</button>
    <button class="btn" style="background-color: transparent; color: #ff3b30; margin-top: 10px;" onclick="resetCameraScreen()">Отмена</button>
</div>
</div>

<!-- ВКЛАДКА ШТРИХ-КОДА -->
<div id="tab-barcode" class="tab-content">
<p style="text-align: center; color: #8e8e93; margin-bottom: 20px;">Сфотографируйте штрих-код или введите вручную</p>

<div id="barcode-buttons">
<button class="btn" style="margin-bottom: 10px;" onclick="startBarcodeCamera()">📷 Открыть камеру</button>
<input type="file" id="barcode-gallery-input" accept="image/*" style="display: none;" onchange="handleBarcodeImage(event)">
<button class="btn" style="background-color: #2c2c2e; color: white; margin-bottom: 10px;" onclick="document.getElementById('barcode-gallery-input').click()">🖼️ Выбрать из галереи</button>
</div>

<div class="form-group" style="margin-top: 20px;">
<input type="number" id="barcode-input" placeholder="Или введите штрих-код вручную">
</div>
<button class="btn" onclick="searchByBarcode()">🔎 Найти по штрих-коду</button>

<div id="barcode-camera-container" style="display: none;">
<button id="barcode-switch-camera-btn" onclick="switchBarcodeCamera()">🔄</button>
<button id="barcode-close-camera-btn" onclick="resetBarcodeScreen()">✖</button>
<video id="barcode-camera-video" autoplay playsinline></video>
<div id="barcode-camera-controls">
<button id="barcode-capture-btn" onclick="takeBarcodePhoto()"></button>
</div>
</div>

<div id="barcode-result" style="margin-top: 20px; text-align: center; font-size: 18px; font-weight: bold;"></div>
</div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="food-modal" class="modal">
<div class="modal-content">
<button class="modal-close" onclick="closeModal()">✖</button>
<img id="modal-image" src="" style="width: 100%; height: 200px; object-fit: contain; background: #2c2c2e; border-radius: 12px; margin-bottom: 15
