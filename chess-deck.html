<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Chess Royale - Колода</title>
<link rel="stylesheet" href="royale.css?v=5">
<style>
body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;user-select:none;padding-bottom:88px}
body.dragging{cursor:grabbing}
.top-bar{width:100%;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;z-index:10}
.currency-row{display:flex;justify-content:center;align-items:center;gap:8px}
.currency{display:flex;align-items:center;gap:5px;padding:5px 14px;border-radius:10px;font-weight:900}
.deck-ver{font-size:10px;font-weight:900;color:#3b1f00;background:linear-gradient(180deg,#ffe082,#ffb300);padding:3px 8px;border-radius:7px;border:2px solid #fff;box-shadow:0 2px 0 #b45309;letter-spacing:.5px}
.sub-tabs{display:flex;gap:6px;margin-top:4px}
.sub-tab-btn{flex:1;padding:10px;border-radius:10px;font-weight:900;cursor:pointer;font-size:12.5px}
.screen{display:none;flex-direction:column;width:100%;align-items:center;flex:1;overflow-y:auto;padding-bottom:90px}
.screen.active{display:flex}
.deck-area{width:95vw;max-width:400px;padding:10px;display:flex;flex-direction:column;gap:10px}
.pager-note{width:100%;text-align:center;font-size:11px;font-weight:900;color:#dbe9ff;letter-spacing:.4px}
.slot-bar{display:flex;align-items:center;gap:6px;width:100%}
.slot-nav{width:38px;height:46px;flex-shrink:0;border-radius:12px!important;padding:0;cursor:pointer;font-size:20px;font-weight:900;line-height:1;color:#fff!important;background:linear-gradient(180deg,#3b8ef0,#1c56b8)!important;border:3px solid #fff!important;box-shadow:0 4px 0 #123b7a!important}
.slot-nav:active{transform:translateY(3px);box-shadow:0 1px 0 #123b7a!important}
.slot-nav:disabled{opacity:.35;filter:grayscale(.6)}
.slot-list{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;touch-action:pan-y}
.slot-btn{position:relative;height:46px;border-radius:12px!important;padding:0;cursor:pointer;font-size:16px;font-weight:900;color:#c6d8ff!important;background:linear-gradient(180deg,#22437f,#122a5e)!important;border:3px solid #4a72c0!important;box-shadow:0 4px 0 #0b1b45!important}
.slot-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0b1b45!important}
.slot-btn.on{background:linear-gradient(180deg,#ffe082,#ffb300)!important;color:#3b1f00!important;border-color:#fff!important;box-shadow:0 4px 0 #b45309!important}
.slot-btn.empty{color:#7b93bd!important}
.slot-dot{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:#43e97b;box-shadow:0 0 6px rgba(67,233,123,.9)}
.slot-btn.part .slot-dot{background:#ffd447}

.rule-banner{width:100%;box-sizing:border-box;text-align:center;font-size:11.5px;font-weight:800;line-height:1.45;color:#dbe9ff;padding:8px 10px;border-radius:12px;background:linear-gradient(180deg,#132a4d,#0a1a33);border:2px solid #2f5aa0;box-shadow:0 3px 0 #061225}
.rule-banner b{color:#5ee0ff}

.deck-note{width:100%;text-align:center;font-size:12px;color:#dbe9ff;font-weight:700;line-height:1.45;padding:0 6px}
.deck-note b{color:#43e97b}
.deck-note.warn{color:#ffd447}
.deck-picked{display:flex;gap:6px;justify-content:center;margin-top:2px;padding:5px;border-radius:12px;border:2px dashed transparent;transition:border-color .15s,background .15s}
.deck-picked.drop-on{border-color:#43e97b;background:rgba(67,233,123,.12)}
.deck-picked.drop-on .deck-slot{border-color:#43e97b;background:rgba(67,233,123,.2)}
.deck-slot{flex:1;height:38px;border-radius:9px;border:2px dashed rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:17px;color:#c6d8ff;background:rgba(2,6,23,.35)}
.deck-slot.filled{border-style:solid;border-color:#43e97b;color:#fff;background:linear-gradient(145deg,#0f6b3a,#064e26)}

.balance-line{width:100%;text-align:center;font-size:11px;font-weight:900;letter-spacing:.3px;min-height:15px;margin-top:2px;line-height:1.35}
.balance-line.good{color:#43e97b;text-shadow:0 0 10px rgba(67,233,123,.45)}
.balance-line.warn{color:#ffd447}

.deck-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:4px;padding:8px 6px 10px}
.card{border-radius:11px;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;align-items:center;position:relative;padding:4px;touch-action:pan-y;user-select:none;-webkit-user-select:none;background:linear-gradient(145deg,#0e2a3d,#071e2c);border:2px solid #5ee0ff}
.card.rare{border-color:#ffb300;background:linear-gradient(145deg,#2a2a48,#2a1a00)}
.card.epic{border-color:#b06aff;background:linear-gradient(145deg,#2a2a48,#250f3e)}
.card.common{border-color:#9aa7b8}
.card.picked{border-color:#43e97b!important}

.card-free{position:absolute;top:-7px;left:-7px;min-width:25px;height:25px;padding:0 4px;border-radius:12px;border:2px solid #fff;z-index:3;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:10px;color:#06301a;background:linear-gradient(180deg,#5ef08a,#1f9e42);box-shadow:0 3px 6px rgba(0,0,0,.65),inset 0 2px 3px rgba(255,255,255,.45)}
.card-add{position:absolute;bottom:-7px;left:-7px;width:25px;height:25px;border-radius:50%;border:2px solid #fff;background:linear-gradient(180deg,#5ef08a,#1f9e42);color:#083b1c;font-size:17px;font-weight:900;line-height:1;display:flex;align-items:center;justify-content:center;z-index:4;padding:0;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.5)}
.card-add:active{transform:scale(.88)}
.card-add.off{background:linear-gradient(180deg,#94a3b8,#475569);color:#e2e8f0;font-size:15px}
.card-info{position:absolute;top:-7px;right:-7px;width:23px;height:23px;border-radius:50%;border:2px solid #fff;background:linear-gradient(180deg,#5ea8ff,#1e63c8);color:#fff;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;z-index:4;padding:0;cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.45)}
.card-info:active{transform:scale(.9)}
.pick-order{position:absolute;bottom:-6px;right:-6px;background:linear-gradient(145deg,#5ef08a,#1f9e42);color:#083b1c;font-weight:900;font-size:11px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;z-index:5}
.card-icon{font-size:27px;margin-top:13px;color:#fff;filter:drop-shadow(0 3px 4px rgba(0,0,0,.7));line-height:1}
.card-name{font-size:9.5px;color:#fff;text-align:center;font-weight:900;line-height:1.1}
.card-role{font-size:7.5px;color:#9fb6c4;text-align:center;font-weight:800;line-height:1.1;margin-top:1px;letter-spacing:.2px}
.card-level{font-size:8px;color:#ffd447;background:rgba(0,0,0,.75);padding:2px 4px;border-radius:4px;width:92%;text-align:center;margin-top:4px;font-weight:800}

.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.95;transform:translate(-50%,-58%) scale(1.1) rotate(-4deg);filter:drop-shadow(0 14px 24px rgba(0,0,0,.8))}

.setup-area{width:95vw;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:10px}
.setup-hint{text-align:center;color:#dbe9ff;font-size:12px;margin:0;min-height:18px;padding:0 10px;line-height:1.45;font-weight:700}
.board-container{position:relative;width:100%;aspect-ratio:1/1;border:4px solid #ffd447;border-radius:14px;overflow:hidden;box-shadow:0 10px 0 #b45309,0 18px 40px rgba(0,0,0,.6);background:linear-gradient(145deg,#1a1f2e,#0f1420)}
.board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;height:100%}
.cell{position:relative;display:flex;justify-content:center;align-items:center;font-size:32px}
.cell.white{background:linear-gradient(145deg,#b8c4d4,#94a3b8 50%,#7a8ba0)}
.cell.black{background:linear-gradient(145deg,#4a5a6e,#3a4a5e 50%,#2a3a4e)}
.cell.locked{filter:brightness(.42) saturate(.3)}
.cell.setup-zone{background-color:rgba(255,212,71,.15)}
.board.edit-mode .cell.setup-zone{cursor:pointer;background-color:rgba(255,212,71,.3);animation:zonePulse 2s infinite alternate}
@keyframes zonePulse{from{background-color:rgba(255,212,71,.2)}to{background-color:rgba(255,212,71,.42)}}
.cell.selected{background:linear-gradient(145deg,#4ade80,#22c55e 60%,#15803d)!important;box-shadow:inset 0 0 12px rgba(255,255,255,.7),0 0 15px rgba(74,222,128,.8)!important}
.piece{position:relative;z-index:2;pointer-events:none;margin-bottom:8px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.8))}
.top-cost-badge{position:absolute;top:-4px;left:50%;transform:translateX(-50%);color:#fff;border-radius:50%;width:16px;height:16px;font-size:9px;font-weight:900;display:flex;justify-content:center;align-items:center;border:1.5px solid #fff;z-index:10;background:radial-gradient(circle at 34% 26%,#ff7c7c 0%,#ef2b2b 42%,#c00d0d 72%,#7d0202 100%);box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 1px 2px rgba(255,255,255,.45)}
.bottom-hp-bar{position:absolute;bottom:12px;left:5%;width:90%;height:11px;border-radius:4px;display:flex;justify-content:center;align-items:center;z-index:10;border:1px solid #000;background:linear-gradient(180deg,#34c759,#34c75999)}
.lvl-num{font-size:9px;font-weight:900;color:#000;line-height:11px}
.hp-text-below{position:absolute;bottom:1px;left:0;width:100%;text-align:center;font-size:8px;font-weight:bold;color:#fff;z-index:10;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}
.army-counts{width:100%;display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:0 8px}
.army-chip{border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;background:rgba(2,6,23,.6);border:2px solid #4a72c0;color:#c6d8ff}
.army-chip.ok{border-color:#43e97b;color:#8cf0b0}
.army-chip.bad{border-color:#f4665e;color:#ffc4c4}
.btn-action{width:100%;padding:14px;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer}
.btn-edit{background:linear-gradient(180deg,#5ea8ff,#1e63c8);color:#fff}
.btn-save{background:linear-gradient(180deg,#5ef08a,#1f9e42);color:#fff}
.btn-cancel{background:linear-gradient(180deg,#8fa8cc,#33486b);color:#fff}
.btn-reset{background:linear-gradient(180deg,#f0a35a,#a2560f);color:#fff}
.setup-buttons{width:100%;display:flex;flex-direction:column;gap:8px;padding:0 10px}
.setup-buttons-row{display:flex;gap:8px;width:100%}
.setup-buttons-row .btn-action{flex:1}
.lock-badge{display:inline-block;background:linear-gradient(180deg,#475569,#1e293b);color:#ffd447;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:900;margin-left:6px}

/* ===== МОДАЛКА КАРТЫ ===== */
#cardModal{position:fixed;inset:0;z-index:9500;display:none;align-items:flex-end;justify-content:center}
#cardModal.open{display:flex}
.cm-backdrop{position:absolute;inset:0;background:rgba(2,6,23,.86);backdrop-filter:blur(3px)}
.cm-sheet{position:relative;width:100%;max-width:420px;max-height:92vh;overflow-y:auto;background:linear-gradient(180deg,#16233d,#0a1020);border:2px solid #2f4a78;border-bottom:0;border-radius:20px 20px 0 0;padding:14px 14px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.85);animation:cmUp .25s ease-out}
@keyframes cmUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.cm-close{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:2px solid #475569;background:rgba(2,6,23,.7);color:#cbd5e1;font-size:15px;font-weight:900;cursor:pointer;z-index:3}
.cm-head{display:flex;align-items:center;gap:12px;padding-right:40px;margin-bottom:10px}
.cm-badge{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;background:linear-gradient(180deg,#22c55e,#15803d);border:2px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 2px 3px rgba(255,255,255,.45)}
.cm-name{font-size:17px;font-weight:900;line-height:1.1}
.cm-rar{font-size:11px;font-weight:800;color:#9fb6c4;margin-top:2px}
.cm-stage{position:relative;width:100%;aspect-ratio:5/3;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#0d1a2e,#060d18);border:2px solid #24446b;box-shadow:inset 0 0 30px rgba(0,0,0,.8)}
.cm-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr)}
.cm-grid i{border:1px solid rgba(90,140,200,.13)}
.cm-grid i.d{background:rgba(90,140,200,.075)}
.cm-stage.flash::before{content:'';position:absolute;inset:0;background:radial-gradient(circle,rgba(255,255,255,.6),transparent 72%);z-index:4;animation:cmFlash .32s ease-out;pointer-events:none}
@keyframes cmFlash{from{opacity:1}to{opacity:0}}
.cm-zone{position:absolute;z-index:1;pointer-events:none;animation:cmZoneIn .3s ease-out}
@keyframes cmZoneIn{from{opacity:0}to{opacity:1}}
.cm-zone.block{background:repeating-linear-gradient(45deg,rgba(148,163,184,.55) 0 6px,rgba(51,65,85,.75) 6px 12px);border:1px solid #94a3b8}
.cm-zone.home{background:rgba(94,224,255,.18);border:1px dashed #5ee0ff;animation:cmHome 1s infinite alternate}
@keyframes cmHome{from{background:rgba(94,224,255,.10)}to{background:rgba(94,224,255,.28)}}
.cm-zone.tgt{border:2px dashed #5ee0ff;box-shadow:inset 0 0 12px rgba(94,224,255,.5)}
.cm-zone.boom{background:radial-gradient(circle,rgba(255,200,80,.95),rgba(239,68,68,.55) 55%,rgba(239,68,68,0) 75%);animation:cmBoom .6s ease-out forwards}
@keyframes cmBoom{0%{opacity:0;transform:scale(.6)}30%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1)}}
.cm-piece{position:absolute;z-index:3;transform:translate(-50%,-50%);font-size:clamp(20px,7.5vw,30px);line-height:1;transition:left .42s cubic-bezier(.3,1.2,.6,1),top .42s cubic-bezier(.3,1.2,.6,1),opacity .4s;will-change:left,top}
.cm-piece.mine{color:#7cc4ff;text-shadow:0 0 10px rgba(90,169,236,.9),0 2px 4px #000}
.cm-piece.foe{color:#ff8b8b;text-shadow:0 0 10px rgba(239,83,80,.9),0 2px 4px #000}
.cm-piece.gone{opacity:0}
.cm-piece.charged{animation:cmCharge .45s infinite alternate}
@keyframes cmCharge{from{filter:brightness(1)}to{filter:brightness(1.9)}}
.cm-piece.shielded::after{content:'🛡️';position:absolute;right:-9px;top:-11px;font-size:13px;text-shadow:none}
.cm-piece.frozen::before{content:'❄️';position:absolute;left:-10px;top:-10px;font-size:13px;text-shadow:none}
.cm-piece.hit{animation:cmHit .35s ease-out}
@keyframes cmHit{0%{transform:translate(-50%,-50%) scale(1)}35%{transform:translate(-50%,-50%) scale(1.45)}100%{transform:translate(-50%,-50%) scale(1)}}
.cm-piece.shake{animation:cmShake .4s ease-in-out}
@keyframes cmShake{0%,100%{transform:translate(-50%,-50%)}25%{transform:translate(calc(-50% - 4px),-50%)}75%{transform:translate(calc(-50% + 4px),-50%)}}
.cm-piece.appear{animation:cmAppear .45s ease-out}
@keyframes cmAppear{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.cm-float{position:absolute;z-index:6;transform:translate(-50%,-50%);font-size:12px;font-weight:900;color:#ffd447;text-shadow:0 1px 4px #000,0 0 10px rgba(255,212,71,.6);animation:cmFloat 1.5s ease-out forwards;pointer-events:none;white-space:nowrap}
.cm-float.good{color:#43e97b;text-shadow:0 1px 4px #000,0 0 10px rgba(67,233,123,.7)}
@keyframes cmFloat{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%) scale(1.1)}}
.cm-cap{width:100%;text-align:center;font-size:12px;font-weight:900;color:#5ee0ff;margin:10px 0 8px;min-height:16px;line-height:1.3}
.cm-desc{font-size:12.5px;line-height:1.5;color:#dbe9ff;margin-bottom:10px}
.cm-tips{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.cm-tips li{font-size:11.5px;line-height:1.4;color:#9fb6c4;padding-left:16px;position:relative}
.cm-tips li::before{content:'▸';position:absolute;left:2px;color:#5ee0ff;font-weight:900}
.cm-add{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:900;color:#06301a;background:linear-gradient(180deg,#5ef08a,#1f9e42);cursor:pointer;box-shadow:0 5px 0 #0e6b2c}
.cm-add:active{transform:translateY(3px);box-shadow:0 2px 0 #0e6b2c}
.cm-add.remove{background:linear-gradient(180deg,#ff8a8a,#b91c1c);color:#fff;box-shadow:0 5px 0 #7f1d1d}
.cm-add.full{background:linear-gradient(180deg,#94a3b8,#475569);color:#fff;box-shadow:0 5px 0 #334155}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(135deg,#22437f,#122a5e);color:#fff;padding:14px 22px;border-radius:12px;font-weight:800;z-index:9999;border:3px solid #34c759;transition:transform .4s cubic-bezier(.4,0,.2,1);font-size:14px;text-align:center;max-width:80vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.nav{position:fixed;bottom:0;left:0;width:100%;height:68px;display:flex;justify-content:space-around;align-items:center;z-index:999;padding-bottom:env(safe-area-inset-bottom)}
.nb{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;cursor:pointer;flex:1;height:100%;gap:3px}
.nb i{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-style:normal}
.sp{width:24px;height:28px;position:relative}
.sp b{position:absolute;width:16px;height:22px;border-radius:3px;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.sp b:nth-child(1){left:0;top:6px;transform:rotate(-18deg);background:linear-gradient(135deg,#f093fb,#f5576c)}
.sp b:nth-child(2){left:4px;top:3px;transform:rotate(-8deg);background:linear-gradient(135deg,#4facfe,#00f2fe)}
.sp b:nth-child(3){left:8px;top:0;transform:rotate(4deg);background:linear-gradient(135deg,#43e97b,#38f9d7)}
</style>
</head>
<body>

<div class="top-bar">
<div class="currency-row">
<div class="currency">🪙 <span id="deck-coins">1250</span></div>
<div class="currency">💎 <span id="deck-gems">50</span></div>
<div class="deck-ver">v11</div>
</div>
<div class="sub-tabs">
<button class="sub-tab-btn active" id="sub-tab-cards-btn" onclick="switchSubTab('cards')">🃏 Карты</button>
<button class="sub-tab-btn" id="sub-tab-setup-btn" onclick="switchSubTab('setup')">⚙️ Расстановка</button>
</div>
</div>

<div id="screen-cards" class="screen active">
<div class="deck-area">
<div class="rule-banner">Карты <b>бесплатны</b>. В колоде 4 карты — каждые <b>30 сек</b> в руку выпадает одна из них. Используешь или пропускаешь — таймер запускается заново.</div>
<div class="pager-note" id="pagerNote">Колоды 1–5 из 10</div>
<div class="slot-bar">
<button class="slot-nav" id="pPrev" onclick="pagePrev()">‹</button>
<div class="slot-list" id="slotList"></div>
<button class="slot-nav" id="pNext" onclick="pageNext()">›</button>
</div>
<div class="deck-note" id="deck-note">Выбери 4 карты</div>
<div class="deck-picked" id="deck-picked"></div>
<div class="balance-line" id="balanceLine"></div>
<div class="deck-grid" id="deck-grid"></div>
</div>
</div>

<div id="screen-setup" class="screen">
<div class="setup-area">
<p class="setup-hint" id="setup-hint">Твоя расстановка</p>
<div class="army-counts" id="army-counts"></div>
<div class="board-container">
<div class="board view-mode" id="setup-board"></div>
</div>
<div class="setup-buttons">
<button id="btn-edit" class="btn-action btn-edit" onclick="enterEditMode()">✏️ Редактировать расстановку</button>
<div id="edit-controls" class="setup-buttons-row" style="display:none">

let decks=[];
let activeSlot=0;
let page=0;

function sanitize(list){
  const out=[];
  if(!Array.isArray(list)) return out;
  for(let i=0;i<list.length;i++){
    const t=String(list[i]||'').toLowerCase();
    if(SPELL_TYPES.indexOf(t)>=0 && out.indexOf(t)<0 && out.length<HAND_SIZE) out.push(t);
  }
  return out;
}

function loadDecks(){
  let arr=null;
  try{
    const raw=JSON.parse(localStorage.getItem(DECKS_KEY)||'null');
    if(Array.isArray(raw)) arr=raw;
  }catch(e){}
  const out=[];
  for(let i=0;i<SLOT_COUNT;i++){ out.push((arr&&Array.isArray(arr[i]))?sanitize(arr[i]):[]); }
  let any=false;
  for(let i=0;i<out.length;i++){ if(out[i].length) any=true; }
  if(!any) out[0]=DEFAULT_DECK.slice();
  return out;
}

function loadActive(){
  const v=parseInt(localStorage.getItem(ACTIVE_KEY)||'0',10);
  if(!isFinite(v)||v<0||v>=SLOT_COUNT) return 0;
  return v;
}

function saveDecks(){
  try{ localStorage.setItem(DECKS_KEY, JSON.stringify(decks)); }catch(e){}
  try{ localStorage.setItem(ACTIVE_KEY, String(activeSlot)); }catch(e){}
}

function currentDeck(){ return decks[activeSlot]||[]; }

function renderSlots(){
  const list=document.getElementById('slotList');
  list.innerHTML='';
  const start=page*PER_PAGE;
  for(let i=start;i<start+PER_PAGE && i<SLOT_COUNT;i++){
    const d=decks[i]||[];
    const b=document.createElement('button');
    b.className='slot-btn';
    if(i===activeSlot) b.classList.add('on');
    if(!d.length){ b.classList.add('empty'); }
    else if(d.length>=HAND_SIZE){ b.classList.add('full'); }
    else { b.classList.add('part'); }
    b.innerHTML='<span>'+(i+1)+'</span>'+(d.length?'<i class="slot-dot"></i>':'');
    (function(idx){ b.onclick=function(){ selectSlot(idx); }; })(i);
    list.appendChild(b);
  }
  document.getElementById('pPrev').disabled=(page<=0);
  document.getElementById('pNext').disabled=(page>=Math.ceil(SLOT_COUNT/PER_PAGE)-1);
  document.getElementById('pagerNote').textContent='Колоды ' + (start+1) + '–' + Math.min(start+PER_PAGE,SLOT_COUNT) + ' из ' + SLOT_COUNT;
}

function selectSlot(i){
  if(i<0||i>=SLOT_COUNT) return;
  activeSlot=i;
  saveDecks();
  renderSlots();
  renderDeck();
}

function pagePrev(){ if(page<=0) return; page--; renderSlots(); }
function pageNext(){ if(page>=Math.ceil(SLOT_COUNT/PER_PAGE)-1) return; page++; renderSlots(); }

(function initSwipe(){
  const el=document.getElementById('slotList');
  if(!el) return;
  let x0=null, y0=null;
  el.addEventListener('touchstart',function(e){
    if(!e.touches||!e.touches.length) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY;
  },{passive:true});
  el.addEventListener('touchend',function(e){
    if(x0===null) return;
    const t=(e.changedTouches&&e.changedTouches[0])||null;
    if(!t) return;
    const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0) pageNext(); else pagePrev();
    }
    x0=null; y0=null;
  },{passive:true});
})();

/* ================= ДОБАВЛЕНИЕ И УДАЛЕНИЕ ================= */

function addCard(type){
  const d=currentDeck();
  if(d.indexOf(type)>=0){ showToast(cardName(type)+' уже в колоде','#ffd447'); return false; }
  if(d.length>=HAND_SIZE){ showToast('В колоде уже 4 карты — убери одну','#ffb300'); return false; }
  d.push(type);
  saveDecks();
  renderDeck();
  renderSlots();
  return true;
}

function removeCard(type){
  const d=currentDeck();
  const i=d.indexOf(type);
  if(i<0) return false;
  d.splice(i,1);
  saveDecks();
  renderDeck();
  renderSlots();
  return true;
}

function toggleCard(type){
  if(currentDeck().indexOf(type)>=0) removeCard(type);
  else addCard(type);
}

function cardName(t){
  for(let i=0;i<DECK_CARDS.length;i++) if(DECK_CARDS[i].type===t) return DECK_CARDS[i].name;
  return t;
}

/* ================= ПЕРЕТАСКИВАНИЕ ================= */

let dragState=null;
let suppressClickUntil=0;

function deckRect(){
  const el=document.getElementById('deck-picked');
  if(!el) return null;
  const r=el.getBoundingClientRect();
  const pad=14;
  return { left:r.left-pad, right:r.right+pad, top:r.top-pad, bottom:r.bottom+pad };
}

function isOverDeck(x,y){
  const r=deckRect();
  if(!r) return false;
  return x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
}

function cleanupDrag(){
  if(!dragState){ return; }
  clearTimeout(dragState.timer);
  if(dragState.ghost && dragState.ghost.parentNode) dragState.ghost.parentNode.removeChild(dragState.ghost);
  const picked=document.getElementById('deck-picked');
  if(picked) picked.classList.remove('drop-on');
  document.body.classList.remove('dragging');
  dragState=null;
}

function activateDrag(){
  const d=dragState;
  if(!d||d.active) return;
  d.active=true;
  document.body.classList.add('dragging');
  const r=d.card.getBoundingClientRect();
  const g=d.card.cloneNode(true);
  g.className=d.card.className+' drag-ghost';
  g.style.width=r.width+'px';
  g.style.height=r.height+'px';
  g.style.left=d.x+'px';
  g.style.top=d.y+'px';
  document.body.appendChild(g);
  d.ghost=g;
  const picked=document.getElementById('deck-picked');
  if(picked) picked.classList.add('drop-on');
  if(navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}

function cardPointerDown(e){
  if(e.button && e.button!==0) return;
  const card=e.currentTarget;
  const type=card.dataset.type;
  if(!type) return;
  if(e.target.closest('.card-add')||e.target.closest('.card-info')) return;

  cleanupDrag();
  dragState={
    type:type, card:card,
    x0:e.clientX, y0:e.clientY,
    x:e.clientX, y:e.clientY,
    active:false, ghost:null, id:e.pointerId,
    timer:setTimeout(activateDrag,190)
  };
  try{ card.setPointerCapture(e.pointerId); }catch(err){}
}

function cardPointerMove(e){
  const d=dragState;
  if(!d) return;
  d.x=e.clientX; d.y=e.clientY;

  if(!d.active){
    const dx=e.clientX-d.x0, dy=e.clientY-d.y0;
    if(Math.abs(dx)>12||Math.abs(dy)>12){
      clearTimeout(d.timer);
      dragState=null;
    }
    return;
  }

  if(e.cancelable) e.preventDefault();
  if(d.ghost){
    d.ghost.style.left=d.x+'px';
    d.ghost.style.top=d.y+'px';
  }
  const picked=document.getElementById('deck-picked');
  if(picked) picked.classList.toggle('drop-on', isOverDeck(d.x,d.y));
}

function cardPointerUp(e){
  const d=dragState;
  if(!d) return;
  clearTimeout(d.timer);

  if(d.active){
    const over=isOverDeck(e.clientX,e.clientY);
    const type=d.type;
    cleanupDrag();
    if(over) addCard(type);
    suppressClickUntil=Date.now()+450;
  } else {
    cleanupDrag();
  }
}

document.addEventListener('pointermove',cardPointerMove,{passive:false});
document.addEventListener('pointerup',cardPointerUp);
document.addEventListener('pointercancel',function(){ cleanupDrag(); });
document.addEventListener('touchmove',function(e){
  if(dragState&&dragState.active&&e.cancelable) e.preventDefault();
},{passive:false});

/* ================= ОТРИСОВКА ================= */

function renderDeck(){
  const d=currentDeck();
  const grid=document.getElementById('deck-grid');
  grid.innerHTML='';

  DECK_CARDS.forEach(function(card){
    const cardDiv=document.createElement('div');
    const picked=d.indexOf(card.type);
    cardDiv.className='card '+card.rarity+(picked>=0?' picked':'');
    cardDiv.dataset.type=card.type;

    const order=(picked>=0)?'<div class="pick-order">'+(picked+1)+'</div>':'';
    const addBtn='<button class="card-add'+(picked>=0?' off':'')+'" data-add="'+card.type+'">'+(picked>=0?'✓':'+')+'</button>';
    const infoBtn='<button class="card-info" data-info="'+card.type+'">i</button>';

    cardDiv.innerHTML=
      infoBtn+
      '<div class="card-free">0</div>'+
      order+
      '<div class="card-icon">'+card.icon+'</div>'+
      '<div class="card-name">'+card.name+'</div>'+
      '<div class="card-role">'+card.role+'</div>'+
      '<div class="card-level">бесплатно</div>'+
      addBtn;

    const ib=cardDiv.querySelector('.card-info');
    if(ib){ ib.onclick=function(ev){ ev.stopPropagation(); openCardModal(card.type); }; }

    const ab=cardDiv.querySelector('.card-add');
    if(ab){
      ab.onclick=function(ev){
        ev.stopPropagation();
        if(currentDeck().indexOf(card.type)>=0) removeCard(card.type);
        else addCard(card.type);
      };
    }

    cardDiv.addEventListener('pointerdown',cardPointerDown);
    cardDiv.onclick=function(){
      if(Date.now()<suppressClickUntil) return;
      toggleCard(card.type);
    };

    grid.appendChild(cardDiv);
  });

  const pickedBox=document.getElementById('deck-picked');
  pickedBox.innerHTML='';
  for(let i=0;i<HAND_SIZE;i++){
    const slot=document.createElement('div');
    const t=d[i];
    if(t){ slot.className='deck-slot filled'; slot.textContent=DECK_CARDS.find(function(c){return c.type===t;}).icon; }
    else{ slot.className='deck-slot'; slot.textContent='—'; }
    pickedBox.appendChild(slot);
  }

  const note=document.getElementById('deck-note');
  if(d.length===HAND_SIZE){
    const names=d.map(cardName).join(' · ');
    note.className='deck-note';
    note.innerHTML='Колода ' + (activeSlot+1) + ' готова: <b>'+names+'</b>';
  }else{
    note.className='deck-note warn';
    note.innerHTML='Колода ' + (activeSlot+1) + ': ' + d.length + ' из 4 — тапни «+» или перетащи карту вверх';
  }

  const bl=document.getElementById('balanceLine');
  if(d.length<HAND_SIZE){
    bl.className='balance-line';
    bl.textContent='';
  }else{
    const covered=[];
    const missing=[];
    Object.keys(ROLE_OF).forEach(function(role){
      const has=d.some(function(t){ return ROLE_OF[role].indexOf(t)>=0; });
      if(has) covered.push(ROLE_TITLE[role]); else missing.push(ROLE_TITLE[role]);
    });
    if(!missing.length){
      bl.className='balance-line good';
      bl.textContent='Идеальный баланс: покрыты все роли';
    }else{
      bl.className='balance-line warn';
      bl.textContent='Нет: '+missing.join(', ')+' · есть: '+(covered.join(', ')||'ничего');
    }
  }
}

  a.cap('Перевербовка: вражеская пешка становится твоей');
  const t=a.piece('♟','foe',3,1);
  a.at(300,function(){ a.zone(3,1,3,1,'tgt',600); });
  a.at(800,function(){ t.className='cm-piece mine'; t.textContent='♟'; a.fx(t,'моя!','good'); });
},
b:function(a){
  a.cap('Блокада: клетка закрыта на 12 секунд');
  a.zone(2,1,2,1,'block',0);
  const n=a.piece('♞','foe',4,0);
  a.at(600,function(){ n.classList.add('shake'); a.fx(n,'нельзя','good'); a.cap('Враг не может войти в клетку'); });
},
e:function(a){
  a.cap('Взрыв: 3×3 — враг теряет лёгкие фигуры');
  const pawn=a.piece('♟','foe',1,0);
  const bis=a.piece('♝','foe',3,2);
  const q=a.piece('♛','foe',4,1);
  a.piece('♞','mine',1,2);
  a.at(300,function(){ a.zone(1,0,3,2,'boom',600); a.flash(); });
  a.at(420,function(){ a.kill(pawn); a.kill(bis); });
  a.at(900,function(){ a.fx(q,'ферзь цел'); a.cap('Ферзь и ладьи взрыв не трогает'); });
}
};

function clearDemo(){
  for(let i=0;i<demoTimers.length;i++) clearTimeout(demoTimers[i]);
  demoTimers=[];
  if(demoLoop){ clearInterval(demoLoop); demoLoop=null; }
}

function buildStage(){
  const st=document.getElementById('cmStage');
  st.classList.remove('flash');
  st.innerHTML='';
  const g=document.createElement('div');
  g.className='cm-grid';
  for(let r=0;r<3;r++) for(let c=0;c<5;c++){
    const i=document.createElement('i');
    if((r+c)%2===0) i.className='d';
    g.appendChild(i);
  }
  st.appendChild(g);
  return st;
}

function runDemo(type){
  for(let i=0;i<demoTimers.length;i++) clearTimeout(demoTimers[i]);
  demoTimers=[];

  const st=buildStage();
  const px=function(c){ return ((c+0.5)/5*100)+'%'; };
  const py=function(r){ return ((r+0.5)/3*100)+'%'; };

  const api={
    cap:function(t){ document.getElementById('cmCaption').textContent=t||''; },
    at:function(ms,fn){ demoTimers.push(setTimeout(fn,ms)); },
    piece:function(icon,cls,c,r){
      const el=document.createElement('div');
      el.className='cm-piece '+cls;
      el.textContent=icon;
      el.style.left=px(c);
      el.style.top=py(r);
      st.appendChild(el);
      return el;
    },
    move:function(el,c,r){ el.style.left=px(c); el.style.top=py(r); },
    kill:function(el){ el.classList.add('gone'); },
    zone:function(c0,r0,c1,r1,kind,ms){
      const z=document.createElement('div');
      z.className='cm-zone '+kind;
      z.style.left=(c0/5*100)+'%';
      z.style.top=(r0/3*100)+'%';
      z.style.width=((c1-c0+1)/5*100)+'%';
      z.style.height=((r1-r0+1)/3*100)+'%';
      st.appendChild(z);
      if(ms) demoTimers.push(setTimeout(function(){ if(z.parentNode) z.parentNode.removeChild(z); },ms));
      return z;
    },
    fx:function(el,text,cls){
      const f=document.createElement('div');
      f.className='cm-float '+(cls||'');
      f.textContent=text;
      f.style.left=el.style.left;
      f.style.top=el.style.top;
      st.appendChild(f);
      demoTimers.push(setTimeout(function(){ if(f.parentNode) f.parentNode.removeChild(f); },1500));
    },
    flash:function(){
      st.classList.add('flash');
      demoTimers.push(setTimeout(function(){ st.classList.remove('flash'); },330));
    }
  };

  const fn=DEMOS[type];
  if(fn) fn(api);
  else api.cap('Демонстрация скоро появится');
}

function openCardModal(type){
  let def=null;
  for(let i=0;i<DECK_CARDS.length;i++) if(DECK_CARDS[i].type===type) def=DECK_CARDS[i];
  if(!def) return;

  demoType=type;
  clearDemo();

  document.getElementById('cmBadge').textContent=def.icon;
  document.getElementById('cmName').textContent=def.name;
  document.getElementById('cmRar').textContent=(RARITY_NAME[def.rarity]||'Обычная')+' · бесплатно · роль: '+def.role;
  document.getElementById('cmDesc').textContent=(CARD_INFO[type]&&CARD_INFO[type].desc)||'';
  document.getElementById('cmCaption').textContent='';

  const tips=document.getElementById('cmTips');
  tips.innerHTML='';
  const list=(CARD_INFO[type]&&CARD_INFO[type].tips)||[];
  for(let i=0;i<list.length;i++){
    const li=document.createElement('li');
    li.textContent=list[i];
    tips.appendChild(li);
  }

  updateModalAdd();

  document.getElementById('cardModal').classList.add('open');
  runDemo(type);
  demoLoop=setInterval(function(){ runDemo(type); },4200);
}

function updateModalAdd(){
  const btn=document.getElementById('cmAdd');
  if(!demoType) return;
  const inDeck=currentDeck().indexOf(demoType)>=0;
  const full=currentDeck().length>=HAND_SIZE;

  btn.classList.remove('remove','full');

  if(inDeck){
    btn.textContent='Убрать из колоды';
    btn.classList.add('remove');
  }else if(full){
    btn.textContent='Колода заполнена — убери карту';
    btn.classList.add('full');
  }else{
    btn.textContent='Добавить в колоду';
  }
}

function modalAddTap(){
  if(!demoType) return;
  if(currentDeck().indexOf(demoType)>=0) removeCard(demoType);
  else addCard(demoType);
  updateModalAdd();
}

function closeCardModal(){
  clearDemo();
  demoType=null;
  document.getElementById('cardModal').classList.remove('open');
  const st=document.getElementById('cmStage');
  if(st) st.innerHTML='';
}

/* ================= РАССТАНОВКА ================= */

const SETUP_KEY='chessSetup';
const SETUP_ROWS=[6,7];
const ARMY_MAX={p:8,r:2,n:2,b:2,q:1,k:1};
const ARMY_ORDER=['p','n','b','r','q','k'];

function defaultArmed(){
  const empty=[null,null,null,null,null,null,null,null];
  return [empty.slice(),empty.slice(),empty.slice(),empty.slice(),empty.slice(),empty.slice(),
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']];
}

let setupBoard=[];
let selectedSetupCell=null;
let editMode=false;
let snapshotBeforeEdit=null;

function blankBoard(){return Array.from({length:8},function(){return Array(8).fill(null);});}

function armyCounts(board){
  const cnt={p:0,r:0,n:0,b:0,q:0,k:0};
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const v=board[r][c];if(!v)continue;
    const s=String(v);if(s!==s.toUpperCase())continue;
    const t=s.toLowerCase();if(cnt[t]!==undefined)cnt[t]++;
  }
  return cnt;
}
function armyExact(board){
  const cnt=armyCounts(board);
  for(let i=0;i<ARMY_ORDER.length;i++){const t=ARMY_ORDER[i];if(cnt[t]!==ARMY_MAX[t])return false;}
  return true;
}
function normalize(raw){
  if(!Array.isArray(raw)||raw.length!==8)return null;
  const out=blankBoard();
  for(let k=0;k<SETUP_ROWS.length;k++){
    const r=SETUP_ROWS[k];
    if(!Array.isArray(raw[r])||raw[r].length!==8)return null;
    for(let c=0;c<8;c++){
      const v=raw[r][c];if(!v)continue;
      const s=String(v);if(!/^[prnbqk]$/i.test(s))return null;
      out[r][c]=s.toUpperCase();
    }
  }
  return armyExact(out)?out:null;
}

function initSetup(){
  let data=null;
  try{data=normalize(JSON.parse(localStorage.getItem(SETUP_KEY)||'null'));}catch(e){}
  setupBoard=data||defaultArmed();
  selectedSetupCell=null;editMode=false;
  updateSetupUI();renderSetupBoard();renderArmyCounts();
}

function renderArmyCounts(){
  const box=document.getElementById('army-counts');if(!box)return;
  const cnt=armyCounts(setupBoard);box.innerHTML='';
  for(let i=0;i<ARMY_ORDER.length;i++){
    const t=ARMY_ORDER[i];const chip=document.createElement('div');
    const ok=(cnt[t]===ARMY_MAX[t]);
    chip.className='army-chip '+(ok?'ok':'bad');
    chip.textContent=PIECES[t].icon+' '+cnt[t]+'/'+ARMY_MAX[t];
    box.appendChild(chip);
  }
}

function updateSetupUI(){
  const hint=document.getElementById('setup-hint');
  const btnEdit=document.getElementById('btn-edit');
  const editControls=document.getElementById('edit-controls');
  const boardEl=document.getElementById('setup-board');
  if(editMode){
    btnEdit.style.display='none';editControls.style.display='flex';
    boardEl.classList.remove('view-mode');boardEl.classList.add('edit-mode');
    hint.innerHTML='✏️ Тапни фигуру, потом другую — они поменяются местами. Только два нижних ряда.';
  }else{
    btnEdit.style.display='block';editControls.style.display='none';
    boardEl.classList.remove('edit-mode');boardEl.classList.add('view-mode');
    hint.innerHTML='Эта расстановка пойдёт с тобой в бой <span class="lock-badge">🔒 Закреплено</span>';
  }
}

function renderSetupBoard(){
  const boardEl=document.getElementById('setup-board');if(!boardEl)return;
  boardEl.innerHTML='';
  for(let r=0;r<8;r++)for(let c=0;c<8;c++){
    const cell=document.createElement('div');
    cell.className='cell '+((r+c)%2===0?'white':'black');
    const inZone=(r===6||r===7);
    if(inZone)cell.classList.add('setup-zone');else cell.classList.add('locked');
    if(selectedSetupCell&&selectedSetupCell.r===r&&selectedSetupCell.c===c)cell.classList.add('selected');
    cell.onclick=(function(rr,cc){return function(){handleSetupClick(rr,cc);};})(r,c);
    const v=setupBoard[r][c];
    if(v){
      const t=String(v).toLowerCase();const p=PIECES[t];
      const pieceEl=document.createElement('div');
      pieceEl.className='piece';pieceEl.innerText=p.icon;pieceEl.style.color='#fff';
      pieceEl.style.textShadow='0 1px 0 #666,0 2px 0 #444,0 3px 4px rgba(0,0,0,.9)';
      const costBadge=document.createElement('div');
      costBadge.className='top-cost-badge';costBadge.innerText=p.cost;
      const hpBar=document.createElement('div');
      hpBar.className='bottom-hp-bar';hpBar.innerHTML='<span class="lvl-num">1</span>';
      const hpText=document.createElement('div');
      hpText.className='hp-text-below';hpText.innerText='1/1';
      cell.appendChild(pieceEl);cell.appendChild(costBadge);cell.appendChild(hpBar);cell.appendChild(hpText);
    }
    boardEl.appendChild(cell);
  }
}

function handleSetupClick(r,c){
  if(!editMode)return;
  if(r!==6&&r!==7){showToast('Только два нижних ряда','#ffb300');return;}
  if(!selectedSetupCell){
    if(!setupBoard[r][c]){showToast('Тут пусто — выбери фигуру','#ffb300');return;}
    selectedSetupCell={r:r,c:c};renderSetupBoard();return;
  }
  if(selectedSetupCell.r===r&&selectedSetupCell.c===c){selectedSetupCell=null;renderSetupBoard();return;}
  const a=setupBoard[selectedSetupCell.r][selectedSetupCell.c];
  const b=setupBoard[r][c];
  setupBoard[r][c]=a;setupBoard[selectedSetupCell.r][selectedSetupCell.c]=b;
  selectedSetupCell=null;renderSetupBoard();renderArmyCounts();
}

function enterEditMode(){
  snapshotBeforeEdit=setupBoard.map(function(row){return row.slice();});
  editMode=true;selectedSetupCell=null;updateSetupUI();renderSetupBoard();
}
function cancelEdit(){
  if(snapshotBeforeEdit)setupBoard=snapshotBeforeEdit.map(function(row){return row.slice();});
  editMode=false;selectedSetupCell=null;snapshotBeforeEdit=null;
  updateSetupUI();renderSetupBoard();renderArmyCounts();
  showToast('Изменения отменены','#ffb300');
}
function resetSetup(){
  if(!editMode)return;
  setupBoard=defaultArmed();selectedSetupCell=null;
  renderSetupBoard();renderArmyCounts();
  showToast('Стандартная расстановка','#5ea8ff');
}
function saveSetup(){
  if(!armyExact(setupBoard)){
    showToast('Состав как в шахматах: 8 пешек, 2 ладьи, 2 коня, 2 слона, ферзь, король','#f4665e');
    return;
  }
  const save=blankBoard();
  for(let c=0;c<8;c++){save[7][c]=setupBoard[7][c];save[6][c]=setupBoard[6][c];}
  for(let c=0;c<8;c++){
    const top=save[7][c],bot=save[6][c];
    save[0][c]=top?String(top).toLowerCase():null;
    save[1][c]=bot?String(bot).toLowerCase():null;
  }
  try{localStorage.setItem(SETUP_KEY,JSON.stringify(save));}
  catch(e){showToast('Не удалось сохранить','#f4665e');return;}
  setupBoard=save;editMode=false;selectedSetupCell=null;snapshotBeforeEdit=null;
  updateSetupUI();renderSetupBoard();renderArmyCounts();
  showToast('✅ Расстановка сохранена!','#43e97b');
}

function showToast(msg,color){
  const toast=document.createElement('div');
  toast.className='toast';toast.style.borderColor=color;
  toast.style.boxShadow='0 10px 30px rgba(0,0,0,.8),0 0 20px '+color+'66';
  toast.innerText=msg;document.body.appendChild(toast);
  setTimeout(function(){toast.classList.add('show');},50);
  setTimeout(function(){toast.classList.remove('show');setTimeout(function(){toast.remove();},400);},2400);
}

decks=loadDecks();
activeSlot=loadActive();
page=Math.floor(activeSlot/PER_PAGE);

saveDecks();
renderSlots();
renderDeck();
initSetup();
setTimeout(function(){switchSubTab('cards');},0);
