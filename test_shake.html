<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Тест тряски</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding-top: 50px; }
    #shakeValue { font-size: 80px; font-weight: bold; color: #ffcc00; margin: 20px 0; }
    .btn { background: #34c759; color: white; padding: 20px; border: none; border-radius: 15px; font-size: 20px; margin: 10px; }
</style>
</head>
<body>
    <h1>Тест тряски (Акселерометр)</h1>
    <p>Нажми кнопку и потряси телефон.</p>
    <div id="shakeValue">0</div>
    <button class="btn" onclick="startTest()">НАЧАТЬ</button>
    <button class="btn" style="background: #ff3b30;" onclick="stopTest()">СТОП</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let shakeData = 0;
        let isTesting = false;
        let intervalId = null;

        function startTest() {
            isTesting = true;
            shakeData = 0;
            
            // Слушаем датчик движения
            window.addEventListener('devicemotion', function(event) {
                if (!isTesting) return;
                const acc = event.accelerationIncludingGravity;
                if (acc) {
                    // Считаем силу тряски (по осям X и Y)
                    const force = Math.abs(acc.x || 0) + Math.abs(acc.y || 0) + Math.abs(acc.z || 0);
                    shakeData = Math.round(force);
                    document.getElementById('shakeValue').innerText = shakeData;
                }
            });

            // Если через 10 секунд ничего не произошло — предупреждаем
            setTimeout(() => {
                if (isTesting && shakeData === 0) {
                    tg.showAlert("Телефон не видит движения. Возможно, Telegram не дал доступ к датчикам, или ты не трясешь телефон.");
                }
            }, 10000);
        }

        function stopTest() {
            isTesting = false;
            tg.showAlert("Тест завершен. Максимальная тряска: " + shakeData);
        }
    </script>
</body>
</html>
