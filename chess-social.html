<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Chess Royale - Клан</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:radial-gradient(circle at center,#1e293b 0%,#0f172a 100%);color:#fff;min-height:100vh;min-height:100dvh;padding-bottom:80px;user-select:none}
.hidden{display:none!important}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
.page-title{font-size:20px;font-weight:900;letter-spacing:.5px}
.currency{display:flex;align-items:center;gap:5px;background:rgba(0,0,0,.6);padding:5px 12px;border-radius:10px;font-size:13px;font-weight:bold;color:#ffcc00;border:1px solid #ffcc00}
.tabs{display:flex;gap:6px;padding:6px 12px 10px}
.tab{flex:1;padding:10px 4px;border-radius:10px;border:1px solid #334155;background:linear-gradient(145deg,#1e293b,#0f172a);color:#94a3b8;font-size:12.5px;font-weight:900;cursor:pointer}
.tab.on{background:linear-gradient(145deg,#ffcc00,#ff9500);color:#000;border-color:#fff}
.banner{margin:0 12px 12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#5b21b6);display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.banner-text{font-size:13px;font-weight:900;line-height:1.3}
.banner-btn{background:#fff;color:#4c1d95;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap}
#app{padding:0 12px 20px}
.section-title{text-align:center;font-size:12.5px;font-weight:900;letter-spacing:1px;color:#cbd5e1;margin:14px 0 12px;display:flex;align-items:center;gap:10px}
.section-title::before,.section-title::after{content:'';flex:1;height:1px;background:#334155}
.clan-card{display:flex;align-items:center;gap:12px;background:linear-gradient(145deg,#1e293b,#131c2e);border:2px solid #334155;border-radius:14px;padding:12px;margin-bottom:10px}
.clan-emblem{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25)}
.clan-info{flex:1;min-width:0}
.clan-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clan-tag{color:#fbbf24;font-size:12px}
.clan-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.clan-join{border:0;border-radius:10px;padding:9px 14px;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}
.clan-join:disabled{background:#334155;color:#64748b;opacity:.7}
.btn-wide{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(145deg,#22c55e,#15803d);box-shadow:0 6px 16px rgba(34,197,94,.3);margin-top:8px}
.btn-wide.grey{background:linear-gradient(145deg,#475569,#1e293b);box-shadow:none}
.btn-wide.red{background:linear-gradient(145deg,#ef4444,#991b1b);box-shadow:0 6px 16px rgba(239,68,68,.3)}
.btn-wide.blue{background:linear-gradient(145deg,#3b82f6,#1d4ed8);box-shadow:0 6px 16px rgba(59,130,246,.3)}
.my-head{display:flex;align-items:center;gap:14px;background:linear-gradient(145deg,#f59e0b,#b45309);border:2px solid #fbbf24;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 10px 26px rgba(245,158,11,.28)}
.my-emblem{width:62px;height:62px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.6)}
.my-name{font-size:18px;font-weight:900;color:#fff;line-height:1.2}
.my-desc{font-size:11.5px;color:#fff3d6;margin-top:4px;line-height:1.35}
.my-cap{font-size:11.5px;color:#fff8e0;margin-top:6px;font-weight:700}
.cap-bar{height:8px;background:rgba(0,0,0,.35);border-radius:5px;overflow:hidden;margin-top:8px}
.cap-fill{height:100%;background:#fff;border-radius:5px;transition:width .3s}
.member{display:flex;align-items:center;gap:9px;background:linear-gradient(145deg,#1e293b,#131c2e);border:1px solid #334155;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.member.me{border-color:#22c55e;box-shadow:0 0 14px rgba(34,197,94,.25)}
.m-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.4);border:1px solid #475569}
.m-info{flex:1;min-width:0}
.m-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-role{font-size:10.5px;color:#fbbf24;font-weight:800;margin-top:1px}
.m-cups{font-size:11.5px;color:#ffcc00;font-weight:900;white-space:nowrap}
.mini{border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:900;padding:7px 9px;cursor:pointer;white-space:nowrap}
.mini.play{background:linear-gradient(145deg,#22c55e,#15803d)}
.mini.add{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.mini.kick{background:linear-gradient(145deg,#ef4444,#991b1b)}
.chat-box{background:linear-gradient(145deg,#131c2e,#0f172a);border:1px solid #334155;border-radius:12px;padding:10px;height:calc(100dvh - 320px);min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px 10px;max-width:92%}
.msg.mine{align-self:flex-end;background:#14532d;border-color:#166534}
.msg-head{font-size:10px;color:#94a3b8;font-weight:800;margin-bottom:3px}
.msg-text{font-size:12.5px;line-height:1.4;word-break:break-word}
.msg-replay{font-size:11.5px;color:#cbd5e1;margin-bottom:6px}
.msg-btn{width:100%;padding:8px;border:0;border-radius:8px;background:linear-gradient(145deg,#ffcc00,#ff9500);color:#000;font-size:11.5px;font-weight:900;cursor:pointer}
.chat-row{display:flex;gap:6px;margin-top:10px}
.chat-row input{flex:1;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none}
.chat-row button{padding:0 16px;border:0;border-radius:10px;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.94);display:flex;align-items:center;justify-content:center;padding:18px;z-index:1000;overflow-y:auto}
.modal-box{width:100%;max-width:380px;background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #334155;border-radius:16px;padding:18px;max-height:86vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:900;margin-bottom:12px;text-align:center}
.emblem-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.emblem-opt{width:42px;height:42px;border-radius:12px;border:2px solid #334155;background:#0f172a;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emblem-opt.on{border-color:#22c55e;background:#064e3b}
.modal-box input,.modal-box textarea{width:100%;margin-bottom:10px;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none}
.modal-box textarea{resize:none;height:64px}
.modal-btns{display:flex;gap:8px;margin-top:6px}
.modal-btns button{flex:1;padding:13px;border:0;border-radius:10px;font-size:14px;font-weight:900;cursor:pointer;color:#fff}
#createCancel,#addCancel,#shareCancel{background:linear-gradient(145deg,#475569,#1e293b)}
#createOk,#addSearch{background:linear-gradient(145deg,#22c55e,#15803d)}
.empty{text-align:center;color:#64748b;font-size:13px;padding:22px 10px;line-height:1.5}
.errbox{margin:0 12px 12px;padding:12px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid #7f1d1d;color:#fecaca;font-size:11.5px;line-height:1.45;word-break:break-word}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;border:1px solid #475569;color:#ffcc00;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:1100;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:68px;background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1e 100%);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center;z-index:999;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{background:transparent;border:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;cursor:pointer;flex:1;height:100%;gap:3px}
.nav-btn .icon-wrap{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2a2a3e,#15151f)}
.nav-btn .icon{font-size:20px}
.nav-btn.active{color:#ffcc00}
.nav-btn.active .icon-wrap{background:linear-gradient(145deg,#ffcc00,#ff9500)}
.deck-stack{position:relative;width:24px;height:28px}
.deck-stack .deck-card{position:absolute;width:16px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.5)}
.deck-stack .deck-card:nth-child(1){left:0;top:6px;transform:rotate(-18deg);background:linear-gradient(135deg,#f093fb,#f5576c)}
.deck-stack .deck-card:nth-child(2){left:4px;top:3px;transform:rotate(-8deg);background:linear-gradient(135deg,#4facfe,#00f2fe)}
.deck-stack .deck-card:nth-child(3){left:8px;top:0;transform:rotate(4deg);background:linear-gradient(135deg,#43e97b,#38f9d7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
</style>
</head>
<body>

<div class="top-bar">
  <div class="page-title">Клан</div>
  <div class="currency">🏆 <span id="cupsTop">0</span></div>
</div>

<div class="tabs">
  <button class="tab on" data-tab="clan">Клан</button>
  <button class="tab" data-tab="friends">Друзья</button>
  <button class="tab" data-tab="chat">Чат</button>
</div>

<div class="banner" id="banner">
  <div class="banner-text">Вступи в клан или создай новый!</div>
  <button class="banner-btn" id="bannerBtn">Создать</button>
</div>

<div id="errBox" class="errbox hidden"></div>
<div id="app"></div>

<div id="createModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">Новый клан</div>
    <div class="emblem-row" id="emblemRow"></div>
    <input id="inName" type="text" maxlength="20" placeholder="Название клана">
    <input id="inTag" type="text" maxlength="5" placeholder="Тег (до 5 символов)">
    <textarea id="inDesc" maxlength="90" placeholder="Описание (необязательно)"></textarea>
    <div class="modal-btns">
      <button id="createCancel">Отмена</button>
      <button id="createOk">Создать</button>
    </div>
  </div>
</div>

<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">Добавить друга</div>
    <input id="inNick" type="text" maxlength="16" placeholder="Ник игрока">
    <div class="modal-btns">
      <button id="addCancel">Отмена</button>
      <button id="addSearch">Найти</button>
    </div>
    <div id="addResults"></div>
  </div>
</div>

<div id="shareModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">Отправить повтор в чат</div>
    <div id="shareList"></div>
    <div class="modal-btns">
      <button id="shareCancel">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="bottom-nav">
  <button class="nav-btn" onclick="window.location.href='chess-shop.html'"><div class="icon-wrap"><span class="icon">🎁</span></div><span>Магазин</span></button>
  <button class="nav-btn" onclick="window.location.href='chess-deck.html'"><div class="icon-wrap"><div class="deck-stack"><div class="deck-card"></div><div class="deck-card"></div><div class="deck-card">♠</div></div></div><span>Колода</span></button>
  <button class="nav-btn" onclick="window.location.href='chess-main.html'"><div class="icon-wrap"><span class="icon">⚔️</span></div><span>Бой</span></button>
  <button class="nav-btn active" onclick="window.location.href='chess-social.html'"><div class="icon-wrap"><span class="icon">🛡️</span></div><span>Клан</span></button>
  <button class="nav-btn" onclick="window.location.href='leaderboard.html'"><div class="icon-wrap"><span class="icon">🏆</span></div><span>Рейтинг</span></button>
</div>

<script src="friends.js?v=2"></script>
<script>
const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);

const $ = function (id){ return document.getElementById(id); };

const MAX_MEMBERS = 30;
const EMBLEMS = ['🛡️','👑','⚔️','🐺','🦅','🔥','💀','🐉','⭐','🦁','⚡','♟️'];

let meKey = '';
let meName = 'Игрок';
let meCups = 0;

let myMember = null;
let myClan = null;
let allClans = [];
let allMembers = [];

let friendsList = [];
let shareRows = [];

let activeTab = 'clan';
let pickedEmblem = '🛡️';

let chatTimer = null;
let chatMsgs = [];

let toastTimer = null;
function showToast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ t.classList.remove('show'); }, 2200);
}

function showErr(text){
  const box = $('errBox');
  if (!text){ box.classList.add('hidden'); box.textContent = ''; return; }
  box.textContent = text;
  box.classList.remove('hidden');
}

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function playerName(){
  return localStorage.getItem('userName') || 'Игрок';
}

function esc(s){
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ================= ЗАГРУЗКА ================= */

async function boot(){
  meKey = playerKey();
  meName = playerName();
  meCups = parseInt(localStorage.getItem('cr_trophies') || '0', 10) || 0;

  $('cupsTop').textContent = meCups;

  try {
    const res = await sb.rpc('arena_ensure_player', {
      p_key: meKey, p_name: meName, p_seed: 0
    });

    if (!res.error && res.data){
      meCups = res.data.cups || 0;
      if (res.data.display_name) meName = res.data.display_name;
    }
  } catch (e){}

  $('cupsTop').textContent = meCups;
  localStorage.setItem('cr_trophies', String(meCups));

  await loadAll();
  await loadFriends();
}

async function loadAll(){
  showErr('');

  const membersRes = await sb.from('clan_members').select('*');
  if (membersRes.error){
    showErr('Таблицы кланов не созданы.\n' + membersRes.error.message);
    allMembers = [];
  } else {
    allMembers = membersRes.data || [];
  }

  const clansRes = await sb.from('clans').select('*').order('created_at', { ascending: false });
  allClans = clansRes.error ? [] : (clansRes.data || []);

  myMember = null;
  for (let i = 0; i < allMembers.length; i++){
    if (allMembers[i].player_key === meKey){ myMember = allMembers[i]; break; }
  }

  myClan = null;
  if (myMember){
    for (let i = 0; i < allClans.length; i++){
      if (allClans[i].id === myMember.clan_id){ myClan = allClans[i]; break; }
    }
  }

  render();
}

async function loadFriends(){
  if (!window.Friends){ friendsList = []; return; }

  const list = await Friends.list();
  const keys = [];
  for (let i = 0; i < list.length; i++) keys.push(list[i].friend_key);

  const info = {};

  if (keys.length){
    const r = await sb.from('arena_players')
      .select('player_key,display_name,cups')
      .in('player_key', keys);

    if (!r.error){
      for (let i = 0; i < (r.data || []).length; i++){
        const p = r.data[i];
        info[p.player_key] = p;
      }
    }
  }

  friendsList = [];

  for (let i = 0; i < list.length; i++){
    const f = list[i];
    const p = info[f.friend_key];
    friendsList.push({
      key:  f.friend_key,
      name: (p && p.display_name) || f.friend_name || 'Игрок',
      cups: (p && p.cups) || 0
    });
  }

  render();
}

function membersOf(clanId){
  const out = [];
  for (let i = 0; i < allMembers.length; i++){
    if (allMembers[i].clan_id === clanId) out.push(allMembers[i]);
  }
  out.sort(function (a, b){
    if (a.role === 'owner' && b.role !== 'owner') return -1;
    if (b.role === 'owner' && a.role !== 'owner') return 1;
    return (b.cups || 0) - (a.cups || 0);
  });
  return out;
}

/* ================= ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ================= */

function setTab(t){
  activeTab = t;

  const tabs = document.querySelectorAll('.tab');
  for (let i = 0; i < tabs.length; i++){
    tabs[i].classList.toggle('on', tabs[i].getAttribute('data-tab') === t);
  }

  render();
}

const tabBtns = document.querySelectorAll('.tab');
for (let i = 0; i < tabBtns.length; i++){
  (function (el){
    el.onclick = function (){ setTab(el.getAttribute('data-tab')); };
  })(tabBtns[i]);
}

/* ================= ОТРИСОВКА ================= */

function render(){
  const app = $('app');

  if (chatTimer){ clearInterval(chatTimer); chatTimer = null; }

  $('banner').classList.toggle('hidden', !(activeTab === 'clan' && !myMember));

  if (activeTab === 'clan') renderClanTab(app);
  else if (activeTab === 'friends') renderFriendsTab(app);
  else renderChatTab(app);
}

function renderClanTab(app){
  if (myMember && myClan){ renderMyClan(app); return; }
  renderClanList(app);
}

function renderMyClan(app){
  const mem = membersOf(myClan.id);
  const full = mem.length >= MAX_MEMBERS;
  const isOwner = (myClan.owner_key === meKey);

  let html = '';

  html += '<div class="my-head">';
  html += '<div class="my-emblem">' + (myClan.emblem || '🛡️') + '</div>';
  html += '<div style="flex:1;min-width:0">';
  html += '<div class="my-name">' + esc(myClan.name) +
          ' <span style="font-size:13px">' + esc(myClan.tag || '') + '</span></div>';
  html += '<div class="my-desc">' + esc(myClan.description || 'Без описания') + '</div>';
  html += '<div class="my-cap">Участники: ' + mem.length + ' / ' + MAX_MEMBERS + '</div>';
  html += '<div class="cap-bar"><div class="cap-fill" style="width:' +
          Math.min(100, mem.length / MAX_MEMBERS * 100) + '%"></div></div>';
  html += '</div></div>';

  html += '<div class="section-title">Состав</div>';

  for (let i = 0; i < mem.length; i++){
    const m = mem[i];
    const isMe = (m.player_key === meKey);
    const isChief = (m.role === 'owner');

    html += '<div class="member' + (isMe ? ' me' : '') + '">';
    html += '<div class="m-avatar">' + (isChief ? '👑' : '🎮') + '</div>';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(m.name || 'Игрок') + (isMe ? ' (ты)' : '') + '</div>';
    html += '<div class="m-role">' + (isChief ? 'Глава клана' : 'Участник') + '</div>';
    html += '</div>';
    html += '<div class="m-cups">🏆 ' + (m.cups || 0) + '</div>';

    if (!isMe){
      html += '<button class="mini play" data-invite="' + esc(m.player_key) +
              '" data-invname="' + esc(m.name || 'Игрок') +
              '" data-invcups="' + (m.cups || 0) + '">⚔️</button>';
      html += '<button class="mini add" data-addfriend="' + esc(m.player_key) +
              '" data-addname="' + esc(m.name || 'Игрок') + '">+</button>';
    }

    if (isOwner && !isMe){
      html += '<button class="mini kick" data-kick="' + esc(m.player_key) + '">✕</button>';
    }

    html += '</div>';
  }

  if (full) html += '<div class="empty">Клан заполнен — 30 из 30</div>';

  html += '<button class="btn-wide red" id="leaveBtn">Выйти из клана</button>';

  app.innerHTML = html;

  bindClanActions(app);

  const lb = $('leaveBtn');
  if (lb) lb.onclick = leaveClan;
}

function renderClanList(app){
  if (!allClans.length){
    app.innerHTML = '<div class="empty">Кланов пока нет.<br>Стань первым — нажми «Создать».</div>';
    return;
  }

  let html = '<div class="section-title">Список кланов</div>';

  for (let i = 0; i < allClans.length; i++){
    const c = allClans[i];
    const mem = membersOf(c.id);
    const full = mem.length >= MAX_MEMBERS;

    html += '<div class="clan-card">';
    html += '<div class="clan-emblem">' + (c.emblem || '🛡️') + '</div>';
    html += '<div class="clan-info">';
    html += '<div class="clan-name">' + esc(c.name) +
            ' <span class="clan-tag">' + esc(c.tag || '') + '</span></div>';
    html += '<div class="clan-sub">' + mem.length + ' / ' + MAX_MEMBERS + ' участников</div>';
    html += '</div>';
    html += '<button class="clan-join" data-join="' + c.id + '"' +
            (full ? ' disabled' : '') + '>' + (full ? 'Полон' : 'Вступить') + '</button>';
    html += '</div>';
  }

  app.innerHTML = html;

  const joinBtns = app.querySelectorAll('[data-join]');
  for (let i = 0; i < joinBtns.length; i++){
    (function (b){
      b.onclick = function (){ joinClan(b.getAttribute('data-join')); };
    })(joinBtns[i]);
  }
}

function renderFriendsTab(app){
  let html = '<div class="section-title">Мои друзья</div>';

  if (!friendsList.length){
    html += '<div class="empty">Пока нет друзей.<br>' +
            'Добавь по нику или из состава клана.</div>';
  } else {
    for (let i = 0; i < friendsList.length; i++){
      const f = friendsList[i];

      html += '<div class="member">';
      html += '<div class="m-avatar">🎮</div>';
      html += '<div class="m-info">';
      html += '<div class="m-name">' + esc(f.name) + '</div>';
      html += '<div class="m-role" style="color:#94a3b8">🏆 ' + f.cups + '</div>';
      html += '</div>';
      html += '<button class="mini play" data-finvite="' + esc(f.key) + '">⚔️</button>';
      html += '<button class="mini kick" data-fremove="' + esc(f.key) + '">✕</button>';
      html += '</div>';
    }
  }

  html += '<button class="btn-wide blue" id="addFriendBtn">+ Добавить друга</button>';

  app.innerHTML = html;

  $('addFriendBtn').onclick = function (){
    $('inNick').value = '';
    $('addResults').innerHTML = '';
    $('addModal').classList.remove('hidden');
  };

  const inv = app.querySelectorAll('[data-finvite]');
  for (let i = 0; i < inv.length; i++){
    (function (b){
      b.onclick = function (){
        const key = b.getAttribute('data-finvite');
        for (let j = 0; j < friendsList.length; j++){
          if (friendsList[j].key === key){
            invitePlayer(key, friendsList[j].name, friendsList[j].cups);
            return;
          }
        }
      };
    })(inv[i]);
  }

  const rem = app.querySelectorAll('[data-fremove]');
  for (let i = 0; i < rem.length; i++){
    (function (b){
      b.onclick = async function (){
        const key = b.getAttribute('data-fremove');
        if (!confirm('Убрать из друзей?')) return;
        await Friends.remove(key);
        showToast('Удалён из друзей');
        await loadFriends();
      };
    })(rem[i]);
  }
}

function bindClanActions(app){
  const inv = app.querySelectorAll('[data-invite]');
  for (let i = 0; i < inv.length; i++){
    (function (b){
      b.onclick = function (){
        invitePlayer(
          b.getAttribute('data-invite'),
          b.getAttribute('data-invname'),
          parseInt(b.getAttribute('data-invcups') || '0', 10) || 0
        );
      };
    })(inv[i]);
  }

  const add = app.querySelectorAll('[data-addfriend]');
  for (let i = 0; i < add.length; i++){
    (function (b){
      b.onclick = async function (){
        const ok = await Friends.add(
          b.getAttribute('data-addfriend'),
          b.getAttribute('data-addname')
        );
        showToast(ok ? 'Добавлен в друзья' : 'Не удалось добавить');
        if (ok) await loadFriends();
      };
    })(add[i]);
  }

  const kick = app.querySelectorAll('[data-kick]');
  for (let i = 0; i < kick.length; i++){
    (function (b){
      b.onclick = function (){ kickMember(b.getAttribute('data-kick')); };
    })(kick[i]);
  }
}

/* ================= ЧАТ ================= */

function renderChatTab(app){
  if (!myClan){
    app.innerHTML = '<div class="empty">Чат доступен только участникам клана.<br>' +
                    'Вступи в клан на вкладке «Клан».</div>';
    return;
  }

  let html = '<div class="section-title">Чат клана</div>';
  html += '<div class="chat-box" id="chatBox"></div>';
  html += '<div class="chat-row">' +
          '<input id="chatInput" maxlength="200" placeholder="Сообщение…">' +
          '<button id="chatSend">➤</button></div>';
  html += '<button class="btn-wide grey" id="shareBtn">📤 Отправить повтор в чат</button>';

  app.innerHTML = html;

  $('chatSend').onclick = sendChat;
  $('chatInput').addEventListener('keydown', function (e){
    if (e.key === 'Enter') sendChat();
  });
  $('shareBtn').onclick = openShare;

  loadChat();
  chatTimer = setInterval(loadChat, 4000);
}

async function loadChat(){
  if (!myClan) return;

  const res = await sb.from('clan_messages')
    .select('*')
    .eq('clan_id', myClan.id)
    .order('id', { ascending: false })
    .limit(60);

  if (res.error) return;

  chatMsgs = (res.data || []).slice().reverse();
  renderChatMessages();
}

function renderChatMessages(){
  const box = $('chatBox');
  if (!box) return;

  if (!chatMsgs.length){
    box.innerHTML = '<div class="empty">Сообщений пока нет</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < chatMsgs.length; i++){
    const m = chatMsgs[i];
    const mine = (m.player_key === meKey);

    html += '<div class="msg' + (mine ? ' mine' : '') + '">';
    html += '<div class="msg-head">' + esc(m.name || 'Игрок') + '</div>';

    if (m.kind === 'replay'){
      html += '<div class="msg-replay">' + esc(m.text || 'Повтор партии') + '</div>';
      if (m.match_id){
        html += '<button class="msg-btn" data-watch="' + m.match_id + '">▶ Смотреть повтор</button>';
      }
    } else {
      html += '<div class="msg-text">' + esc(m.text || '') + '</div>';
    }

    html += '</div>';
  }

  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;

  const watch = box.querySelectorAll('[data-watch]');
  for (let i = 0; i < watch.length; i++){
    (function (b){
      b.onclick = function (){
        location.href = 'chess-history.html?m=' + b.getAttribute('data-watch');
      };
    })(watch[i]);
  }
}

async function sendChat(){
  const inp = $('chatInput');
  if (!inp || !myClan) return;

  const txt = inp.value.trim();
  if (!txt) return;

  inp.value = '';

  const res = await sb.rpc('clan_post', {
    p_clan:  myClan.id,
    p_key:   meKey,
    p_name:  meName,
    p_kind:  'text',
    p_text:  txt,
    p_match: null
  });

  if (res.error){ showToast('Не отправлено'); return; }

  await loadChat();
}

async function openShare(){
  const res = await sb.from('arena_replays')
    .select('match_id,opponent_name,winner,my_side,arena,created_at')
    .eq('player_key', meKey)
    .order('created_at', { ascending: false })
    .limit(12);

  shareRows = res.error ? [] : (res.data || []);

  const box = $('shareList');

  if (!shareRows.length){
    box.innerHTML = '<div class="empty">Нет записанных партий.<br>' +
                    'Сыграй бой — он появится здесь.</div>';
    $('shareModal').classList.remove('hidden');
    return;
  }

  let html = '';

  for (let i = 0; i < shareRows.length; i++){
    const r = shareRows[i];

    let resTxt = 'ничья';
    if (r.winner === 'a' || r.winner === 'b'){
      resTxt = (r.winner === r.my_side) ? 'победа' : 'поражение';
    }

    html += '<div class="member">';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(r.opponent_name || 'Соперник') + '</div>';
    html += '<div class="m-role" style="color:#94a3b8">' + resTxt +
            ' · арена ' + (r.arena || 1) + '</div>';
    html += '</div>';
    html += '<button class="mini add" data-share="' + r.match_id + '">Отправить</button>';
    html += '</div>';
  }

  box.innerHTML = html;

  const btn = box.querySelectorAll('[data-share]');
  for (let i = 0; i < btn.length; i++){
    (function (b){
      b.onclick = function (){ shareReplay(b.getAttribute('data-share')); };
    })(btn[i]);
  }

  $('shareModal').classList.remove('hidden');
}

async function shareReplay(matchId){
  let row = null;
  for (let i = 0; i < shareRows.length; i++){
    if (shareRows[i].match_id === matchId){ row = shareRows[i]; break; }
  }
  if (!row || !myClan) return;

  let resTxt = 'Ничья';
  if (row.winner === 'a' || row.winner === 'b'){
    resTxt = (row.winner === row.my_side) ? 'Победа' : 'Поражение';
  }

  const label = 'Повтор партии против ' + (row.opponent_name || 'соперника') +
                ' · ' + resTxt + ' · арена ' + (row.arena || 1);

  const res = await sb.rpc('clan_post', {
    p_clan:  myClan.id,
    p_key:   meKey,
    p_name:  meName,
    p_kind:  'replay',
    p_text:  label,
    p_match: matchId
  });

  if (res.error){ showToast('Не отправлено'); return; }

  $('shareModal').classList.add('hidden');
  showToast('Повтор отправлен в чат');
  await loadChat();
}

/* ================= ДЕЙСТВИЯ ================= */

async function invitePlayer(key, name, cups){
  if (!window.Friends){ showToast('friends.js не подключён'); return; }
  if (!key) return;

  const r = await Friends.invite(key, name, cups);
  if (!r){ showToast('Не удалось отправить вызов'); return; }

  showToast('Вызов отправлен: ' + name);

  setTimeout(function (){
    Friends.play(r.id, 'host', key, name, cups, r.arena);
  }, 400);
}

async function joinClan(clanId){
  const mem = membersOf(clanId);
  if (mem.length >= MAX_MEMBERS){ showToast('Клан заполнен'); return; }

  const res = await sb.from('clan_members').insert({
    clan_id:    clanId,
    player_key: meKey,
    name:       meName,
    cups:       meCups,
    role:       'member'
  });

  if (res.error){ showToast('Не удалось вступить'); return; }

  showToast('Ты в клане!');
  await loadAll();
}

async function leaveClan(){
  if (!myMember) return;

  const isOwner = (myClan && myClan.owner_key === meKey);
  const mem = myClan ? membersOf(myClan.id) : [];

  if (isOwner && mem.length > 1){
    showToast('Сначала передай главу или выгони всех');
    return;
  }

  if (!confirm('Выйти из клана?')) return;

  await sb.from('clan_members').delete().eq('player_key', meKey);

  if (isOwner && myClan){
    await sb.from('clans').delete().eq('id', myClan.id);
  }

  showToast('Ты вышел из клана');
  await loadAll();
}

async function kickMember(key){
  if (!myClan || myClan.owner_key !== meKey) return;
  if (!confirm('Выгнать участника?')) return;

  await sb.from('clan_members').delete().eq('player_key', key);
  showToast('Участник выгнан');
  await loadAll();
}

async function createClan(){
  const name = $('inName').value.trim();
  const tag  = $('inTag').value.trim();
  const desc = $('inDesc').value.trim();

  if (name.length < 3){ showToast('Название минимум 3 символа'); return; }

  const res = await sb.from('clans').insert({
    name: name, tag: tag, emblem: pickedEmblem,
    description: desc, owner_key: meKey
  }).select().single();

  if (res.error){ showToast('Не удалось создать клан'); return; }

  const memRes = await sb.from('clan_members').insert({
    clan_id: res.data.id, player_key: meKey,
    name: meName, cups: meCups, role: 'owner'
  });

  if (memRes.error) showToast('Клан создан, но вступление не удалось');
  else showToast('Клан создан!');

  $('createModal').classList.add('hidden');
  $('inName').value = '';
  $('inTag').value = '';
  $('inDesc').value = '';

  await loadAll();
}

/* ================= МОДАЛКИ ================= */

function buildEmblems(){
  const row = $('emblemRow');
  row.innerHTML = '';

  for (let i = 0; i < EMBLEMS.length; i++){
    const b = document.createElement('button');
    b.className = 'emblem-opt' + (EMBLEMS[i] === pickedEmblem ? ' on' : '');
    b.textContent = EMBLEMS[i];
    (function (em){
      b.onclick = function (){ pickedEmblem = em; buildEmblems(); };
    })(EMBLEMS[i]);
    row.appendChild(b);
  }
}

$('bannerBtn').onclick = function (){
  if (myMember){ showToast('Ты уже в клане'); return; }
  pickedEmblem = '🛡️';
  buildEmblems();
  $('createModal').classList.remove('hidden');
};

$('createCancel').onclick = function (){ $('createModal').classList.add('hidden'); };
$('createOk').onclick = createClan;

$('addCancel').onclick = function (){ $('addModal').classList.add('hidden'); };

$('shareCancel').onclick = function (){ $('shareModal').classList.add('hidden'); };

$('addSearch').onclick = async function (){
  if (!window.Friends){ showToast('friends.js не подключён'); return; }

  const nick = $('inNick').value.trim();
  if (nick.length < 2){ showToast('Минимум 2 символа'); return; }

  const box = $('addResults');
  box.innerHTML = '<div class="empty">Ищем…</div>';

  const list = await Friends.find(nick);

  if (!list.length){
    box.innerHTML = '<div class="empty">Никого не нашли</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < list.length; i++){
    const p = list[i];
    if (p.player_key === meKey) continue;

    html += '<div class="member">';
    html += '<div class="m-avatar">🎮</div>';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(p.display_name || 'Игрок') + '</div>';
    html += '<div class="m-role" style="color:#94a3b8">🏆 ' + (p.cups || 0) + '</div>';
    html += '</div>';
    html += '<button class="mini add" data-pick="' + esc(p.player_key) +
            '" data-pickname="' + esc(p.display_name || 'Игрок') + '">Добавить</button>';
    html += '</div>';
  }

  box.innerHTML = html || '<div class="empty">Никого не нашли</div>';

  const picks = box.querySelectorAll('[data-pick]');
  for (let i = 0; i < picks.length; i++){
    (function (b){
      b.onclick = async function (){
        const ok = await Friends.add(
          b.getAttribute('data-pick'),
          b.getAttribute('data-pickname')
        );
        showToast(ok ? 'Добавлен в друзья' : 'Не удалось добавить');
        if (ok){
          $('addModal').classList.add('hidden');
          await loadFriends();
        }
      };
    })(picks[i]);
  }
};

/* ================= ВЫЗОВЫ НА ЭТОЙ СТРАНИЦЕ ================= */

function watchChallenges(){
  if (!window.Friends) return;

  Friends.watch(function (c){
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:2000;' +
      'display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';

    o.innerHTML =
      '<div style="max-width:330px;width:100%;background:linear-gradient(145deg,#1e293b,#0f172a);' +
        'border:2px solid #22c55e;border-radius:16px;padding:20px">' +
        '<div style="font-size:40px;margin-bottom:8px">⚔️</div>' +
        '<div id="cnm" style="font-size:15px;font-weight:900;margin-bottom:6px"></div>' +
        '<div style="font-size:12px;color:#94a3b8;margin-bottom:14px">' +
          'Вызывает тебя на дружескую партию</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="cNo" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#ef4444,#991b1b);color:#fff;font-weight:900;' +
            'font-size:13px">Отклонить</button>' +
          '<button id="cYes" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-weight:900;' +
            'font-size:13px">Играть</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(o);
    o.querySelector('#cnm').textContent = c.from_name || 'Игрок';

    let closed = false;
    const chk = setInterval(async function(){
      if (closed) return;
      const st = await Friends.status(c.id);
      if (!st || st.status !== 'pending'){
        closed = true;
        clearInterval(chk);
        o.remove();
      }
    }, 3000);

    function close(){
      closed = true;
      clearInterval(chk);
      o.remove();
    }

    o.querySelector('#cNo').onclick = async function (){
      close();
      await Friends.answer(c.id, 'declined');
    };

    o.querySelector('#cYes').onclick = async function (){
      close();
      const r = await Friends.answer(c.id, 'accepted');
      if (!r || !r.accepted) return;
      Friends.play(c.id, 'guest', c.from_key, c.from_name, c.from_cups, c.arena);
    };
  });
}

/* ================= СТАРТ ================= */

buildEmblems();
boot();
setTimeout(watchChallenges, 1500);

document.addEventListener('visibilitychange', function (){
  if (!document.hidden){
    loadAll();
    loadFriends();
  }
});
</script>
</body>
</html>
