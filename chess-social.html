function norm(t){t=String(t||'').toLowerCase();var m={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s'};var o='';for(var i=0;i<t.length;i++){var c=t.charAt(i);o+=(m[c]!==undefined)?m[c]:c;}return o.replace(/ё/g,'е').replace(/[^a-zа-я]/g,'');}
function badw(t){var s=norm(t);if(!s)return false;for(var i=0;i<BAD.length;i++)if(s.indexOf(BAD[i])>=0)return true;return false;}

function toast(t){var e=$('toast');if(!e)return;e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove('show');},2400);}
function err(t){var b=$('errBox');if(!b)return;if(!t){b.classList.add('hidden');b.textContent='';return;}b.textContent=t;b.classList.remove('hidden');}
function ckGet(n){try{var p=('; '+document.cookie).split('; '+n+'=');if(p.length===2)return decodeURIComponent(p[1].split(';')[0]);}catch(e){}return null;}
function ckSet(n,v){try{document.cookie=n+'='+encodeURIComponent(v)+'; max-age=31536000; path=/; SameSite=Lax';}catch(e){}}
function ls(n){try{return localStorage.getItem(n);}catch(e){return null;}}
function lsSet(n,v){try{localStorage.setItem(n,v);}catch(e){}}

function playerKey(){
  var t=ls('tgId'); if(t) return 'tg:'+t;
  var e=ls('currentEmail')||ls('linkedEmail'); if(e) return 'email:'+e.toLowerCase();
  var a=ls('arenaAnonId'); if(a) return a;
  var c=ckGet('arenaAnonId'); if(c){lsSet('arenaAnonId',c);return c;}
  a='anon:'+Math.random().toString(36).slice(2,10);
  lsSet('arenaAnonId',a); ckSet('arenaAnonId',a); return a;
}
function playerName(){
  var n=ls('userName'); if(n) return n;
  try{var w=window.Telegram&&window.Telegram.WebApp;var u=w&&w.initDataUnsafe&&w.initDataUnsafe.user;
    if(u){var m=[u.first_name,u.last_name].filter(Boolean).join(' ')||u.username;if(m)return m;}}catch(e){}
  return 'Игрок';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pill(c,k,n){if(!c)return '';return '<span class="tagpill" data-copytag="'+esc(c)+'" data-copykind="'+esc(k||'player')+'" data-copyname="'+esc(n||'')+'">#'+esc(c)+'</span>';}
function base(){return location.origin+location.pathname;}

function share(url,ph){
  var t=encodeURIComponent(ph||''),u=encodeURIComponent(url||'');
  try{var w=window.Telegram&&window.Telegram.WebApp;if(w&&w.openTelegramLink){w.openTelegramLink('https://t.me/share/url?url='+u+'&text='+t);return;}}catch(e){}
  if(navigator.share){navigator.share({title:'Chess Royale',text:ph||'',url:url||''}).catch(function(){});return;}
  if(window.CopyShare&&window.CopyShare.shareLink){CopyShare.shareLink(url,ph);return;}
  window.open('https://t.me/share/url?url='+u+'&text='+t,'_blank');
}
function shareClan(name,code){
  if(!code){toast('У клана ещё нет тега');return;}
  var u=base()+'?clan='+encodeURIComponent(code);
  share(u,'Клан «'+name+'» набирает своих. Тег #'+code+' — вступай, побеждаем вместе!');
}
function copyTag(el){
  var c=el.getAttribute('data-copytag'),k=el.getAttribute('data-copykind')||'player',n=el.getAttribute('data-copyname')||'';
  if(!c)return;
  var u=base()+(k==='clan'?'?clan=':'?player=')+encodeURIComponent(c);
  share(u,(k==='clan')?'Клан «'+n+'» — тег #'+c+'. Вступай!':'Мой тег в Chess Royale — #'+c+'. Добавляйся!');

async function boot(){
  try{
    meKey=playerKey(); meName=playerName();
    meCups=parseInt(ls('cr_trophies')||'0',10)||0;
    $('cupsTop').textContent=meCups;
    try{var r=await sb.rpc('arena_ensure_player',{p_key:meKey,p_name:meName,p_seed:0});
      if(!r.error&&r.data){meCups=r.data.cups||0;if(r.data.display_name)meName=r.data.display_name;}}catch(e){}
    $('cupsTop').textContent=meCups; lsSet('cr_trophies',String(meCups));
    try{var t=await sb.rpc('ensure_player_tag',{p_key:meKey});if(!t.error&&t.data)lsSet('cr_tag',String(t.data));}catch(e){}
    await loadAll();
    try{await loadFriends();}catch(e){}
    await deepLink();
  }catch(e){err('Ошибка: '+(e&&e.message?e.message:'неизвестно'));drawSafe();}
}

async function loadAll(){
  err('');
  try{var m=await sb.from('clan_members').select('*');allMembers=m.error?[]:(m.data||[]);}catch(e){allMembers=[];}
  try{var c=await sb.from('clans').select('*').order('created_at',{ascending:false});allClans=c.error?[]:(c.data||[]);}catch(e){allClans=[];}
  try{await loadTags();}catch(e){}
  myMember=null;
  for(var i=0;i<allMembers.length;i++){if(allMembers[i].player_key===meKey){myMember=allMembers[i];break;}}
  myClan=null;
  if(myMember){for(var j=0;j<allClans.length;j++){if(allClans[j].id===myMember.clan_id){myClan=allClans[j];break;}}}
  loadedOnce=true;
  drawSafe();
  if(!$('clanInfoModal').classList.contains('hidden')){
    if(previewClan)drawPreview(); else if(myClan)drawMine();
  }
}

async function loadTags(){
  tagMap={}; var k=[];
  for(var i=0;i<allMembers.length;i++){if(k.indexOf(allMembers[i].player_key)<0)k.push(allMembers[i].player_key);}
  if(!k.length)return;
  var r=await sb.from('arena_players').select('player_key,tag').in('player_key',k);
  if(r.error)return;
  for(var j=0;j<(r.data||[]).length;j++){var p=r.data[j];if(p.tag)tagMap[p.player_key]=p.tag;}
}

async function loadFriends(){
  if(!window.Friends){friendsList=[];return;}
  var l=await Friends.list(),k=[];
  for(var i=0;i<l.length;i++)k.push(l[i].friend_key);
  var info={};
  if(k.length){var r=await sb.from('arena_players').select('player_key,display_name,cups,tag').in('player_key',k);
    if(!r.error)for(var j=0;j<(r.data||[]).length;j++){var p=r.data[j];info[p.player_key]=p;}}
  friendsList=[];
  for(var n=0;n<l.length;n++){var f=l[n],q=info[f.friend_key];
    friendsList.push({key:f.friend_key,name:(q&&q.display_name)||f.friend_name||'Игрок',cups:(q&&q.cups)||0,tag:(q&&q.tag)||''});}
  drawSafe();
}

function memOf(id){
  var o=[],s={};
  for(var i=0;i<allMembers.length;i++){var m=allMembers[i];
    if(m.clan_id!==id)continue; if(s[m.player_key])continue; s[m.player_key]=1; o.push(m);}
  o.sort(function(a,b){
    if(a.role==='owner'&&b.role!=='owner')return -1;
    if(b.role==='owner'&&a.role!=='owner')return 1;
    return (b.cups||0)-(a.cups||0);});
  return o;
}
function cupsOf(id){var m=memOf(id),s=0;for(var i=0;i<m.length;i++)s+=(m[i].cups||0);return s;}
function isOwner(){return !!(myClan&&myClan.owner_key===meKey);}

function listHtml(){

function openSearch(m,q){
  searchMode=m||'clans'; searchQ=q||'';
  $('searchInput').value=searchQ;
  var ch=$('searchModal').querySelectorAll('.chip');
  for(var i=0;i<ch.length;i++)ch[i].classList.toggle('on',ch[i].getAttribute('data-mode')===searchMode);
  $('searchModal').classList.remove('hidden');
  doSearch();
}
function closeSearch(){$('searchModal').classList.add('hidden');}

async function doSearch(){
  var o=$('searchOut'); if(!o)return;
  var q=searchQ.trim();
  if(!q){o.innerHTML='<div class="empty">Введи тег или имя.<br>Например: #A7K2M</div>';return;}
  o.innerHTML='<div class="empty">Ищем…</div>';
  if(searchMode==='clans')await resClans(o,q); else await resPlayers(o,q);
}

async function findClan(q){
  try{var r=await sb.rpc('search_clans',{p_q:q,p_limit:25});
    if(r.error)return null;
    var l=r.data||[]; if(!l.length)return null;
    for(var i=0;i<l.length;i++){if(String(l[i].code||'').toUpperCase()===String(q||'').toUpperCase())return l[i];}
    return l[0];
  }catch(e){return null;}
}

async function resClans(o,q){
  var l=[];
  try{var r=await sb.rpc('search_clans',{p_q:q,p_limit:25});if(!r.error)l=r.data||[];}catch(e){}
  if(!l.length){o.innerHTML='<div class="empty">Кланы не найдены по «'+esc(q)+'»</div>';return;}
  var h='';
  for(var i=0;i<l.length;i++){
    var c=l[i],full=(Number(c.member_count)||0)>=MAX;
    var mine=!!(myMember&&myMember.clan_id===c.id);
    h+='<div class="clan-card" data-preview="'+esc(c.id)+'"><div class="clan-emblem">'+(c.emblem||'🛡️')+'</div>';
    h+='<div class="clan-info"><div class="clan-name">'+esc(c.name)+pill(c.code,'clan',c.name)+'</div>';
    h+='<div class="clan-sub">'+(Number(c.member_count)||0)+' / '+MAX+' · 🏆 '+(Number(c.total_cups)||0)+'</div></div>';
    h+='<button class="mini share" data-shareclan="'+esc(c.code||'')+'" data-shareclanname="'+esc(c.name)+'">📤</button>';
    if(mine)h+='<button class="clan-join" data-previewbtn="'+esc(c.id)+'">Мой</button>';
    else if(myMember)h+='<button class="clan-join" disabled>Уже в клане</button>';
    else if(full)h+='<button class="clan-join" data-previewbtn="'+esc(c.id)+'">Полон</button>';
    else h+='<button class="clan-join" data-join="'+esc(c.id)+'">Вступить</button>';
    h+='</div>';
  }
  o.innerHTML=h; bind(o);
}

async function resPlayers(o,q){
  var l=[];
  try{var r=await sb.rpc('search_players',{p_q:q,p_limit:25});if(!r.error)l=r.data||[];}catch(e){}
  if(!l.length){o.innerHTML='<div class="empty">Никого не нашли по «'+esc(q)+'»</div>';return;}
  var h='',n=0;
  for(var i=0;i<l.length;i++){
    var p=l[i]; if(p.player_key===meKey)continue; n++;
    h+='<div class="member"><div class="m-avatar" data-profile="'+esc(p.player_key)+'">🎮</div>';
    h+='<div class="m-info" data-profile="'+esc(p.player_key)+'">';

  o.innerHTML=h; bind(o);

    if(r.error)why=r.error.message||''; else if(r.data&&r.data.ok===false)why=r.data.error||''; else ok=true;}catch(e){why='сеть';}
  if(!ok){try{var u=await sb.from('clans').update({description:d}).eq('id',myClan.id);if(!u.error)ok=true;else if(!why)why=u.error.message;}catch(e){}}

async function loadChat(){
  if(!myClan)return;
  var r=await sb.from('clan_messages').select('*').eq('clan_id',myClan.id).order('id',{ascending:false}).limit(60);
  if(r.error)return;
  chatMsgs=(r.data||[]).slice().reverse();

function drawChat(){
  var b=$('chatBox'); if(!b)return;
  if(!chatMsgs.length){b.innerHTML='<div class="empty">Сообщений пока нет.<br>Напиши первым.</div>';return;}
  var h='';
  for(var i=0;i<chatMsgs.length;i++){
    var m=chatMsgs[i],mine=(m.player_key===meKey);
    if(m.kind==='system'){h+='<div class="msg-sys">'+esc(m.text||'')+'</div>';continue;}
    h+='<div class="msg'+(mine?' mine':'')+'">';
    h+='<div class="msg-head" data-profile="'+esc(m.player_key)+'">'+esc(m.name||'Игрок')+'</div>';
    if(m.kind==='replay'){h+='<div class="msg-replay">'+esc(m.text||'Повтор')+'</div>';
      if(m.match_id)h+='<button class="msg-btn" data-watch="'+m.match_id+'">▶ Смотреть повтор</button>';}
    else h+='<div class="msg-text">'+esc(m.text||'')+'</div>';
    h+='</div>';
  }
  b.innerHTML=h; b.scrollTop=b.scrollHeight;
  var w=b.querySelectorAll('[data-watch]');
  for(var k=0;k<w.length;k++){(function(x){x.onclick=function(){location.href='chess-history.html?m='+x.getAttribute('data-watch');};})(w[k]);}
  var p=b.querySelectorAll('[data-profile]');
  for(var n=0;n<p.length;n++){(function(el){el.onclick=function(){openProfile(el.getAttribute('data-profile'));};})(p[n]);}
}

async function sendChat(){
  var ip=$('chatInput'); if(!ip||!myClan)return;
  var t=ip.value.trim(); if(!t)return;
  if(badw(t)){ip.value='';toast('Ненормативная лексика — не отправлено');return;}
  ip.value='';
  var r=await sb.rpc('clan_post',{p_clan:myClan.id,p_key:meKey,p_name:meName,p_kind:'text',p_text:t,p_match:null});
  if(r.error){toast('Не отправлено');ip.value=t;return;}
  if(r.data&&r.data.bad){toast('Ненормативная лексика');ip.value=t;return;}
  await loadChat();
}

async function shareReplay(id){
  var row=null;
  for(var i=0;i<shareRows.length;i++)if(shareRows[i].match_id===id){row=shareRows[i];break;}
  if(!row||!myClan)return;
  var t='Ничья';
  if(row.winner==='a'||row.winner==='b')t=(row.winner===row.my_side)?'Победа':'Поражение';
  var lb='Повтор партии против '+(row.opponent_name||'соперника')+' · '+t+' · арена '+(row.arena||1);
  var r=await sb.rpc('clan_post',{p_clan:myClan.id,p_key:meKey,p_name:meName,p_kind:'replay',p_text:lb,p_match:id});
  if(r.error){toast('Не отправлено');return;}
  $('shareModal').classList.add('hidden'); toast('Повтор отправлен'); await loadChat();
}

function bind(s){
  if(!s)return;
  var pv=s.querySelectorAll('[data-preview]');
  for(var i=0;i<pv.length;i++){(function(el){el.onclick=function(e){
    if(e.target&&e.target.closest&&(e.target.closest('[data-join]')||e.target.closest('[data-shareclan]')))return;
    openPreview(el.getAttribute('data-preview'));};})(pv[i]);}
  var pb=s.querySelectorAll('[data-previewbtn]');
  for(var p=0;p<pb.length;p++){(function(el){el.onclick=function(e){e.stopPropagation();openPreview(el.getAttribute('data-previewbtn'));};})(pb[p]);}
  var inv=s.querySelectorAll('[data-invite]');
  for(var a=0;a<inv.length;a++){(function(b){b.onclick=function(e){e.stopPropagation();
    invite(b.getAttribute('data-invite'),b.getAttribute('data-invname'),parseInt(b.getAttribute('data-invcups')||'0',10)||0);};})(inv[a]);}
  var ad=s.querySelectorAll('[data-addfriend]');
  for(var c=0;c<ad.length;c++){(function(b){b.onclick=async function(e){e.stopPropagation();
    if(!window.Friends)return;
    var ok=await Friends.add(b.getAttribute('data-addfriend'),b.getAttribute('data-addname'));
    toast(ok?'Добавлен в друзья':'Не удалось'); if(ok)await loadFriends();};})(ad[c]);}
  var kk=s.querySelectorAll('[data-kick]');
  for(var k=0;k<kk.length;k++){(function(b){b.onclick=function(e){e.stopPropagation();kick(b.getAttribute('data-kick'));};})(kk[k]);}
  var jn=s.querySelectorAll('[data-join]');
  for(var j=0;j<jn.length;j++){(function(b){b.onclick=function(e){e.stopPropagation();joinClan(b.getAttribute('data-join'),b);};})(jn[j]);}
  var sc=s.querySelectorAll('[data-shareclan]');
  for(var x=0;x<sc.length;x++){(function(b){b.onclick=function(e){e.stopPropagation();
    shareClan(b.getAttribute('data-shareclanname')||'Клан',b.getAttribute('data-shareclan')||'');};})(sc[x]);}
  var pf=s.querySelectorAll('[data-profile]');
  for(var f=0;f<pf.length;f++){(function(el){el.onclick=function(e){e.stopPropagation();openProfile(el.getAttribute('data-profile'));};})(pf[f]);}
  var tg=s.querySelectorAll('[data-copytag]');
  for(var t=0;t<tg.length;t++){(function(el){el.onclick=function(e){e.stopPropagation();copyTag(el);};})(tg[t]);}
}

async function invite(key,name,cups){
  if(!window.Friends){toast('friends.js не подключён');return;}
  if(!key)return;
  var r=await Friends.invite(key,name,cups);
  if(!r){toast('Не удалось отправить вызов');return;}
  toast('Вызов отправлен: '+name);
  setTimeout(function(){Friends.play(r.id,'host',key,name,cups,r.arena);},400);
}

async function joinClan(id,btn){
  if(!id||joining)return;
  if(myMember){
    if(myMember.clan_id===id){toast('Ты уже в этом клане');openMine();}
    else{toast('Ты уже в другом клане — сначала выйди');closeSearch();}
    return;
  }
  joining=true;
  if(btn){btn.disabled=true;btn.textContent='…';}
  var ok=false,msg='';
  try{
    var r=await sb.rpc('clan_join',{p_clan:id,p_key:meKey,p_name:meName,p_cups:meCups});
    if(r.error)msg=r.error.message||'';
    else{var d=r.data||{};
      if(d.ok===false)msg=d.error||'не удалось';
      else{ok=true;if(d.already)msg='Ты уже в этом клане';}}
  }catch(e){msg='сеть';}
  if(!ok){
    var ch=await sb.from('clan_members').select('clan_id').eq('player_key',meKey).limit(1);
    if(!ch.error&&ch.data&&ch.data.length){ok=true;msg=(ch.data[0].clan_id===id)?'Ты уже в этом клане':'Ты уже в другом клане';}
  }
  joining=false;
  if(!ok){if(btn){btn.disabled=false;btn.textContent='Вступить';}toast(msg||'Не удалось вступить');return;}
  toast(msg||'Ты в клане!');
  closeSearch(); $('clanInfoModal').classList.add('hidden'); previewClan=null;
  await loadAll();
}

async function leaveClan(){
  if(!myMember)return;
  var owner=isOwner(),m=myClan?memOf(myClan.id):[];
  if(owner&&m.length>1){toast('Сначала передай главу или выгони всех');return;}
  if(!confirm('Покинуть клан?'))return;
  closeClan();
  await sb.from('clan_members').delete().eq('player_key',meKey);
  if(owner&&myClan)await sb.from('clans').delete().eq('id',myClan.id);
  descEdit=false; toast('Ты покинул клан'); await loadAll();
}

async function kick(key){

      if(!st||st.status!=='pending'){closed=true;clearInterval(chk);o.remove();}},3000);
    function cl(){closed=true;clearInterval(chk);o.remove();}
    o.querySelector('#cNo').onclick=async function(){cl();await Friends.answer(c.id,'declined');};
    o.querySelector('#cYes').onclick=async function(){
      cl(); var r=await Friends.answer(c.id,'accepted');
      if(!r||!r.accepted)return;
      Friends.play(c.id,'guest',c.from_key,c.from_name,c.from_cups,c.arena);};
  });
}

function findCode(code){
  var up=String(code||'').toUpperCase();
  for(var i=0;i<allClans.length;i++){
    if(String(allClans[i].tag||'').toUpperCase()===up)return allClans[i];
    if(String(allClans[i].id)===String(code))return allClans[i];
  }
  return null;
}

async function deepLink(){
  var p=new URLSearchParams(location.search);
  var clan=p.get('clan'), player=p.get('player');
  if(!clan&&!player)return;
  var q=String(clan||player||'').replace(/^#/,'');
  history.replaceState(null,'',location.pathname);

  if(clan){
    setTab('clan');
    if(myMember&&myClan&&(String(myClan.tag||'').toUpperCase()===q.toUpperCase()||String(myClan.id)===q)){
      previewClan=null; $('ciTitle').textContent='Клан';
      drawMine(); $('clanInfoModal').classList.remove('hidden');
      toast('Ты уже в этом клане'); return;
    }
    var f=findCode(q);
    if(f){openPreview(f.id); toast('Ты пока не в этом клане'); return;}
    var r=await findClan(q);
    if(r){
      var c={id:r.id,name:r.name,tag:r.code,emblem:r.emblem,description:r.description,owner_key:r.owner_key};
      var inL=false;
      for(var i=0;i<allClans.length;i++)if(String(allClans[i].id)===String(c.id))inL=true;
      if(!inL)allClans.push(c);
      openPreview(c.id); toast('Ты пока не в этом клане'); return;
    }
    toast('Клан не найден');
  } else {
    setTab('clan');
    openSearch('players',q);
    setTimeout(function(){openProfile(q);},600);
  }
}

buildEmb();
drawSafe();
boot();
setTimeout(watchCh,1500);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){try{loadAll();loadFriends();}catch(e){}}
});
</script>
