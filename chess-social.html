function chatNormalize(text){
  let t = String(text || '').toLowerCase();

  const map = { '0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i' };
  let out = '';

  for (let i = 0; i < t.length; i++){
    const ch = t.charAt(i);
    out += (map[ch] !== undefined) ? map[ch] : ch;
  }

  out = out.replace(/ё/g, 'е');
  out = out.replace(/[^a-zа-я]/g, '');

  return out;
}

function hasBadWord(text){
  const t = chatNormalize(text);
  if (!t) return false;

  for (let i = 0; i < BAD_ROOTS.length; i++){
    if (t.indexOf(BAD_ROOTS[i]) >= 0) return true;
  }
  return false;
}

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function playerName(){
  return localStorage.getItem('userName') || 'Игрок';
}

function esc(s){
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function tagPill(code){
  if (!code) return '';
  return '<span class="tagpill">#' + esc(code) + '</span>';
}

/* ================= ССЫЛКИ ================= */

function baseUrl(){
  return location.origin + location.pathname;
}

function copyText(txt){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){
        showToast('Ссылка скопирована');
      }).catch(function(){});
      return true;
    }
  } catch (e){}
  return false;
}

function share(url, phrase){
  const tg = window.Telegram && window.Telegram.WebApp;

  if (tg && tg.openTelegramLink){
    try {
      tg.openTelegramLink(
        'https://t.me/share/url?url=' + encodeURIComponent(url) +
        '&text=' + encodeURIComponent(phrase)
      );
      return;
    } catch (e){}
  }

  if (navigator.share){
    try {
      navigator.share({ title: 'Chess Royale', text: phrase, url: url }).catch(function(){});
      return;
    } catch (e){}
  }

  if (!copyText(phrase + '\n' + url)){
    showToast('Скопируй ссылку: ' + url);
  }
}

function shareMe(){
  if (!myTag){ showToast('Тег ещё не готов, попробуй через секунду'); return; }

  const url = baseUrl() + '?player=' + encodeURIComponent(myTag);

  const phrases = [
    'Сыграем? Мой тег в Chess Royale — #' + myTag + '. Добавляйся в друзья!',
    'Вызываю тебя на партию ⚔️ Мой тег — #' + myTag + '. Заходи в игру.',
    'Есть доска, есть время. Мой тег — #' + myTag + ', добавляйся и сыграем.',
    'Хочу с тобой партию. Мой тег в игре — #' + myTag + '. Жду вызов.'
  ];

  share(url, phrases[Math.floor(Math.random() * phrases.length)]);
}

function shareClan(name, code){
  if (!code){ showToast('У клана ещё нет тега'); return; }

  const url = baseUrl() + '?clan=' + encodeURIComponent(code);

  const phrases = [
    'Клан «' + name + '» набирает своих. Вступай по тегу #' + code + ' — побеждаем вместе!',
    'В «' + name + '» не бросают в партии. Заходи по ссылке и вступай ⚔️',
    '«' + name + '» — клан, где растут вместе. Тег #' + code + ', ждём тебя.',
    'Ищешь своих? «' + name + '» ждёт. Тег #' + code + ' — вступай.'
  ];

  share(url, phrases[Math.floor(Math.random() * phrases.length)]);
}

async function boot(){
  meKey = playerKey();
  meName = playerName();
  meCups = parseInt(localStorage.getItem('cr_trophies') || '0', 10) || 0;

  $('cupsTop').textContent = meCups;

  try {
    const res = await sb.rpc('arena_ensure_player', {
      p_key: meKey, p_name: meName, p_seed: 0
    });

    if (!res.error && res.data){
      meCups = res.data.cups || 0;
      if (res.data.display_name) meName = res.data.display_name;
    }
  } catch (e){}

  $('cupsTop').textContent = meCups;
  localStorage.setItem('cr_trophies', String(meCups));

  try {
    const t = await sb.rpc('ensure_player_tag', { p_key: meKey });
    if (!t.error && t.data) myTag = String(t.data);
  } catch (e){}

  if (!myTag) myTag = localStorage.getItem('cr_tag') || '';
  if (myTag) localStorage.setItem('cr_tag', myTag);

  $('myTag').textContent = myTag ? '#' + myTag : '#—';

  await loadAll();
  await loadFriends();
  handleDeepLink();
}

async function loadAll(){
  showErr('');

  const membersRes = await sb.from('clan_members').select('*');
  if (membersRes.error){
    showErr('Таблицы кланов не созданы.\n' + membersRes.error.message);
    allMembers = [];
  } else {
    allMembers = membersRes.data || [];
  }

  const clansRes = await sb.from('clans').select('*').order('created_at', { ascending: false });
  allClans = clansRes.error ? [] : (clansRes.data || []);

  await loadTagMap();

  myMember = null;
  for (let i = 0; i < allMembers.length; i++){
    if (allMembers[i].player_key === meKey){ myMember = allMembers[i]; break; }
  }

  myClan = null;
  if (myMember){
    for (let i = 0; i < allClans.length; i++){
      if (allClans[i].id === myMember.clan_id){ myClan = allClans[i]; break; }
    }
  }

  render();
}

async function loadTagMap(){
  tagMap = {};

  const keys = [];
  for (let i = 0; i < allMembers.length; i++){
    if (keys.indexOf(allMembers[i].player_key) < 0) keys.push(allMembers[i].player_key);
  }
  if (!keys.length) return;

  const r = await sb.from('arena_players').select('player_key,tag').in('player_key', keys);
  if (r.error) return;

  for (let i = 0; i < (r.data || []).length; i++){
    const p = r.data[i];
    if (p.tag) tagMap[p.player_key] = p.tag;
  }
}

async function loadFriends(){
  if (!window.Friends){ friendsList = []; return; }

  const list = await Friends.list();
  const keys = [];
  for (let i = 0; i < list.length; i++) keys.push(list[i].friend_key);

  const info = {};

  if (keys.length){
    const r = await sb.from('arena_players')
      .select('player_key,display_name,cups,tag')
      .in('player_key', keys);

    if (!r.error){
      for (let i = 0; i < (r.data || []).length; i++){
        const p = r.data[i];
        info[p.player_key] = p;
      }
    }
  }

  friendsList = [];

  for (let i = 0; i < list.length; i++){
    const f = list[i];
    const p = info[f.friend_key];
    friendsList.push({
      key:  f.friend_key,
      name: (p && p.display_name) || f.friend_name || 'Игрок',
      cups: (p && p.cups) || 0,
      tag:  (p && p.tag) || ''
    });
  }

  render();
}

function membersOf(clanId){
  const out = [];
  for (let i = 0; i < allMembers.length; i++){
    if (allMembers[i].clan_id === clanId) out.push(allMembers[i]);
  }
  out.sort(function (a, b){
    if (a.role === 'owner' && b.role !== 'owner') return -1;
    if (b.role === 'owner' && a.role !== 'owner') return 1;
    return (b.cups || 0) - (a.cups || 0);
  });
  return out;
}

function cupsOf(clanId){
  const mem = membersOf(clanId);
  let sum = 0;
  for (let i = 0; i < mem.length; i++) sum += (mem[i].cups || 0);
  return sum;
}

/* ================= ПОИСК ================= */

function openSearch(mode, q){
  searchMode = mode || 'clans';
  searchQ = q || '';

  $('searchInput').value = searchQ;

  const chips = $('searchModal').querySelectorAll('.chip');
  for (let i = 0; i < chips.length; i++){
    chips[i].classList.toggle('on', chips[i].getAttribute('data-mode') === searchMode);
  }

  $('searchModal').classList.remove('hidden');

  applySearch();
}

function closeSearch(){
  $('searchModal').classList.add('hidden');
}

async function applySearch(){
  const out = $('searchOut');
  if (!out) return;

  const q = searchQ.trim();

  if (q === ''){
    out.innerHTML = '<div class="empty">Введи тег или имя.<br>Например: #A7K2M</div>';
    return;
  }

  out.innerHTML = '<div class="empty">Ищем…</div>';

  if (searchMode === 'clans') await renderClanResults(out, q);
  else await renderPlayerResults(out, q);
}

async function renderClanResults(out, q){
  let list = [];

  try {
    const r = await sb.rpc('search_clans', { p_q: q, p_limit: 25 });
    if (!r.error) list = r.data || [];
  } catch (e){}

  if (!list.length){
    out.innerHTML = '<div class="empty">Кланы не найдены по «' + esc(q) + '»</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < list.length; i++){
    const c = list[i];
    const full = (Number(c.member_count) || 0) >= MAX_MEMBERS;
    const mine = (myClan && myClan.id === c.id);

    html += '<div class="clan-card">';
    html += '<div class="clan-emblem">' + (c.emblem || '🛡️') + '</div>';
    html += '<div class="clan-info">';
    html += '<div class="clan-name">' + esc(c.name) + tagPill(c.code) + '</div>';
    html += '<div class="clan-sub">' + (Number(c.member_count) || 0) + ' / ' + MAX_MEMBERS +
            ' · 🏆 ' + (Number(c.total_cups) || 0) + '</div>';
    html += '</div>';
    html += '<button class="mini share" data-shareclan="' + esc(c.code || '') +
            '" data-shareclanname="' + esc(c.name) + '">📤</button>';
    if (!mine){
      html += '<button class="clan-join" data-join="' + c.id + '"' +
              (full ? ' disabled' : '') + '>' + (full ? 'Полон' : 'Вступить') + '</button>';
    }
    html += '</div>';
  }

  out.innerHTML = html;
  bindActions(out);
}

async function renderPlayerResults(out, q){
  let list = [];

  try {
    const r = await sb.rpc('search_players', { p_q: q, p_limit: 25 });
    if (!r.error) list = r.data || [];
  } catch (e){}

  if (!list.length){
    out.innerHTML = '<div class="empty">Никого не нашли по «' + esc(q) + '»</div>';
    return;
  }

  let html = '';
  let shown = 0;

  for (let i = 0; i < list.length; i++){
    const p = list[i];
    if (p.player_key === meKey) continue;
    shown++;

    html += '<div class="member">';
    html += '<div class="m-avatar">🎮</div>';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(p.display_name || 'Игрок') + tagPill(p.tag) + '</div>';
    html += '<div class="m-role" style="color:#94a3b8">🏆 ' + (p.cups || 0) + '</div>';
    html += '</div>';
    html += '<button class="mini add" data-addfriend="' + esc(p.player_key) + '" data-addname="' + esc(p.display_name || 'Игрок') + '">+</button>';
    html += '<button class="mini play" data-invite="' + esc(p.player_key) + '" data-invname="' + esc(p.display_name || 'Игрок') + '" data-invcups="' + (p.cups || 0) + '">⚔️</button>';
    html += '</div>';
  }

  if (!shown){
    out.innerHTML = '<div class="empty">Это ты. Введи другой тег.</div>';
    return;
  }

  out.innerHTML = html;
  bindActions(out);
}

  const isOwner = (myClan.owner_key === meKey);

  let chief = '—';
  for (let i = 0; i < mem.length; i++){

  $('ciName').innerHTML = esc(myClan.name) + tagPill(myClan.tag);

    if (!isMe){
      html += '<button class="mini play" data-invite="' + esc(m.player_key) +

              '" data-invcups="' + (m.cups || 0) + '">⚔️</button>';
      html += '<button class="mini add" data-addfriend="' + esc(m.player_key) +
              '" data-addname="' + esc(m.name || 'Игрок') + '">+</button>';
    }

      html += '<button class="mini kick" data-kick="' + esc(m.player_key) + '">✕</button>';
    }

  $('ciMembers').innerHTML = html;
  bindActions($('ciMembers'));

  $('ciShare').onclick = function (){ shareClan(myClan.name, myClan.tag); };
  $('ciLeave').onclick = leaveClan;
}

function renderFriendsTab(app){
  let html = '<div class="section-title">Мои друзья</div>';

  if (!friendsList.length){
    html += '<div class="empty">Пока нет друзей.<br>' +
            'Найди по тегу через поиск.</div>';
  } else {
    for (let i = 0; i < friendsList.length; i++){
      const f = friendsList[i];

      html += '<div class="member">';
      html += '<div class="m-avatar">🎮</div>';
      html += '<div class="m-info">';
      html += '<div class="m-name">' + esc(f.name) + tagPill(f.tag) + '</div>';
      html += '<div class="m-role" style="color:#94a3b8">🏆 ' + f.cups + '</div>';
      html += '</div>';
      html += '<button class="mini play" data-finvite="' + esc(f.key) + '">⚔️</button>';
      html += '<button class="mini kick" data-fremove="' + esc(f.key) + '">✕</button>';
      html += '</div>';
    }
  }

  html += '<button class="btn-wide blue" id="addFriendBtn">+ Найти по тегу</button>';

  app.innerHTML = html;

  $('addFriendBtn').onclick = openSearchPlayers;

  const inv = app.querySelectorAll('[data-finvite]');
  for (let i = 0; i < inv.length; i++){
    (function (b){
      b.onclick = function (){
        const key = b.getAttribute('data-finvite');
        for (let j = 0; j < friendsList.length; j++){
          if (friendsList[j].key === key){
            invitePlayer(key, friendsList[j].name, friendsList[j].cups);
            return;
          }
        }
      };
    })(inv[i]);
  }

  const rem = app.querySelectorAll('[data-fremove]');
  for (let i = 0; i < rem.length; i++){
    (function (b){
      b.onclick = async function (){
        const key = b.getAttribute('data-fremove');
        if (!confirm('Убрать из друзей?')) return;
        await Friends.remove(key);
        showToast('Удалён из друзей');
        await loadFriends();
      };
    })(rem[i]);
  }
}

function openSearchPlayers(){
  openSearch('players', '');
  setTimeout(function (){
    try { $('searchInput').focus(); } catch (e){}
  }, 100);
}

/* ================= ЧАТ ================= */

async function loadChat(){
  if (!myClan) return;

  const res = await sb.from('clan_messages')
    .select('*')
    .eq('clan_id', myClan.id)
    .order('id', { ascending: false })
    .limit(60);

  if (res.error) return;

  chatMsgs = (res.data || []).slice().reverse();
  renderChatMessages();
}

function renderChatMessages(){
  const box = $('chatBox');
  if (!box) return;

  if (!chatMsgs.length){
    box.innerHTML = '<div class="empty">Сообщений пока нет.<br>Напиши первым.</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < chatMsgs.length; i++){
    const m = chatMsgs[i];
    const mine = (m.player_key === meKey);

    if (m.kind === 'system'){
      html += '<div class="msg-sys">' + esc(m.text || '') + '</div>';
      continue;
    }

    html += '<div class="msg' + (mine ? ' mine' : '') + '">';
    html += '<div class="msg-head">' + esc(m.name || 'Игрок') + '</div>';

    if (m.kind === 'replay'){
      html += '<div class="msg-replay">' + esc(m.text || 'Повтор партии') + '</div>';
      if (m.match_id){
        html += '<button class="msg-btn" data-watch="' + m.match_id + '">▶ Смотреть повтор</button>';
      }
    } else {
      html += '<div class="msg-text">' + esc(m.text || '') + '</div>';
    }

    html += '</div>';
  }

  box.innerHTML = html;
  box.scrollTop = box.scrollHeight;

  const watch = box.querySelectorAll('[data-watch]');
  for (let i = 0; i < watch.length; i++){
    (function (b){
      b.onclick = function (){
        location.href = 'chess-history.html?m=' + b.getAttribute('data-watch');
      };
    })(watch[i]);
  }
}

async function sendChat(){
  const inp = $('chatInput');
  if (!inp || !myClan) return;

  const txt = inp.value.trim();
  if (!txt) return;

  if (hasBadWord(txt)){
    inp.value = '';
    showToast('Ненормативная лексика — сообщение не отправлено');
    return;
  }

  inp.value = '';

  const res = await sb.rpc('clan_post', {
    p_clan:  myClan.id,
    p_key:   meKey,
    p_name:  meName,
    p_kind:  'text',
    p_text:  txt,
    p_match: null
  });

  if (res.error){
    showToast('Не отправлено');
    inp.value = txt;
    return;
  }

  if (res.data && res.data.bad){
    showToast('Ненормативная лексика — сообщение не отправлено');
    inp.value = txt;
    return;
  }

  await loadChat();
}

async function openShare(){
  const res = await sb.from('arena_replays')
    .select('match_id,opponent_name,winner,my_side,arena,created_at')
    .eq('player_key', meKey)
    .order('created_at', { ascending: false })
    .limit(12);

  shareRows = res.error ? [] : (res.data || []);

  const box = $('shareList');

  if (!shareRows.length){
    box.innerHTML = '<div class="empty">Нет записанных партий.<br>' +
                    'Сыграй бой — он появится здесь.</div>';
    $('shareModal').classList.remove('hidden');
    return;
  }

  let html = '';

  for (let i = 0; i < shareRows.length; i++){
    const r = shareRows[i];

    let resTxt = 'ничья';
    if (r.winner === 'a' || r.winner === 'b'){
      resTxt = (r.winner === r.my_side) ? 'победа' : 'поражение';
    }

    html += '<div class="member">';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(r.opponent_name || 'Соперник') + '</div>';
    html += '<div class="m-role" style="color:#94a3b8">' + resTxt +
            ' · арена ' + (r.arena || 1) + '</div>';
    html += '</div>';
    html += '<button class="mini add" data-share="' + r.match_id + '">Отправить</button>';
    html += '</div>';
  }

  box.innerHTML = html;

  const btn = box.querySelectorAll('[data-share]');
  for (let i = 0; i < btn.length; i++){
    (function (b){
      b.onclick = function (){ shareReplay(b.getAttribute('data-share')); };
    })(btn[i]);
  }

  $('shareModal').classList.remove('hidden');
}

async function shareReplay(matchId){
  let row = null;
  for (let i = 0; i < shareRows.length; i++){
    if (shareRows[i].match_id === matchId){ row = shareRows[i]; break; }
  }
  if (!row || !myClan) return;

  let resTxt = 'Ничья';
  if (row.winner === 'a' || row.winner === 'b'){
    resTxt = (row.winner === row.my_side) ? 'Победа' : 'Поражение';
  }

  const label = 'Повтор партии против ' + (row.opponent_name || 'соперника') +
                ' · ' + resTxt + ' · арена ' + (row.arena || 1);

  const res = await sb.rpc('clan_post', {
    p_clan:  myClan.id,
    p_key:   meKey,
    p_name:  meName,
    p_kind:  'replay',
    p_text:  label,
    p_match: matchId
  });

  if (res.error){ showToast('Не отправлено'); return; }

  $('shareModal').classList.add('hidden');
  showToast('Повтор отправлен в чат');
  await loadChat();
}

/* ================= ДЕЙСТВИЯ ================= */

function bindActions(scope){
  const inv = scope.querySelectorAll('[data-invite]');
  for (let i = 0; i < inv.length; i++){
    (function (b){
      b.onclick = function (){
        invitePlayer(
          b.getAttribute('data-invite'),
          b.getAttribute('data-invname'),
          parseInt(b.getAttribute('data-invcups') || '0', 10) || 0
        );
      };
    })(inv[i]);
  }

  const add = scope.querySelectorAll('[data-addfriend]');
  for (let i = 0; i < add.length; i++){
    (function (b){
      b.onclick = async function (){
        const ok = await Friends.add(
          b.getAttribute('data-addfriend'),
          b.getAttribute('data-addname')
        );
        showToast(ok ? 'Добавлен в друзья' : 'Не удалось добавить');
        if (ok) await loadFriends();
      };
    })(add[i]);
  }

  const kick = scope.querySelectorAll('[data-kick]');
  for (let i = 0; i < kick.length; i++){
    (function (b){
      b.onclick = function (){ kickMember(b.getAttribute('data-kick')); };
    })(kick[i]);
  }

  const join = scope.querySelectorAll('[data-join]');
  for (let i = 0; i < join.length; i++){
    (function (b){
      b.onclick = function (){ joinClan(b.getAttribute('data-join')); };
    })(join[i]);
  }

  const shc = scope.querySelectorAll('[data-shareclan]');
  for (let i = 0; i < shc.length; i++){
    (function (b){
      b.onclick = function (){
        shareClan(
          b.getAttribute('data-shareclanname') || 'Клан',
          b.getAttribute('data-shareclan') || ''
        );
      };
    })(shc[i]);
  }
}

async function invitePlayer(key, name, cups){
  if (!window.Friends){ showToast('friends.js не подключён'); return; }
  if (!key) return;

  const r = await Friends.invite(key, name, cups);
  if (!r){ showToast('Не удалось отправить вызов'); return; }

  showToast('Вызов отправлен: ' + name);

  setTimeout(function (){
    Friends.play(r.id, 'host', key, name, cups, r.arena);
  }, 400);
}

async function joinClan(clanId){
  const mem = membersOf(clanId);
  if (mem.length >= MAX_MEMBERS){ showToast('Клан заполнен'); return; }

  const res = await sb.from('clan_members').insert({
    clan_id:    clanId,
    player_key: meKey,
    name:       meName,
    cups:       meCups,
    role:       'member'
  });

  if (res.error){ showToast('Не удалось вступить'); return; }

  showToast('Ты в клане!');
  closeSearch();
  await loadAll();
}

async function leaveClan(){
  if (!myMember) return;

  const isOwner = (myClan && myClan.owner_key === meKey);
  const mem = myClan ? membersOf(myClan.id) : [];

  if (isOwner && mem.length > 1){
    showToast('Сначала передай главу или выгони всех');
    return;
  }

  if (!confirm('Выйти из клана?')) return;

  closeClanModal();

  await sb.from('clan_members').delete().eq('player_key', meKey);

  if (isOwner && myClan){
    await sb.from('clans').delete().eq('id', myClan.id);
  }

  showToast('Ты вышел из клана');
  await loadAll();
}

async function kickMember(key){
  if (!myClan || myClan.owner_key !== meKey) return;
  if (!confirm('Выгнать участника?')) return;

  await sb.from('clan_members').delete().eq('player_key', key);
  showToast('Участник выгнан');
  await loadAll();
  if (!$('clanInfoModal').classList.contains('hidden')) renderClanModal();
}

async function createClan(){
  const name = $('inName').value.trim();
  const desc = $('inDesc').value.trim();

  if (name.length < 3){ showToast('Название минимум 3 символа'); return; }

  const res = await sb.from('clans').insert({
    name: name, tag: null, emblem: pickedEmblem,
    description: desc, owner_key: meKey
  }).select().single();

  if (res.error){ showToast('Не удалось создать клан'); return; }

  const memRes = await sb.from('clan_members').insert({
    clan_id: res.data.id, player_key: meKey,
    name: meName, cups: meCups, role: 'owner'
  });

  if (memRes.error){
    showToast('Клан создан, но вступление не удалось');
  } else {
    showToast('Клан создан!');
  }

  try { await sb.rpc('ensure_clan_code', { p_clan: res.data.id }); } catch (e){}

  $('createModal').classList.add('hidden');
  $('inName').value = '';
  $('inDesc').value = '';

  await loadAll();
}

/* ================= МОДАЛКИ ================= */

function buildEmblems(){
  const row = $('emblemRow');
  row.innerHTML = '';

  for (let i = 0; i < EMBLEMS.length; i++){
    const b = document.createElement('button');
    b.className = 'emblem-opt' + (EMBLEMS[i] === pickedEmblem ? ' on' : '');
    b.textContent = EMBLEMS[i];
    (function (em){
      b.onclick = function (){ pickedEmblem = em; buildEmblems(); };
    })(EMBLEMS[i]);
    row.appendChild(b);
  }
}

$('bannerBtn').onclick = function (){
  if (myMember){ showToast('Ты уже в клане'); return; }
  pickedEmblem = '🛡️';
  buildEmblems();
  $('createModal').classList.remove('hidden');
};

$('shareMeBtn').onclick = shareMe;
$('ciClose').onclick = closeClanModal;
$('searchClose').onclick = closeSearch;

$('clanInfoModal').onclick = function (e){
  if (e.target === $('clanInfoModal')) closeClanModal();
};

$('searchModal').onclick = function (e){
  if (e.target === $('searchModal')) closeSearch();
};

$('searchInput').addEventListener('input', function (){
  searchQ = this.value;
  clearTimeout(window.__sqT);
  window.__sqT = setTimeout(applySearch, 350);
});

const modalChips = $('searchModal').querySelectorAll('.chip');
for (let i = 0; i < modalChips.length; i++){
  (function (c){
    c.onclick = function (){
      searchMode = c.getAttribute('data-mode');
      for (let k = 0; k < modalChips.length; k++){
        modalChips[k].classList.toggle('on', modalChips[k] === c);
      }
      applySearch();
    };
  })(modalChips[i]);
}

$('createCancel').onclick = function (){ $('createModal').classList.add('hidden'); };
$('createOk').onclick = createClan;

$('addCancel').onclick = function (){ $('addModal').classList.add('hidden'); };
$('shareCancel').onclick = function (){ $('shareModal').classList.add('hidden'); };

$('addSearch').onclick = async function (){
  if (!window.Friends){ showToast('friends.js не подключён'); return; }

  const nick = $('inNick').value.trim();
  if (nick.replace('#', '').length < 2){ showToast('Минимум 2 символа'); return; }

  const box = $('addResults');
  box.innerHTML = '<div class="empty">Ищем…</div>';

  let list = [];

  try {
    const r = await sb.rpc('search_players', { p_q: nick, p_limit: 15 });
    if (!r.error) list = r.data || [];
  } catch (e){}

  if (!list.length){
    box.innerHTML = '<div class="empty">Никого не нашли</div>';
    return;
  }

  let html = '';

  for (let i = 0; i < list.length; i++){
    const p = list[i];
    if (p.player_key === meKey) continue;

    html += '<div class="member">';
    html += '<div class="m-avatar">🎮</div>';
    html += '<div class="m-info">';
    html += '<div class="m-name">' + esc(p.display_name || 'Игрок') + tagPill(p.tag) + '</div>';
    html += '<div class="m-role" style="color:#94a3b8">🏆 ' + (p.cups || 0) + '</div>';
    html += '</div>';
    html += '<button class="mini add" data-pick="' + esc(p.player_key) +
            '" data-pickname="' + esc(p.display_name || 'Игрок') + '">Добавить</button>';
    html += '</div>';
  }

  box.innerHTML = html || '<div class="empty">Никого не нашли</div>';

  const picks = box.querySelectorAll('[data-pick]');
  for (let i = 0; i < picks.length; i++){
    (function (b){
      b.onclick = async function (){
        const ok = await Friends.add(
          b.getAttribute('data-pick'),
          b.getAttribute('data-pickname')
        );
        showToast(ok ? 'Добавлен в друзья' : 'Не удалось добавить');
        if (ok){
          $('addModal').classList.add('hidden');
          await loadFriends();
        }
      };
    })(picks[i]);
  }
};

/* ================= ВЫЗОВЫ ================= */

function watchChallenges(){
  if (!window.Friends) return;

  Friends.watch(function (c){
    const o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:2000;' +
      'display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';

    o.innerHTML =
      '<div style="max-width:330px;width:100%;background:linear-gradient(145deg,#1e293b,#0f172a);' +
        'border:2px solid #22c55e;border-radius:16px;padding:20px">' +
        '<div style="font-size:40px;margin-bottom:8px">⚔️</div>' +
        '<div id="cnm" style="font-size:15px;font-weight:900;margin-bottom:6px"></div>' +
        '<div style="font-size:12px;color:#94a3b8;margin-bottom:14px">' +
          'Вызывает тебя на дружескую партию</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="cNo" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#ef4444,#991b1b);color:#fff;font-weight:900;' +
            'font-size:13px">Отклонить</button>' +
          '<button id="cYes" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-weight:900;' +
            'font-size:13px">Играть</button>' +
        '</div>' +
      '</div>';

    document.body.appendChild(o);
    o.querySelector('#cnm').textContent = c.from_name || 'Игрок';

    let closed = false;
    const chk = setInterval(async function(){
      if (closed) return;
      const st = await Friends.status(c.id);
      if (!st || st.status !== 'pending'){
        closed = true;
        clearInterval(chk);
        o.remove();
      }
    }, 3000);

    function close(){
      closed = true;
      clearInterval(chk);
      o.remove();
    }

    o.querySelector('#cNo').onclick = async function (){
      close();
      await Friends.answer(c.id, 'declined');
    };

    o.querySelector('#cYes').onclick = async function (){
      close();
      const r = await Friends.answer(c.id, 'accepted');
      if (!r || !r.accepted) return;
      Friends.play(c.id, 'guest', c.from_key, c.from_name, c.from_cups, c.arena);
    };
  });
}

/* ================= ССЫЛКИ ================= */

function handleDeepLink(){
  const p = new URLSearchParams(location.search);
  const clan = p.get('clan');
  const player = p.get('player');

  if (!clan && !player) return;

  const mode = clan ? 'clans' : 'players';
  const q = String(clan || player || '').replace(/^#/, '');

  setTab('clan');
  openSearch(mode, q);

  history.replaceState(null, '', location.pathname);
}

/* ================= СТАРТ ================= */

buildEmblems();
boot();
setTimeout(watchChallenges, 1500);

document.addEventListener('visibilitychange', function (){
  if (!document.hidden){
    loadAll();
    loadFriends();
  }
});
</script>
