<style>

.me-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 12px 8px;padding:10px 12px;border-radius:12px;background:linear-gradient(145deg,#1e293b,#0f172a);border:1px solid #334155}

.banner{margin:0 12px 12px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#5b21b6);display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner-text{font-size:13px;font-weight:900;line-height:1.3}
.banner-btn{background:#fff;color:#4c1d95;border:0;border-radius:10px;padding:9px 16px;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap}
#app{padding:0 12px 20px}
.search-wide{width:100%;padding:13px;border-radius:12px;border:2px solid #334155;background:linear-gradient(145deg,#1e293b,#0f172a);color:#ffcc00;font-size:13.5px;font-weight:900;cursor:pointer;margin-bottom:12px}
.search-box{margin-bottom:8px}

.section-title{text-align:center;font-size:12.5px;font-weight:900;letter-spacing:1px;color:#cbd5e1;margin:14px 0 12px;display:flex;align-items:center;gap:10px}

.tagpill{font-size:10px;font-weight:900;color:#000;background:linear-gradient(145deg,#ffcc00,#ff9500);padding:1px 6px;border-radius:6px;margin-left:5px;white-space:nowrap;cursor:pointer;display:inline-block}
.clan-card{display:flex;align-items:center;gap:10px;background:linear-gradient(145deg,#1e293b,#131c2e);border:2px solid #334155;border-radius:14px;padding:12px;margin-bottom:10px}
.clan-emblem{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25)}
.clan-info{flex:1;min-width:0}
.clan-name{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clan-sub{font-size:11px;color:#94a3b8;margin-top:2px}
.clan-join{border:0;border-radius:10px;padding:9px 13px;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-size:12px;font-weight:900;cursor:pointer;white-space:nowrap}

.btn-wide{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:900;cursor:pointer;color:#fff;background:linear-gradient(145deg,#22c55e,#15803d);margin-top:8px}
.btn-wide.grey{background:linear-gradient(145deg,#475569,#1e293b)}
.btn-wide.blue{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.clan-bar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:linear-gradient(145deg,#f59e0b,#b45309);border:2px solid #fbbf24;cursor:pointer;margin-bottom:10px}
.clan-bar:active{transform:scale(.99)}
.cb-emblem{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.6)}
.cb-info{flex:1;min-width:0}
.cb-name{font-size:14.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb-sub{font-size:10.5px;color:#fff3d6;margin-top:2px;font-weight:700}
.cb-chev{font-size:22px;color:#fff;opacity:.85;line-height:1;margin-left:2px}
.member{display:flex;align-items:center;gap:8px;background:linear-gradient(145deg,#1e293b,#131c2e);border:1px solid #334155;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.member.me{border-color:#22c55e}
.m-rank{width:26px;height:26px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#0f172a;background:linear-gradient(180deg,#e2e8f0,#94a3b8)}
.m-rank.r1{background:linear-gradient(180deg,#ffe680,#e0a200)}
.m-rank.r2{background:linear-gradient(180deg,#e2e8f0,#9aa7b8)}
.m-rank.r3{background:linear-gradient(180deg,#f0b27a,#b06a2c)}
.m-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(0,0,0,.4);border:1px solid #475569}
.m-info{flex:1;min-width:0;cursor:pointer}
.m-name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-role{font-size:10.5px;color:#fbbf24;font-weight:800;margin-top:1px}
.m-cups{font-size:11.5px;color:#ffcc00;font-weight:900;white-space:nowrap}
.mini{border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:900;padding:7px 9px;cursor:pointer;white-space:nowrap}
.mini.play{background:linear-gradient(145deg,#22c55e,#15803d)}
.mini.add{background:linear-gradient(145deg,#3b82f6,#1d4ed8)}
.mini.share{background:linear-gradient(145deg,#8b5cf6,#6d28d9)}
.mini.kick{background:linear-gradient(145deg,#ef4444,#991b1b)}
.chat-box{background:linear-gradient(145deg,#131c2e,#0f172a);border:1px solid #334155;border-radius:12px;padding:10px;height:calc(100dvh - 430px);min-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:8px 10px;max-width:92%}
.msg.mine{align-self:flex-end;background:#14532d;border-color:#166534}
.msg-head{font-size:10px;color:#94a3b8;font-weight:800;margin-bottom:3px;cursor:pointer}
.msg-text{font-size:13.5px;line-height:1.4;word-break:break-word}
.msg-replay{font-size:11.5px;color:#cbd5e1;margin-bottom:6px}
.msg-btn{width:100%;padding:8px;border:0;border-radius:8px;background:linear-gradient(145deg,#ffcc00,#ff9500);color:#000;font-size:11.5px;font-weight:900;cursor:pointer}
.msg-sys{align-self:center;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-size:11.5px;font-weight:800;padding:7px 14px;border-radius:10px;text-align:center;max-width:96%}
.emoji-row{display:flex;gap:4px;overflow-x:auto;padding:8px 0 0;scrollbar-width:none}
.emoji-row::-webkit-scrollbar{display:none}
.emoji-row button{flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1px solid #334155;background:#0f172a;font-size:18px;cursor:pointer;line-height:1;padding:0}
.chat-row{display:flex;gap:6px;margin-top:8px}
.chat-row input{flex:1;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none;user-select:text;-webkit-user-select:text}
.chat-row button{padding:0 16px;border:0;border-radius:10px;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.94);display:flex;align-items:center;justify-content:center;padding:14px;z-index:1000;overflow-y:auto}
.modal-box{width:100%;max-width:390px;background:linear-gradient(180deg,#243b6b,#1a2745);border:2px solid #64748b;border-radius:16px;padding:14px;max-height:88vh;overflow-y:auto}
.modal-title{font-size:17px;font-weight:900;margin-bottom:12px;text-align:center}
/* карточка клана */
#clanInfoModal .modal-box{padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:90vh}
.cr-top{display:flex;align-items:center;justify-content:center;position:relative;padding:10px 14px;background:linear-gradient(180deg,#4ab3f8,#1b6fd6);border-bottom:3px solid #f7c948;flex-shrink:0}
.cr-top h3{margin:0;font-size:16px;font-weight:900;letter-spacing:.5px}
.ci-close{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:9px;border:2px solid #fff;background:linear-gradient(180deg,#f4665e,#c62828);color:#fff;font-size:14px;cursor:pointer;line-height:1}
.cr-scroll{flex:1;overflow-y:auto;padding:12px 12px 14px}
.cr-head{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.cr-emblem{width:58px;height:58px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(145deg,#f59e0b,#b45309);border:2px solid #fbbf24;box-shadow:0 6px 14px rgba(0,0,0,.4)}
.cr-name{font-size:16px;font-weight:900;line-height:1.2}
.cr-sub{font-size:11px;color:#c6d8ff;margin-top:3px}
.cr-cups{margin-left:auto;text-align:right;flex-shrink:0}
.cr-cups b{display:block;font-size:16px;font-weight:900;color:#ffcc00;line-height:1.1}
.cr-cups span{font-size:9px;color:#c6d8ff;font-weight:800;letter-spacing:.3px}
.cr-desc{font-size:12.5px;line-height:1.45;color:#e2e8f0;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:9px 11px;white-space:pre-wrap;word-break:break-word;margin-bottom:10px}
.cr-desc.empty{color:#8fa3c8;font-style:italic}
.cr-desc-edit{width:100%;height:74px;resize:none;padding:9px 11px;border-radius:10px;border:1px solid #64748b;background:#0f172a;color:#fff;font-size:12.5px;line-height:1.45;outline:none;user-select:text;-webkit-user-select:text;font-family:inherit;margin-bottom:6px}
.cr-desc-count{font-size:10px;color:#8fa3c8;text-align:right;margin-bottom:6px}
.cr-desc-row{display:flex;gap:7px;margin-bottom:10px}
.cr-desc-row button{flex:1;padding:10px;border:0;border-radius:9px;font-size:12px;font-weight:900;color:#fff;cursor:pointer}
#descCancel{background:linear-gradient(180deg,#64748b,#334155)}
#descSave{background:linear-gradient(180deg,#5ddc7a,#1f9e42)}
.cr-desc-err{font-size:11px;color:#fca5a5;margin:-4px 0 10px;line-height:1.35}
.cr-edit{font-size:11px;font-weight:900;color:#ffcc00;background:rgba(0,0,0,.3);border:1px solid #f7c948;border-radius:8px;padding:4px 9px;cursor:pointer;float:right;margin:-2px 0 8px 8px}
.cr-stats{display:flex;background:linear-gradient(180deg,#2f74d8,#1a4c9e);border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid #3b82f6}
.cr-stat{flex:1;padding:8px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.18)}
.cr-stat:last-child{border-right:0}
.cr-stat span{display:block;font-size:8.5px;color:#c6d8ff;font-weight:800;letter-spacing:.3px;line-height:1.2}
.cr-stat b{display:block;font-size:14px;color:#fff;font-weight:900;margin-top:3px}
.cr-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.cr-bar-l{font-size:9.5px;font-weight:900;color:#8fa3c8;letter-spacing:.5px;line-height:1.2}
.cr-bar-l b{display:block;font-size:15px;color:#fff;margin-top:2px}
.cr-btns{display:flex;align-items:center;gap:7px}
.cr-leave{padding:11px 14px;border:2px solid #fff;border-radius:10px;background:linear-gradient(180deg,#f4665e,#c62828);color:#fff;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #7f1d1d;white-space:nowrap}
.cr-leave:active{transform:translateY(2px);box-shadow:0 1px 0 #7f1d1d}
.cr-search{width:42px;height:42px;border:2px solid #fff;border-radius:10px;background:linear-gradient(180deg,#5ea8ff,#1e63c8);color:#fff;font-size:17px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #123b7a}
.cr-search:active{transform:translateY(2px);box-shadow:0 1px 0 #123b7a}
.emblem-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.emblem-opt{width:42px;height:42px;border-radius:12px;border:2px solid #334155;background:#0f172a;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.emblem-opt.on{border-color:#22c55e;background:#064e3b}
.modal-box input,.modal-box textarea{width:100%;margin-bottom:10px;padding:12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff;font-size:14px;outline:none;user-select:text;-webkit-user-select:text;font-family:inherit}
.modal-box textarea{resize:none;height:70px}
.modal-btns{display:flex;gap:8px;margin-top:6px}
.modal-btns button{flex:1;padding:13px;border:0;border-radius:10px;font-size:14px;font-weight:900;cursor:pointer;color:#fff}
#createCancel,#addCancel,#shareCancel{background:linear-gradient(145deg,#475569,#1e293b)}
#createOk,#addSearch{background:linear-gradient(145deg,#22c55e,#15803d)}
.empty{text-align:center;color:#64748b;font-size:13px;padding:22px 10px;line-height:1.5}
.errbox{margin:0 12px 12px;padding:12px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid #7f1d1d;color:#fecaca;font-size:11.5px;line-height:1.45;word-break:break-word}
.toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%) translateY(10px);background:#1e293b;border:1px solid #475569;color:#ffcc00;padding:10px 16px;border-radius:8px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;z-index:2300;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bottom-nav{position:fixed;bottom:0;left:0;width:100%;height:68px;background:linear-gradient(180deg,#1a1a2e 0%,#0f0f1e 100%);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-around;align-items:center;z-index:999;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{background:transparent;border:none;color:#94a3b8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:bold;cursor:pointer;flex:1;height:100%;gap:3px}
.nav-btn .icon-wrap{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#2a2a3e,#15151f)}
.nav-btn .icon{font-size:20px}
.nav-btn.active{color:#ffcc00}
.nav-btn.active .icon-wrap{background:linear-gradient(145deg,#ffcc00,#ff9500)}
.deck-stack{position:relative;width:24px;height:28px}
.deck-stack .deck-card{position:absolute;width:16px;height:22px;border-radius:3px;border:1px solid rgba(255,255,255,.5)}
.deck-stack .deck-card:nth-child(1){left:0;top:6px;transform:rotate(-18deg);background:linear-gradient(135deg,#f093fb,#f5576c)}
.deck-stack .deck-card:nth-child(2){left:4px;top:3px;transform:rotate(-8deg);background:linear-gradient(135deg,#4facfe,#00f2fe)}
.deck-stack .deck-card:nth-child(3){left:8px;top:0;transform:rotate(4deg);background:linear-gradient(135deg,#43e97b,#38f9d7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
</style>

<body>

<div class="top-bar">
  <div class="page-title">Клан</div>
  <div class="currency">🏆 <span id="cupsTop">0</span></div>
</div>

<div class="me-bar">
  <div class="me-tag" id="myTagBox">Мой тег<b id="myTag">#—</b></div>
  <button id="shareMeBtn">📤 Поделиться</button>
</div>

<div class="tabs">
  <button class="tab on" data-tab="clan">Клан</button>
  <button class="tab" data-tab="friends">Друзья</button>
</div>

<div class="banner" id="banner">
  <div class="banner-text">Вступи в клан или создай новый!</div>
  <button class="banner-btn" id="bannerBtn">Создать</button>
</div>

<div id="errBox" class="errbox hidden"></div>
<div id="app"></div>

<div id="searchModal" class="modal hidden">
  <div class="modal-box" style="max-width:420px">
    <div class="ci-head">
      <div style="flex:1;min-width:0">
        <div class="ci-name">Поиск</div>
        <div class="ci-sub">По тегу #ABC12 или по имени</div>
      </div>
      <button class="ci-close" id="searchClose" style="position:static;transform:none">✕</button>
    </div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="#тег или имя" autocomplete="off" spellcheck="false">
      <div class="chips">
        <button class="chip on" data-mode="clans">Кланы</button>
        <button class="chip" data-mode="players">Игроки</button>
      </div>
    </div>
    <div id="searchOut"></div>
  </div>
</div>

<div id="clanInfoModal" class="modal hidden">
  <div class="modal-box">
    <div class="cr-top">
      <h3>Клан</h3>
      <button class="ci-close" id="ciClose">✕</button>
    </div>
    <div class="cr-scroll" id="ciScroll"></div>
  </div>
</div>

<div id="createModal" class="modal hidden">

    <div class="modal-title">Новый клан</div>
    <div class="emblem-row" id="emblemRow"></div>
    <input id="inName" type="text" maxlength="20" placeholder="Название клана">
    <textarea id="inDesc" maxlength="120" placeholder="Описание (необязательно)"></textarea>
    <div class="modal-btns">
      <button id="createCancel">Отмена</button>
      <button id="createOk">Создать</button>
    </div>
  </div>
</div>

<div id="addModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">Добавить друга</div>
    <input id="inNick" type="text" maxlength="16" placeholder="Ник или #тег">
    <div class="modal-btns">
      <button id="addCancel">Отмена</button>
      <button id="addSearch">Найти</button>
    </div>
    <div id="addResults"></div>
  </div>
</div>

<div id="shareModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title">Отправить повтор в чат</div>
    <div id="shareList"></div>
    <div class="modal-btns">
      <button id="shareCancel">Закрыть</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="bottom-nav">

function chatNorm(t){
  t = String(t||'').toLowerCase();
  const m = {'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','@':'a','$':'s','!':'i'};
  let o = '';
  for (let i=0;i<t.length;i++){ const c=t.charAt(i); o += (m[c]!==undefined)?m[c]:c; }
  return o.replace(/ё/g,'е').replace(/[^a-zа-я]/g,'');
}
function hasBadWord(t){
  const s = chatNorm(t);
  if (!s) return false;
  for (let i=0;i<BAD_ROOTS.length;i++) if (s.indexOf(BAD_ROOTS[i])>=0) return true;
  return false;
}

function membersOf(clanId){
  const out=[], seen={};
  for(let i=0;i<allMembers.length;i++){
    const m=allMembers[i];
    if(m.clan_id!==clanId) continue;
    if(seen[m.player_key]) continue;
    seen[m.player_key]=1; out.push(m);
  }
  out.sort(function(a,b){
    if(a.role==='owner'&&b.role!=='owner') return -1;
    if(b.role==='owner'&&a.role!=='owner') return 1;
    return (b.cups||0)-(a.cups||0);
  });
  return out;
}

    h+='<div class="m-rank'+(i<3?' r'+(i+1):'')+'">'+(i+1)+'</div>';
    h+='<div class="m-avatar" data-profile="'+esc(m.player_key)+'">'+(isChief?'👑':'🎮')+'</div>';
    h+='<div class="m-info" data-profile="'+esc(m.player_key)+'">';
    h+='<div class="m-name">'+esc(m.name||'Игрок')+(isMe?' (ты)':'')+tagPill(tagMap[m.player_key],'player',m.name)+'</div>';
    h+='<div class="m-role">'+(isChief?'Глава клана':'Участник')+'</div></div>';
    h+='<div class="m-cups">🏆 '+(m.cups||0)+'</div>';
    if(!isMe){
      h+='<button class="mini play" data-invite="'+esc(m.player_key)+'" data-invname="'+esc(m.name||'Игрок')+'" data-invcups="'+(m.cups||0)+'">⚔️</button>';
      h+='<button class="mini add" data-addfriend="'+esc(m.player_key)+'" data-addname="'+esc(m.name||'Игрок')+'">+</button>';
    }
    if(owner&&!isMe) h+='<button class="mini kick" data-kick="'+esc(m.player_key)+'">✕</button>';
    h+='</div>';
  }

  h+='<button class="btn-wide blue" id="ciShare">📤 Позвать в клан</button>';

  $('ciScroll').innerHTML=h;
  bindActions($('ciScroll'));

  const ta=$('descInput'), left=$('descLeft');
  if(ta&&left){
    ta.addEventListener('input',function(){ left.textContent=120-ta.value.length; });
    setTimeout(function(){ try{ ta.focus(); }catch(e){} },80);
  }
  const dc=$('descCancel'); if(dc) dc.onclick=function(){ descEditing=false; renderClanModal(); };
  const ds=$('descSave'); if(ds) ds.onclick=saveDesc;
  const de=$('descEditBtn'); if(de) de.onclick=function(){ descEditing=true; renderClanModal(); };

  $('ciLeave').onclick=leaveClan;
  $('ciSearch').onclick=function(){ closeClanModal(); openSearch('players',''); };
  $('ciShare').onclick=function(){ shareClan(myClan.name,myClan.tag); };
}

async function saveDesc(){
  const ta=$('descInput'); if(!ta||!myClan) return;
  const d=ta.value.trim().slice(0,120);
  const btn=$('descSave'); if(btn){ btn.disabled=true; btn.textContent='…'; }
  let ok=false, why='';

  try{
    const r=await sb.rpc('clan_set_description',{p_clan:myClan.id,p_key:meKey,p_desc:d});
    if(r.error){ why=r.error.message||'ошибка RPC'; }
    else if(r.data&&r.data.ok===false){ why=r.data.error||'отказ'; }
    else ok=true;
  }catch(e){ why='сеть'; }

  if(!ok){
    try{
      const u=await sb.from('clans').update({description:d}).eq('id',myClan.id);
      if(!u.error) ok=true; else if(!why) why=u.error.message;
    }catch(e){}
  }

  if(btn){ btn.disabled=false; btn.textContent='Сохранить'; }

  if(!ok){
    const e=$('descErr');
    if(e){ e.textContent='Не сохранилось: '+(why||'причина неизвестна'); e.classList.remove('hidden'); }
    else showToast('Не удалось сохранить описание');
    return;
  }

  myClan.description=d; descEditing=false;
  for(let i=0;i<allClans.length;i++) if(allClans[i].id===myClan.id) allClans[i].description=d;
  showToast('Описание обновлено');
  renderClanModal();
  render();
}

function renderFriendsTab(app){
  let h='<div class="section-title">Мои друзья</div>';
  if(!friendsList.length){
    h+='<div class="empty">Пока нет друзей.<br>Найди по тегу через поиск.</div>';
  } else {
    for(let i=0;i<friendsList.length;i++){
      const f=friendsList[i];
      h+='<div class="member"><div class="m-avatar" data-profile="'+esc(f.key)+'">🎮</div>';
      h+='<div class="m-info" data-profile="'+esc(f.key)+'">';
      h+='<div class="m-name">'+esc(f.name)+tagPill(f.tag,'player',f.name)+'</div>';
      h+='<div class="m-role" style="color:#94a3b8">🏆 '+f.cups+'</div></div>';
      h+='<button class="mini play" data-finvite="'+esc(f.key)+'">⚔️</button>';
      h+='<button class="mini kick" data-fremove="'+esc(f.key)+'">✕</button></div>';
    }
  }
  h+='<button class="btn-wide blue" id="addFriendBtn">+ Найти по тегу</button>';
  app.innerHTML=h;

  $('addFriendBtn').onclick=function(){
    openSearch('players','');
    setTimeout(function(){ try{ $('searchInput').focus(); }catch(e){} },100);
  };

  const inv=app.querySelectorAll('[data-finvite]');
  for(let i=0;i<inv.length;i++){
    (function(b){
      b.onclick=function(){
        const k=b.getAttribute('data-finvite');
        for(let j=0;j<friendsList.length;j++){
          if(friendsList[j].key===k){ invitePlayer(k,friendsList[j].name,friendsList[j].cups); return; }
        }
      };
    })(inv[i]);
  }

  const rem=app.querySelectorAll('[data-fremove]');
  for(let i=0;i<rem.length;i++){
    (function(b){
      b.onclick=async function(){
        const k=b.getAttribute('data-fremove');
        if(!confirm('Убрать из друзей?')) return;
        await Friends.remove(k);
        showToast('Удалён из друзей');
        await loadFriends();
      };
    })(rem[i]);
  }
  bindActions(app);
}

async function loadChat(){
  if(!myClan) return;
  const r=await sb.from('clan_messages').select('*').eq('clan_id',myClan.id).order('id',{ascending:false}).limit(60);
  if(r.error) return;
  chatMsgs=(r.data||[]).slice().reverse();
  renderChatMessages();
}

function renderChatMessages(){
  const box=$('chatBox'); if(!box) return;
  if(!chatMsgs.length){ box.innerHTML='<div class="empty">Сообщений пока нет.<br>Напиши первым.</div>'; return; }

  let h='';
  for(let i=0;i<chatMsgs.length;i++){
    const m=chatMsgs[i], mine=(m.player_key===meKey);
    if(m.kind==='system'){ h+='<div class="msg-sys">'+esc(m.text||'')+'</div>'; continue; }
    h+='<div class="msg'+(mine?' mine':'')+'">';
    h+='<div class="msg-head" data-profile="'+esc(m.player_key)+'">'+esc(m.name||'Игрок')+'</div>';
    if(m.kind==='replay'){
      h+='<div class="msg-replay">'+esc(m.text||'Повтор партии')+'</div>';
      if(m.match_id) h+='<button class="msg-btn" data-watch="'+m.match_id+'">▶ Смотреть повтор</button>';
    } else {
      h+='<div class="msg-text">'+esc(m.text||'')+'</div>';
    }
    h+='</div>';
  }
  box.innerHTML=h;
  box.scrollTop=box.scrollHeight;

  const w=box.querySelectorAll('[data-watch]');
  for(let i=0;i<w.length;i++){
    (function(b){
      b.onclick=function(){ location.href='chess-history.html?m='+b.getAttribute('data-watch'); };
    })(w[i]);
  }
  const pr=box.querySelectorAll('[data-profile]');
  for(let i=0;i<pr.length;i++){
    (function(el){ el.onclick=function(){ openProfile(el.getAttribute('data-profile')); }; })(pr[i]);
  }
}

async function sendChat(){
  const inp=$('chatInput'); if(!inp||!myClan) return;
  const txt=inp.value.trim(); if(!txt) return;

  if(hasBadWord(txt)){
    inp.value='';
    showToast('Ненормативная лексика — сообщение не отправлено');
    return;
  }
  inp.value='';

  const r=await sb.rpc('clan_post',{
    p_clan:myClan.id,p_key:meKey,p_name:meName,
    p_kind:'text',p_text:txt,p_match:null
  });

  if(r.error){ showToast('Не отправлено'); inp.value=txt; return; }
  if(r.data&&r.data.bad){ showToast('Ненормативная лексика — сообщение не отправлено'); inp.value=txt; return; }
  await loadChat();
}

async function openShare(){
  const r=await sb.from('arena_replays')
    .select('match_id,opponent_name,winner,my_side,arena,created_at')
    .eq('player_key',meKey).order('created_at',{ascending:false}).limit(12);
  shareRows=r.error?[]:(r.data||[]);

  const box=$('shareList');
  if(!shareRows.length){
    box.innerHTML='<div class="empty">Нет записанных партий.<br>Сыграй бой — он появится здесь.</div>';
    $('shareModal').classList.remove('hidden');
    return;
  }

  let h='';
  for(let i=0;i<shareRows.length;i++){
    const r2=shareRows[i];
    let t='ничья';
    if(r2.winner==='a'||r2.winner==='b') t=(r2.winner===r2.my_side)?'победа':'поражение';
    h+='<div class="member"><div class="m-info">';
    h+='<div class="m-name">'+esc(r2.opponent_name||'Соперник')+'</div>';
    h+='<div class="m-role" style="color:#94a3b8">'+t+' · арена '+(r2.arena||1)+'</div></div>';
    h+='<button class="mini add" data-share="'+r2.match_id+'">Отправить</button></div>';
  }
  box.innerHTML=h;

  const b=box.querySelectorAll('[data-share]');
  for(let i=0;i<b.length;i++){
    (function(x){ x.onclick=function(){ shareReplay(x.getAttribute('data-share')); }; })(b[i]);
  }
  $('shareModal').classList.remove('hidden');
}

async function shareReplay(matchId){
  let row=null;
  for(let i=0;i<shareRows.length;i++) if(shareRows[i].match_id===matchId){ row=shareRows[i]; break; }
  if(!row||!myClan) return;

  let t='Ничья';
  if(row.winner==='a'||row.winner==='b') t=(row.winner===row.my_side)?'Победа':'Поражение';

  const label='Повтор партии против '+(row.opponent_name||'соперника')+' · '+t+' · арена '+(row.arena||1);

  const r=await sb.rpc('clan_post',{
    p_clan:myClan.id,p_key:meKey,p_name:meName,
    p_kind:'replay',p_text:label,p_match:matchId
  });

  if(r.error){ showToast('Не отправлено'); return; }
  $('shareModal').classList.add('hidden');
  showToast('Повтор отправлен в чат');
  await loadChat();
}

function bindActions(scope){
  const inv=scope.querySelectorAll('[data-invite]');
  for(let i=0;i<inv.length;i++){
    (function(b){
      b.onclick=function(){
        invitePlayer(b.getAttribute('data-invite'),b.getAttribute('data-invname'),
          parseInt(b.getAttribute('data-invcups')||'0',10)||0);
      };
    })(inv[i]);
  }
  const add=scope.querySelectorAll('[data-addfriend]');
  for(let i=0;i<add.length;i++){
    (function(b){
      b.onclick=async function(){
        const ok=await Friends.add(b.getAttribute('data-addfriend'),b.getAttribute('data-addname'));
        showToast(ok?'Добавлен в друзья':'Не удалось добавить');
        if(ok) await loadFriends();
      };
    })(add[i]);
  }
  const kick=scope.querySelectorAll('[data-kick]');
  for(let i=0;i<kick.length;i++){
    (function(b){ b.onclick=function(){ kickMember(b.getAttribute('data-kick')); }; })(kick[i]);
  }
  const join=scope.querySelectorAll('[data-join]');
  for(let i=0;i<join.length;i++){
    (function(b){ b.onclick=function(){ joinClan(b.getAttribute('data-join'),b); }; })(join[i]);
  }
  const shc=scope.querySelectorAll('[data-shareclan]');
  for(let i=0;i<shc.length;i++){
    (function(b){
      b.onclick=function(){
        shareClan(b.getAttribute('data-shareclanname')||'Клан',b.getAttribute('data-shareclan')||'');
      };
    })(shc[i]);
  }
  const pf=scope.querySelectorAll('[data-profile]');
  for(let i=0;i<pf.length;i++){
    (function(el){ el.onclick=function(){ openProfile(el.getAttribute('data-profile')); }; })(pf[i]);
  }
  const tg=scope.querySelectorAll('[data-copytag]');
  for(let i=0;i<tg.length;i++){
    (function(el){
      el.onclick=function(e){ e.stopPropagation(); copyTag(el); };
    })(tg[i]);
  }
}

async function invitePlayer(key,name,cups){
  if(!window.Friends){ showToast('friends.js не подключён'); return; }
  if(!key) return;
  const r=await Friends.invite(key,name,cups);
  if(!r){ showToast('Не удалось отправить вызов'); return; }
  showToast('Вызов отправлен: '+name);
  setTimeout(function(){ Friends.play(r.id,'host',key,name,cups,r.arena); },400);
}

async function joinClan(clanId,btn){
  if(!clanId||joining) return;

  if(myMember){
    showToast(myMember.clan_id===clanId?'Ты уже в этом клане':'Ты уже в другом клане — сначала выйди из него');
    closeSearch();
    return;
  }

  joining=true;
  if(btn){ btn.disabled=true; btn.textContent='…'; }

  let ok=false, msg='';

  try{
    const r=await sb.rpc('clan_join',{p_clan:clanId,p_key:meKey,p_name:meName,p_cups:meCups});
    if(r.error){ msg=r.error.message||''; }
    else {
      const d=r.data||{};
      if(d.ok===false) msg=d.error||'не удалось вступить';
      else { ok=true; if(d.already) msg='Ты уже в этом клане'; }
    }
  }catch(e){ msg='сеть недоступна'; }

  if(!ok){
    const chk=await sb.from('clan_members').select('clan_id').eq('player_key',meKey).limit(1);
    if(!chk.error&&chk.data&&chk.data.length){
      ok=true;
      msg=(chk.data[0].clan_id===clanId)?'Ты уже в этом клане':'Ты уже в другом клане';
    }
  }

  joining=false;

  if(!ok){
    if(btn){ btn.disabled=false; btn.textContent='Вступить'; }
    showToast(msg||'Не удалось вступить');
    return;
  }

  showToast(msg||'Ты в клане!');
  closeSearch();
  await loadAll();
}

async function leaveClan(){
  if(!myMember) return;
  const owner=isOwnerOfMyClan();
  const mem=myClan?membersOf(myClan.id):[];
  if(owner&&mem.length>1){ showToast('Сначала передай главу или выгони всех'); return; }
  if(!confirm('Покинуть клан?')) return;

  closeClanModal();
  await sb.from('clan_members').delete().eq('player_key',meKey);
  if(owner&&myClan) await sb.from('clans').delete().eq('id',myClan.id);
  descEditing=false;
  showToast('Ты покинул клан');
  await loadAll();
}

async function kickMember(key){
  if(!isOwnerOfMyClan()) return;
  if(!confirm('Выгнать участника?')) return;
  await sb.from('clan_members').delete().eq('player_key',key);
  showToast('Участник выгнан');
  await loadAll();
  if(!$('clanInfoModal').classList.contains('hidden')) renderClanModal();
}

async function createClan(){
  const name=$('inName').value.trim();
  const desc=$('inDesc').value.trim().slice(0,120);
  if(name.length<3){ showToast('Название минимум 3 символа'); return; }
  if(myMember){ showToast('Ты уже в клане'); return; }

  const r=await sb.from('clans').insert({
    name:name,tag:null,emblem:pickedEmblem,description:desc,owner_key:meKey
  }).select().single();

  if(r.error){ showToast('Не удалось создать клан'); return; }

  const mr=await sb.from('clan_members').insert({
    clan_id:r.data.id,player_key:meKey,name:meName,cups:meCups,role:'owner'
  });

  if(mr.error) showToast('Клан создан, но вступление не удалось');
  else showToast('Клан создан!');

  try{ await sb.rpc('ensure_clan_code',{p_clan:r.data.id}); }catch(e){}

  $('createModal').classList.add('hidden');
  $('inName').value=''; $('inDesc').value='';
  await loadAll();
}

function buildEmblems(){
  const row=$('emblemRow'); row.innerHTML='';
  for(let i=0;i<EMBLEMS.length;i++){
    const b=document.createElement('button');
    b.className='emblem-opt'+(EMBLEMS[i]===pickedEmblem?' on':'');
    b.textContent=EMBLEMS[i];
    (function(em){ b.onclick=function(){ pickedEmblem=em; buildEmblems(); }; })(EMBLEMS[i]);
    row.appendChild(b);
  }
}

$('bannerBtn').onclick=function(){
  if(myMember){ showToast('Ты уже в клане'); return; }
  pickedEmblem='🛡️'; buildEmblems(); $('createModal').classList.remove('hidden');
};
$('shareMeBtn').onclick=shareMe;
$('myTagBox').onclick=function(){ openProfile(meKey); };
$('ciClose').onclick=closeClanModal;
$('searchClose').onclick=closeSearch;
$('clanInfoModal').onclick=function(e){ if(e.target===$('clanInfoModal')) closeClanModal(); };
$('searchModal').onclick=function(e){ if(e.target===$('searchModal')) closeSearch(); };
$('createCancel').onclick=function(){ $('createModal').classList.add('hidden'); };
$('createOk').onclick=createClan;
$('addCancel').onclick=function(){ $('addModal').classList.add('hidden'); };
$('shareCancel').onclick=function(){ $('shareModal').classList.add('hidden'); };

$('searchInput').addEventListener('input',function(){
  searchQ=this.value;
  clearTimeout(window.__sqT);
  window.__sqT=setTimeout(applySearch,350);
});

const modalChips=$('searchModal').querySelectorAll('.chip');
for(let i=0;i<modalChips.length;i++){
  (function(c){
    c.onclick=function(){
      searchMode=c.getAttribute('data-mode');
      for(let k=0;k<modalChips.length;k++) modalChips[k].classList.toggle('on',modalChips[k]===c);
      applySearch();
    };
  })(modalChips[i]);
}

$('addSearch').onclick=async function(){
  if(!window.Friends){ showToast('friends.js не подключён'); return; }
  const nick=$('inNick').value.trim();
  if(nick.replace('#','').length<2){ showToast('Минимум 2 символа'); return; }

  const box=$('addResults');
  box.innerHTML='<div class="empty">Ищем…</div>';

  let list=[];
  try{
    const r=await sb.rpc('search_players',{p_q:nick,p_limit:15});
    if(!r.error) list=r.data||[];
  }catch(e){}

  if(!list.length){ box.innerHTML='<div class="empty">Никого не нашли</div>'; return; }

  let h='';
  for(let i=0;i<list.length;i++){
    const p=list[i];
    if(p.player_key===meKey) continue;
    h+='<div class="member"><div class="m-avatar">🎮</div><div class="m-info">';
    h+='<div class="m-name">'+esc(p.display_name||'Игрок')+tagPill(p.tag,'player',p.display_name)+'</div>';
    h+='<div class="m-role" style="color:#94a3b8">🏆 '+(p.cups||0)+'</div></div>';
    h+='<button class="mini add" data-pick="'+esc(p.player_key)+'" data-pickname="'+esc(p.display_name||'Игрок')+'">Добавить</button></div>';
  }
  box.innerHTML=h||'<div class="empty">Никого не нашли</div>';
  bindActions(box);

  const picks=box.querySelectorAll('[data-pick]');
  for(let i=0;i<picks.length;i++){
    (function(b){
      b.onclick=async function(){
        const ok=await Friends.add(b.getAttribute('data-pick'),b.getAttribute('data-pickname'));
        showToast(ok?'Добавлен в друзья':'Не удалось добавить');
        if(ok){ $('addModal').classList.add('hidden'); await loadFriends(); }
      };
    })(picks[i]);
  }
};

function watchChallenges(){
  if(!window.Friends) return;
  Friends.watch(function(c){
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';
    o.innerHTML='<div style="max-width:330px;width:100%;background:linear-gradient(145deg,#1e293b,#0f172a);border:2px solid #22c55e;border-radius:16px;padding:20px">'+
      '<div style="font-size:40px;margin-bottom:8px">⚔️</div>'+
      '<div id="cnm" style="font-size:15px;font-weight:900;margin-bottom:6px"></div>'+
      '<div style="font-size:12px;color:#94a3b8;margin-bottom:14px">Вызывает тебя на дружескую партию</div>'+
      '<div style="display:flex;gap:8px">'+
      '<button id="cNo" style="flex:1;padding:12px;border:0;border-radius:10px;background:linear-gradient(145deg,#ef4444,#991b1b);color:#fff;font-weight:900;font-size:13px">Отклонить</button>'+
      '<button id="cYes" style="flex:1;padding:12px;border:0;border-radius:10px;background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-weight:900;font-size:13px">Играть</button>'+
      '</div></div>';
    document.body.appendChild(o);
    o.querySelector('#cnm').textContent=c.from_name||'Игрок';

    let closed=false;
    const chk=setInterval(async function(){
      if(closed) return;
      const st=await Friends.status(c.id);
      if(!st||st.status!=='pending'){ closed=true; clearInterval(chk); o.remove(); }
    },3000);

    function close(){ closed=true; clearInterval(chk); o.remove(); }

    o.querySelector('#cNo').onclick=async function(){ close(); await Friends.answer(c.id,'declined'); };
    o.querySelector('#cYes').onclick=async function(){
      close();
      const r=await Friends.answer(c.id,'accepted');
      if(!r||!r.accepted) return;
      Friends.play(c.id,'guest',c.from_key,c.from_name,c.from_cups,c.arena);
    };
  });
}

function handleDeepLink(){
  const p=new URLSearchParams(location.search);
  const clan=p.get('clan');
  const player=p.get('player');
  if(!clan&&!player) return;

  const q=String(clan||player||'').replace(/^#/,'');

  setTab('clan');

  if(clan){ openSearch('clans',q); }
  else {
    openSearch('players',q);
    setTimeout(function(){ openProfile(q); },600);
  }

  history.replaceState(null,'',location.pathname);
}

buildEmblems();
boot();
setTimeout(watchChallenges,1500);

document.addEventListener('visibilitychange',function(){
  if(!document.hidden){ loadAll(); loadFriends(); }
});
