function pill(c,k,n){if(!c)return '';return '<span class="pill" data-tag="'+esc(c)+'" data-kind="'+esc(k||'player')+'" data-nm="'+esc(n||'')+'">#'+esc(c)+'</span>';}
function baseUrl(){return location.origin+location.pathname;}

function shareLink(url,ph){
  var t=encodeURIComponent(ph||''),u=encodeURIComponent(url||'');
  try{var w=window.Telegram&&window.Telegram.WebApp;
  if(w&&w.openTelegramLink){w.openTelegramLink('https://t.me/share/url?url='+u+'&text='+t);return;}}catch(e){}
  if(navigator.share){navigator.share({title:'Chess Royale',text:ph||'',url:url||''}).catch(function(){});return;}
  if(window.CopyShare&&window.CopyShare.shareLink){CopyShare.shareLink(url,ph);return;}
  window.open('https://t.me/share/url?url='+u+'&text='+t,'_blank');
}
function shareClan(name,code){
  if(!code){toast('У клана ещё нет тега');return;}
  shareLink(baseUrl()+'?clan='+encodeURIComponent(code),'Клан «'+name+'» набирает своих. Тег #'+code+' — вступай!');
}
function shareTag(el){
  var c=el.getAttribute('data-tag'),k=el.getAttribute('data-kind')||'player',n=el.getAttribute('data-nm')||'';
  if(!c)return;
  var u=baseUrl()+(k==='clan'?'?clan=':'?player=')+encodeURIComponent(c);
  shareLink(u,k==='clan'?('Клан «'+n+'» — тег #'+c+'. Вступай!'):('Мой тег в Chess Royale — #'+c+'. Добавляйся!'));
}
function openProfile(k){if(window.Profile&&k)Profile.open(k);}

function memOf(id){
  var o=[],s={};
  for(var i=0;i<MEMBERS.length;i++){var m=MEMBERS[i];
  if(m.clan_id!==id)continue;if(s[m.player_key])continue;s[m.player_key]=1;o.push(m);}
  o.sort(function(a,b){
    if(a.role==='owner'&&b.role!=='owner')return -1;
    if(b.role==='owner'&&a.role!=='owner')return 1;
    return (b.cups||0)-(a.cups||0);});
  return o;
}
function cupsOf(id){var m=memOf(id),s=0;for(var i=0;i<m.length;i++)s+=(m[i].cups||0);return s;}
function isOwner(){return !!(MYCLAN&&MYCLAN.owner_key===MEK);}
function findClan(id){for(var i=0;i<CLANS.length;i++){if(String(CLANS[i].id)===String(id))return CLANS[i];}return null;}

async function boot(){
  try{
    MEK=myKey();MEN=myName();
    MEC=parseInt(ls('cr_trophies')||'0',10)||0;
    $('cups').textContent=MEC;
    try{var r=await SB.rpc('arena_ensure_player',{p_key:MEK,p_name:MEN,p_seed:0});
      if(!r.error&&r.data){MEC=r.data.cups||0;if(r.data.display_name)MEN=r.data.display_name;}}catch(e){}
    $('cups').textContent=MEC;lss('cr_trophies',String(MEC));
    try{var t=await SB.rpc('ensure_player_tag',{p_key:MEK});
      if(!t.error&&t.data)lss('cr_tag',String(t.data));}catch(e){}
    await loadAll();
    try{await loadFriends();}catch(e){}
    await deepLink();
  }catch(e){showErr('Ошибка: '+(e&&e.message?e.message:'неизвестно'));}
}

async function loadAll(){
  showErr('');
  try{var m=await SB.from('clan_members').select('*');
    if(m.error){MEMBERS=[];showErr('Участники не загрузились: '+m.error.message);}
    else MEMBERS=m.data||[];}catch(e){MEMBERS=[];}
  try{var c=await SB.from('clans').select('*').order('created_at',{ascending:false});
    if(c.error){CLANS=[];showErr('Кланы не загрузились: '+c.error.message);}
    else CLANS=c.data||[];}catch(e){CLANS=[];}
  try{
    TAGS={};var k=[];
    for(var i=0;i<MEMBERS.length;i++){if(k.indexOf(MEMBERS[i].player_key)<0)k.push(MEMBERS[i].player_key);}
    if(k.length){var tr=await SB.from('arena_players').select('player_key,tag').in('player_key',k);
      if(!tr.error){for(var j=0;j<(tr.data||[]).length;j++){var p=tr.data[j];if(p.tag)TAGS[p.player_key]=p.tag;}}}
  }catch(e){}
  MYMEM=null;
  for(var n=0;n<MEMBERS.length;n++){if(MEMBERS[n].player_key===MEK){MYMEM=MEMBERS[n];break;}}
  MYCLAN=MYMEM?findClan(MYMEM.clan_id):null;
  LOADED=true;
  draw();
  if(!$('clanModal').classList.contains('hide')){
    if(PREV)drawPreview();else if(MYCLAN)drawMine();
  }
}

async function loadFriends(){
  if(!window.Friends){FRIENDS=[];return;}
  var l=await Friends.list(),keys=[],info={};
  for(var i=0;i<l.length;i++)keys.push(l[i].friend_key);
  if(keys.length){var r=await SB.from('arena_players').select('player_key,display_name,cups,tag').in('player_key',keys);
    if(!r.error){for(var j=0;j<(r.data||[]).length;j++){var p=r.data[j];info[p.player_key]=p;}}}
  FRIENDS=[];
  for(var n=0;n<l.length;n++){var f=l[n],q=info[f.friend_key];
    FRIENDS.push({key:f.friend_key,name:(q&&q.display_name)||f.friend_name||'Игрок',cups:(q&&q.cups)||0,tag:(q&&q.tag)||''});}
  draw();
}

async function loadChat(){
  if(!MYCLAN)return;
  var r=await SB.from('clan_messages').select('*').eq('clan_id',MYCLAN.id).order('id',{ascending:false}).limit(60);
  if(r.error)return;
  MSGS=(r.data||[]).slice().reverse();
  var b=$('chatBox');if(!b)return;
  if(!MSGS.length){b.innerHTML='<div class="emp">Сообщений пока нет.<br>Напиши первым.</div>';return;}
  var h='';
  for(var i=0;i<MSGS.length;i++){
    var m=MSGS[i],mine=(m.player_key===MEK);
    if(m.kind==='system'){h+='<div style="align-self:center;background:linear-gradient(135deg,#22c55e,#15803d);font-size:11.5px;font-weight:800;padding:7px 14px;border-radius:10px;text-align:center">'+esc(m.text||'')+'</div>';continue;}
    h+='<div class="msg'+(mine?' mine':'')+'"><div class="mh">'+esc(m.name||'Игрок')+'</div>';
    h+='<div class="mt">'+esc(m.text||'')+'</div></div>';
  }
  b.innerHTML=h;b.scrollTop=b.scrollHeight;
}

async function sendChat(){
  var ip=$('chatIn');if(!ip||!MYCLAN)return;
  var t=ip.value.trim();if(!t)return;
  if(badw(t)){ip.value='';toast('Ненормативная лексика — не отправлено');return;}
  ip.value='';
  var r=await SB.rpc('clan_post',{p_clan:MYCLAN.id,p_key:MEK,p_name:MEN,p_kind:'text',p_text:t,p_match:null});
  if(r.error){toast('Не отправлено');ip.value=t;return;}
  if(r.data&&r.data.bad){toast('Ненормативная лексика');ip.value=t;return;}
  await loadChat();
}

function bind(s){
  if(!s)return;
  var pv=s.querySelectorAll('[data-prev]');
  for(var i=0;i<pv.length;i++){(function(el){el.onclick=function(e){
    if(e.target.closest&&(e.target.closest('[data-join]')||e.target.closest('[data-share]')))return;
    openPreview(el.getAttribute('data-prev'));};})(pv[i]);}
  var pb=s.querySelectorAll('[data-pbtn]');
  for(var p=0;p<pb.length;p++){(function(el){el.onclick=function(e){e.stopPropagation();openPreview(el.getAttribute('data-pbtn'));};})(pb[p]);}
  var inv=s.querySelectorAll('[data-inv]');
  for(var a=0;a<inv.length;a++){(function(b){b.onclick=function(e){e.stopPropagation();
    invite(b.getAttribute('data-inv'),b.getAttribute('data-iname'),parseInt(b.getAttribute('data-icups')||'0',10)||0);};})(inv[a]);}
  var ad=s.querySelectorAll('[data-add]');
  for(var c=0;c<ad.length;c++){(function(b){b.onclick=async function(e){e.stopPropagation();
    if(!window.Friends)return;
    var ok=await Friends.add(b.getAttribute('data-add'),b.getAttribute('data-aname'));
    toast(ok?'Добавлен в друзья':'Не удалось');if(ok)await loadFriends();};})(ad[c]);}
  var kk=s.querySelectorAll('[data-kick]');
  for(var k=0;k<kk.length;k++){(function(b){b.onclick=function(e){e.stopPropagation();kick(b.getAttribute('data-kick'));};})(kk[k]);}
  var jn=s.querySelectorAll('[data-join]');
  for(var j=0;j<jn.length;j++){(function(b){b.onclick=function(e){e.stopPropagation();joinClan(b.getAttribute('data-join'),b);};})(jn[j]);}
  var sc=s.querySelectorAll('[data-share]');
  for(var x=0;x<sc.length;x++){(function(b){b.onclick=function(e){e.stopPropagation();
    shareClan(b.getAttribute('data-sname')||'Клан',b.getAttribute('data-share')||'');};})(sc[x]);}
  var pf=s.querySelectorAll('[data-prof]');
  for(var f=0;f<pf.length;f++){(function(el){el.onclick=function(e){e.stopPropagation();openProfile(el.getAttribute('data-prof'));};})(pf[f]);}
  var tg=s.querySelectorAll('[data-tag]');
  for(var t=0;t<tg.length;t++){(function(el){el.onclick=function(e){e.stopPropagation();shareTag(el);};})(tg[t]);}
}

async function invite(key,name,cups){
  if(!window.Friends){toast('friends.js не подключён');return;}
  if(!key)return;
  var r=await Friends.invite(key,name,cups);
  if(!r){toast('Не удалось отправить вызов');return;}
  toast('Вызов отправлен: '+name);
  setTimeout(function(){Friends.play(r.id,'host',key,name,cups,r.arena);},400);
}

async function joinClan(id,btn){
  if(!id||JOINING)return;
  if(MYMEM){
    if(MYMEM.clan_id===id){toast('Ты уже в этом клане');openMine();}
    else{toast('Ты уже в другом клане — сначала выйди');closeSearch();}
    return;
  }
  JOINING=true;
  if(btn){btn.disabled=true;btn.textContent='…';}
  var ok=false,msg='';
  try{var r=await SB.rpc('clan_join',{p_clan:id,p_key:MEK,p_name:MEN,p_cups:MEC});
    if(r.error)msg=r.error.message||'';
    else{var d=r.data||{};
      if(d.ok===false)msg=d.error||'не удалось';
      else{ok=true;if(d.already)msg='Ты уже в этом клане';}}}catch(e){msg='сеть';}
  if(!ok){
    var ch=await SB.from('clan_members').select('clan_id').eq('player_key',MEK).limit(1);
    if(!ch.error&&ch.data&&ch.data.length){ok=true;msg=(ch.data[0].clan_id===id)?'Ты уже в этом клане':'Ты уже в другом клане';}
  }
  JOINING=false;
  if(!ok){if(btn){btn.disabled=false;btn.textContent='Вступить';}toast(msg||'Не удалось вступить');return;}
  toast(msg||'Ты в клане!');
  closeSearch();closeClan();
  await loadAll();
}

async function leaveClan(){
  if(!MYMEM)return;
  var owner=isOwner(),m=MYCLAN?memOf(MYCLAN.id):[];
  if(owner&&m.length>1){toast('Сначала передай главу или выгони всех');return;}
  if(!confirm('Покинуть клан?'))return;
  closeClan();
  await SB.from('clan_members').delete().eq('player_key',MEK);
  if(owner&&MYCLAN)await SB.from('clans').delete().eq('id',MYCLAN.id);
  DESCED=false;toast('Ты покинул клан');await loadAll();
}

async function kick(key){
  if(!isOwner())return;
  if(!confirm('Выгнать участника?'))return;
  await SB.from('clan_members').delete().eq('player_key',key);
  toast('Участник выгнан');await loadAll();
  if(!$('clanModal').classList.contains('hide'))drawMine();
}

async function createClan(){
  var n=$('cName').value.trim(),d=$('cDesc').value.trim().slice(0,120);
  if(n.length<3){toast('Название минимум 3 символа');return;}
  if(MYMEM){toast('Ты уже в клане');return;}
  var r=await SB.from('clans').insert({name:n,tag:null,emblem:PICKEM,description:d,owner_key:MEK}).select().single();
  if(r.error){toast('Не удалось создать клан');return;}
  var m=await SB.from('clan_members').insert({clan_id:r.data.id,player_key:MEK,name:MEN,cups:MEC,role:'owner'});
  toast(m.error?'Клан создан, но вступление не удалось':'Клан создан!');
  try{await SB.rpc('ensure_clan_code',{p_clan:r.data.id});}catch(e){}
  $('createModal').classList.add('hide');$('cName').value='';$('cDesc').value='';
  await loadAll();
}

function buildEmb(){
  var r=$('emrow');r.innerHTML='';
  for(var i=0;i<EMB.length;i++){
    var b=document.createElement('button');
    b.className='emopt'+(EMB[i]===PICKEM?' on':'');
    b.textContent=EMB[i];
    (function(em){b.onclick=function(){PICKEM=em;buildEmb();};})(EMB[i]);
    r.appendChild(b);
  }
}

async function deepLink(){
  var p=new URLSearchParams(location.search);
  var clan=p.get('clan'),player=p.get('player');
  if(!clan&&!player)return;
  var q=String(clan||player||'').replace(/^#/,'');
  history.replaceState(null,'',location.pathname);
  if(clan){
    TAB='clan';
    document.querySelectorAll('.tab')[0].classList.add('on');
    document.querySelectorAll('.tab')[1].classList.remove('on');
    if(MYMEM&&MYCLAN&&(String(MYCLAN.tag||'').toUpperCase()===q.toUpperCase()||String(MYCLAN.id)===q)){
      PREV=null;$('cTitle').textContent='Клан';drawMine();
      $('clanModal').classList.remove('hide');
      toast('Ты уже в этом клане');return;
    }
    var f=null;
    for(var i=0;i<CLANS.length;i++){
      if(String(CLANS[i].tag||'').toUpperCase()===q.toUpperCase()||String(CLANS[i].id)===q){f=CLANS[i];break;}
    }
    if(f){openPreview(f.id);toast('Ты пока не в этом клане');return;}
    try{
      var r=await SB.rpc('search_clans',{p_q:q,p_limit:25});
      if(!r.error&&r.data&&r.data.length){
        var c=r.data[0];
        var exists=false;
        for(var j=0;j<CLANS.length;j++){if(String(CLANS[j].id)===String(c.id))exists=true;}
        if(!exists)CLANS.push({id:c.id,name:c.name,tag:c.code,emblem:c.emblem,description:c.description,owner_key:c.owner_key});
        openPreview(c.id);toast('Ты пока не в этом клане');return;
      }
    }catch(e){}
    toast('Клан не найден');
  } else {
    TAB='clan';draw();
    openSearch('players',q);
    setTimeout(function(){openProfile(q);},600);
  }
}

document.querySelectorAll('.tab').forEach(function(el){
  el.onclick=function(){
    TAB=el.getAttribute('data-t');
    DESCED=false;PREV=null;
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    el.classList.add('on');
    draw();
  };
});

$('bnBtn').onclick=function(){
  if(MYMEM){toast('Ты уже в клане');return;}
  PICKEM='🛡️';buildEmb();$('createModal').classList.remove('hide');
};
$('cClose').onclick=closeClan;
$('sClose').onclick=closeSearch;
$('clanModal').onclick=function(e){if(e.target===$('clanModal'))closeClan();};
$('searchModal').onclick=function(e){if(e.target===$('searchModal'))closeSearch();};
$('cCancel').onclick=function(){$('createModal').classList.add('hide');};
$('cOk').onclick=createClan;
$('aCancel').onclick=function(){$('addModal').classList.add('hide');};
$('mC').onclick=function(){SEARCHM='clans';openSearch('clans',SEARCHQ);};
$('mP').onclick=function(){SEARCHM='players';openSearch('players',SEARCHQ);};

$('sInput').addEventListener('input',function(){
  SEARCHQ=this.value;
  clearTimeout(window.__sq);
  window.__sq=setTimeout(doSearch,350);
});

$('aFind').onclick=async function(){
  if(!window.Friends){toast('friends.js не подключён');return;}
  var nk=$('aNick').value.trim();
  if(nk.replace('#','').length<2){toast('Минимум 2 символа');return;}
  var box=$('aOut');box.innerHTML='<div class="emp">Ищем…</div>';
  var l=[];
  try{var r=await SB.rpc('search_players',{p_q:nk,p_limit:15});
    if(!r.error)l=r.data||[];}catch(e){}
  if(!l.length){box.innerHTML='<div class="emp">Никого не нашли</div>';return;}
  var h='';
  for(var i=0;i<l.length;i++){
    var p=l[i];if(p.player_key===MEK)continue;
    h+='<div class="mb"><div class="av">🎮</div><div class="mn"><div class="mname">'+esc(p.display_name||'Игрок')+pill(p.tag,'player',p.display_name)+'</div>';
    h+='<div class="mrole" style="color:#94a3b8">🏆 '+(p.cups||0)+'</div></div>';
    h+='<button class="mi ad" data-pick="'+esc(p.player_key)+'" data-pn="'+esc(p.display_name||'Игрок')+'">Добавить</button></div>';
  }
  box.innerHTML=h||'<div class="emp">Никого не нашли</div>';
  var pk=box.querySelectorAll('[data-pick]');
  for(var k=0;k<pk.length;k++){(function(b){b.onclick=async function(){
    var ok=await Friends.add(b.getAttribute('data-pick'),b.getAttribute('data-pn'));
    toast(ok?'Добавлен':'Не удалось');
    if(ok){$('addModal').classList.add('hide');await loadFriends();}};})(pk[k]);}
};

buildEmb();
boot();
</script>
