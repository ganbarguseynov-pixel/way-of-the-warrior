<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Анализ Еды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --hint-color: #8e8e93;
            --secondary-bg: rgba(30, 30, 30, 0.6);
            --accent-color: #ffcc00;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; color: var(--text-color);
            margin: 0; padding: 0; display: flex; flex-direction: column;
            height: 100vh; width: 100vw; box-sizing: border-box; overflow: hidden;
        }
        
        .inner-screen { padding: 20px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; overflow-y: auto; width: 100%; background-color: #0d0d0d; }
        
        .back-btn { background: none; border: none; color: var(--accent-color); font-size: 16px; padding: 0; margin-bottom: 20px; cursor: pointer; display: flex; align-items: center; font-weight: bold; }
        
        .btn { background-color: var(--accent-color); color: #000; border: none; padding: 16px; border-radius: 16px; font-size: 18px; font-weight: bold; width: 100%; margin-top: 15px; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.8; }
        
        #food-result { text-align: center; width: 100%; box-sizing: border-box; }
        #food-result h2 { text-align: center !important; width: 100%; word-break: break-word; margin-bottom: 20px; }
        .nutrition-row { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px; padding: 0 10px; box-sizing: border-box; }
        
        #camera-container { position: relative; width: 100%; height: 60vh; border-radius: 16px; overflow: hidden; margin-bottom: 20px; background: #000; display: flex; flex-direction: column; justify-content: space-between; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; display: block; background-color: #000; }
        #camera-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; z-index: 5; }
        #capture-btn { width: 75px; height: 75px; border-radius: 50%; background: white; border: 5px solid rgba(0,0,0,0.2); cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #capture-btn:active { transform: scale(0.95); background: #ddd; }
        #close-camera-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }
        #switch-camera-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: white; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 20px; cursor: pointer; z-index: 5; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="inner-screen">
        <button class="back-btn" onclick="goBack()">← Назад</button>
        <h1 style="text-align: center; margin-top: 0;">Анализ еды</h1>
        
        <div id="photo-buttons">
            <button class="btn" onclick="startCamera()">📷 Сделать фото</button>
            <button class="btn" style="background-color: #2c2c2e; color: white;" onclick="document.getElementById('gallery-input').click()">🖼️ Выбрать из галереи</button>
        </div>

        <input type="file" id="gallery-input" accept="image/*" style="display: none;" onchange="handleImage(event)">

        <div id="camera-container" style="display: none;">
            <button id="switch-camera-btn" onclick="switchCamera()">🔄</button>
            <button id="close-camera-btn" onclick="resetCameraScreen()">✖</button>
            <video id="camera-video" autoplay playsinline></video>
            <div id="camera-controls">
                <button id="capture-btn" onclick="takePhoto()"></button>
            </div>
        </div>

        <img id="photo-preview" style="width: 100%; border-radius: 16px; margin-bottom: 20px; display: none;">
        
        <button class="btn" id="remove-photo-btn" style="display: none; background-color: #ff3b30; color: white; margin-bottom: 10px;" onclick="resetCameraScreen()">❌ Удалить фото</button>
        
        <div id="loading-spinner" style="display: none; text-align: center; margin-top: 20px; font-size: 18px; color: var(--accent-color);">🤖 ИИ анализирует фото (сервер может просыпаться до 50 секунд)...</div>
        
        <div id="food-result" style="display: none; background: #1c1c1e; padding: 20px; border-radius: 16px; margin-top: 20px;">
            <h2 id="food-name" style="margin-top: 0; color: var(--accent-color);">Название</h2>
            <div class="nutrition-row"><span>Калории:</span> <b id="food-calories">0 ккал</b></div>
            <div class="nutrition-row"><span>Белки:</span> <b id="food-protein">0 г</b></div>
            <div class="nutrition-row"><span>Жиры:</span> <b id="food-fat">0 г</b></div>
            <div class="nutrition-row"><span>Углеводы:</span> <b id="food-carbs">0 г</b></div>
            
            <!-- Кнопка добавления с передачей XP через localStorage -->
            <button class="btn" style="background-color: #34c759; color: white; margin-top: 15px;" onclick="saveXPAndGoBack()">Добавить в дневник (+20 XP)</button>
            <button class="btn" style="background-color: transparent; color: #ff3b30; margin-top: 10px;" onclick="resetCameraScreen()">Отмена / Переснять</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const AI_SERVER_URL = 'https://sport-app-bqlu.onrender.com';

        // --- КАМЕРА ---
        let videoStream = null;
        let currentFacingMode = "environment"; 

        async function startCamera() {
            try {
                document.getElementById('photo-buttons').style.display = 'none';
                const container = document.getElementById('camera-container');
                container.style.display = 'flex'; 

                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode } 
                });
                
                const videoElement = document.getElementById('camera-video');
                videoElement.srcObject = videoStream;
                videoElement.onloadedmetadata = () => { videoElement.play(); };
                
            } catch (err) {
                tg.showAlert("Не удалось получить доступ к камере. Разрешите доступ в настройках Telegram.");
                resetCameraScreen();
            }
        }

        async function switchCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            stopCamera();
            await startCamera();
        }

        function takePhoto() {
            if (!videoStream) return;
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            stopCamera();
            
            canvas.toBlob(async function(blob) {
                const file = new File([blob], "camera-photo.jpg", { type: "image/jpeg" });
                const preview = document.getElementById('photo-preview');
                preview.src = URL.createObjectURL(blob);
                preview.style.display = 'block';
                document.getElementById('remove-photo-btn').style.display = 'block';
                await sendPhotoToServer(file);
            }, 'image/jpeg', 0.8);
        }

        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('camera-container').style.display = 'none';
        }

        function resetCameraScreen() {
            stopCamera();
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('photo-preview').src = "";
            document.getElementById('food-result').style.display = 'none';
            document.getElementById('photo-buttons').style.display = 'block';
            document.getElementById('remove-photo-btn').style.display = 'none';
            document.getElementById('gallery-input').value = "";
            document.getElementById('loading-spinner').style.display = 'none';
        }

        // --- ГАЛЕРЕЯ ---
        async function handleImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('photo-buttons').style.display = 'none';
            const preview = document.getElementById('photo-preview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
            document.getElementById('remove-photo-btn').style.display = 'block';
            document.getElementById('food-result').style.display = 'none';
            await sendPhotoToServer(file);
        }

        // --- ОТПРАВКА НА СЕРВЕР ---
        async function sendPhotoToServer(file) {
            document.getElementById('loading-spinner').style.display = 'block';
            document.getElementById('food-result').style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`${AI_SERVER_URL}/analyze`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Сервер вернул ошибку");

                const data = await response.json();
                document.getElementById('loading-spinner').style.display = 'none';
                
                if (data.food !== "Не удалось распознать") {
                    document.getElementById('food-result').style.display = 'block';
                    document.getElementById('food-name').innerText = data.food;
                    document.getElementById('food-calories').innerText = data.calories + " ккал";
                    document.getElementById('food-protein').innerText = data.protein + " г";
                    document.getElementById('food-fat').innerText = data.fat + " г";
                    document.getElementById('food-carbs').innerText = data.carbs + " г";
                } else {
                    tg.showAlert("ИИ не смог распознать еду. Попробуйте другое фото.");
                    resetCameraScreen();
                }

            } catch (error) {
                document.getElementById('loading-spinner').style.display = 'none';
                tg.showAlert("Ошибка связи. Сервер 'просыпается'. Подождите 50 секунд и нажмите 'Отмена/Переснять', затем попробуйте снова.");
            }
        }

        // --- ВОЗВРАТ В ОСНОВНОЕ ПРИЛОЖЕНИЕ ---
        function saveXPAndGoBack() {
            // Передаем 20 XP в основное приложение через localStorage
            localStorage.setItem('pendingXP', '20');
            window.location.href = 'index.html';
        }

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
