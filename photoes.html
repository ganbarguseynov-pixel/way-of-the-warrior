<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Анализ Еды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; padding: 15px; margin: 0; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: #333; color: #ffcc00; border: none; padding: 10px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn { background: #ffcc00; color: #000; padding: 15px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; width: 100%; margin-bottom: 10px; cursor: pointer; }
        .btn-dark { background: #2c2c2e; color: #fff; }
        .btn:active { opacity: 0.8; }
        
        #camera-container { display: none; position: relative; width: 100%; height: 55vh; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 15px; }
        #camera-video { width: 100%; height: 100%; object-fit: cover; }
        #capture-btn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 70px; height: 70px; border-radius: 50%; background: #fff; border: 5px solid rgba(255,255,255,0.3); cursor: pointer; }
        #close-camera-btn { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 10px 15px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 5; }
        #switch-camera-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); color: #fff; border: none; padding: 10px 15px; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 5; }
        
        #preview { width: 100%; border-radius: 16px; display: none; margin-bottom: 15px; }
        
        #loading { display: none; text-align: center; font-size: 18px; color: #ffcc00; margin-top: 20px; }
        
        #result-box { display: none; background: #1c1c1e; padding: 20px; border-radius: 16px; margin-top: 20px; }
        #result-box h2 { color: #ffcc00; margin-top: 0; text-align: center; }
        .macro-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 16px; border-bottom: 1px solid #333; padding-bottom: 5px; }
    </style>
</head>
<body>
    <div class="header">
        <button class="back-btn" onclick="window.location.href='index.html'">← Назад</button>
        <h2 style="margin: 0;">Анализ еды</h2>
        <div style="width: 70px;"></div>
    </div>

    <div id="main-buttons">
        <button class="btn" onclick="startCamera()">📷 Включить камеру</button>
        <button class="btn btn-dark" onclick="document.getElementById('gallery-input').click()">🖼️ Выбрать из галереи</button>
    </div>

    <input type="file" id="gallery-input" accept="image/*" style="display: none;" onchange="handleGallery(event)">

    <div id="camera-container">
        <button id="switch-camera-btn" onclick="switchCamera()">🔄</button>
        <button id="close-camera-btn" onclick="closeCamera()">✖</button>
        <video id="camera-video" autoplay playsinline muted></video>
        <button id="capture-btn" onclick="takePhoto()"></button>
    </div>

    <img id="preview">

    <div id="loading">🤖 ИИ анализирует фото (до 30 секунд)...</div>

    <div id="result-box">
        <h2 id="food-name">Название</h2>
        <div class="macro-row"><span>Калории:</span> <b id="food-calories">0 ккал</b></div>
        <div class="macro-row"><span>Белки:</span> <b id="food-protein">0 г</b></div>
        <div class="macro-row"><span>Жиры:</span> <b id="food-fat">0 г</b></div>
        <div class="macro-row"><span>Углеводы:</span> <b id="food-carbs">0 г</b></div>
        
        <button class="btn" style="background-color: #34c759; color: white; margin-top: 15px;" onclick="saveAndGoBack()">Добавить (+20 XP) и вернуться</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const AI_SERVER_URL = 'https://sport-app-bqlu.onrender.com';
        let stream = null;
        let currentFacingMode = "environment";
        let lastPhotoFile = null;

        async function startCamera() {
            try {
                document.getElementById('main-buttons').style.display = 'none';
                document.getElementById('camera-container').style.display = 'block';
                document.getElementById('result-box').style.display = 'none';
                document.getElementById('preview').style.display = 'none';

                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode } });
                const video = document.getElementById('camera-video');
                video.srcObject = stream;
                video.onloadedmetadata = () => { video.play(); };
            } catch (err) {
                tg.showAlert("Ошибка камеры: " + err.message);
                closeCamera();
            }
        }

        async function switchCamera() {
            currentFacingMode = currentFacingMode === "environment" ? "user" : "environment";
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            await startCamera();
        }

        function takePhoto() {
            if (!stream) return;
            const video = document.getElementById('camera-video');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            closeCamera();
            
            canvas.toBlob(async function(blob) {
                const file = new File([blob], "camera-photo.jpg", { type: "image/jpeg" });
                lastPhotoFile = file;
                
                document.getElementById('preview').src = URL.createObjectURL(blob);
                document.getElementById('preview').style.display = 'block';
                
                await sendToServer(file);
            }, 'image/jpeg', 0.8);
        }

        function closeCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            document.getElementById('camera-container').style.display = 'none';
            // Если фото не сделано, показываем кнопки снова
            if (!lastPhotoFile) {
                document.getElementById('main-buttons').style.display = 'block';
            }
        }

        function handleGallery(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            lastPhotoFile = file;
            document.getElementById('main-buttons').style.display = 'none';
            document.getElementById('preview').src = URL.createObjectURL(file);
            document.getElementById('preview').style.display = 'block';
            
            sendToServer(file);
        }

        async function sendToServer(file) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result-box').style.display = 'none';

            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(`${AI_SERVER_URL}/analyze`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Сервер ответил ошибкой");

                const data = await response.json();
                document.getElementById('loading').style.display = 'none';

                if (data.food !== "Не удалось распознать") {
                    document.getElementById('food-name').innerText = data.food;
                    document.getElementById('food-calories').innerText = data.calories + " ккал";
                    document.getElementById('food-protein').innerText = data.protein + " г";
                    document.getElementById('food-fat').innerText = data.fat + " г";
                    document.getElementById('food-carbs').innerText = data.carbs + " г";
                    document.getElementById('result-box').style.display = 'block';
                } else {
                    tg.showAlert("ИИ не смог распознать еду. Попробуйте другое фото.");
                    resetScreen();
                }

            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                tg.showAlert("Ошибка связи с сервером. Возможно, он 'просыпается'. Подождите 50 секунд и попробуйте снова.");
                resetScreen();
            }
        }

        function resetScreen() {
            lastPhotoFile = null;
            document.getElementById('main-buttons').style.display = 'block';
            document.getElementById('preview').style.display = 'none';
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('gallery-input').value = "";
        }

        function saveAndGoBack() {
            // Возвращаемся в основное приложение
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
