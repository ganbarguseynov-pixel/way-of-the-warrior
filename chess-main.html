  { icon:'♟️',  grad:'linear-gradient(135deg,#ded4c2,#9a8a70)', glow:'#c9a227' }
];

let myArena     = 1;
let viewArena   = 1;
let slidesBuilt = false;
let nickMode    = 'create';
let lastCups    = 0;

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function playerName(){
  const n = localStorage.getItem(NICK_KEY);
  return (n && n.trim()) ? n.trim() : 'Игрок';
}

function hasOwnNick(){
  const n = localStorage.getItem(NICK_KEY);
  return !!(n && n.trim().length >= 2);
}

function getGems(){
  const v = parseInt(localStorage.getItem(GEMS_KEY) || '', 10);
  return isFinite(v) ? v : 50;
}

function setGems(v){
  const n = Math.max(0, Math.floor(v));
  try { localStorage.setItem(GEMS_KEY, String(n)); } catch (e){}
  $('gems-count').textContent = n;
}

/* ---------------- КЭШ ПЕРВЫХ КАДРОВ ---------------- */

const POSTER_KEY = 'cr_arena_poster_';

function getPoster(n){
  try { return localStorage.getItem(POSTER_KEY + n) || ''; } catch (e){ return ''; }
}

function setPoster(n, url){
  try { localStorage.setItem(POSTER_KEY + n, url); } catch (e){}
}

function grabPoster(v, n){
  if (getPoster(n)) return;
  if (!v.videoWidth || !v.videoHeight) return;

  try {
    const w = 360;
    const h = Math.round(w * (v.videoHeight / v.videoWidth));
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    c.getContext('2d').drawImage(v, 0, 0, w, h);
    const url = c.toDataURL('image/jpeg', 0.62);
    setPoster(n, url);
    v.poster = url;
  } catch (e){}
}

/* ---------------- видео арены ---------------- */

function videoPath(n){
  const name = ARENA_VIDEO[n - 1];
  if (!name) return '';
  return encodeURI(name);
}

function showIconOnly(){
  const v = $('arenaVideo');
  if (v) v.style.display = 'none';
  const ic = $('arena-icon');
  if (ic) ic.style.display = '';
}

function playArenaVideo(n){
  const v = $('arenaVideo');
  if (!v) return;

  const src = videoPath(n);
  if (!src){ showIconOnly(); return; }

  if (v.dataset.arena === String(n)){
    try { v.play().catch(function(){}); } catch (e){}
    return;
  }

  const cached = getPoster(n);
  if (cached) v.poster = cached;

  v.dataset.arena = String(n);
  if (!cached) showIconOnly();

  v.src = src;
  try { v.load(); } catch (e){}
  try { v.play().catch(function(){}); } catch (e){}
}

(function initVideo(){
  const v = $('arenaVideo');
  if (!v) return;

  v.addEventListener('playing', function (){
    v.style.display = 'block';
    const ic = $('arena-icon');
    if (ic) ic.style.display = 'none';
    grabPoster(v, myArena);
  });

  v.addEventListener('loadeddata', function (){
    grabPoster(v, myArena);
  });

  v.addEventListener('error', function (){
    if (!getPoster(myArena)) showIconOnly();
  });
})();

/* ---------------- отрисовка ---------------- */

function render(cups){
  lastCups = cups;

  const arena = Math.min(MAX_ARENA, Math.floor(Math.max(0, cups) / STEP) + 1);
  const floor = (arena - 1) * STEP;
  const look  = LOOK[arena - 1] || LOOK[0];

  $('player-name').innerHTML =
    playerName().replace(/</g, '&lt;') + '<span class="pen">✏️</span>';

  $('player-arena-label').textContent = 'Арена ' + arena;

  $('trophies-count').textContent = cups;
  $('current-trophies').textContent = cups;
  setGems(getGems());

  $('arena-title').textContent = 'Арена ' + arena + ': ' + NAMES[arena - 1];
  $('arena-subtitle').textContent = RULES[arena - 1] || '';

  $('arena-icon').textContent = look.icon;
  $('arena-image').style.background = look.grad;
  $('arena-glow').style.background =
    'radial-gradient(circle at top,' + look.glow + ' 0%,transparent 70%)';
  $('arena-progress').style.background =
    'linear-gradient(90deg,' + look.glow + ',#ffcc00)';

  playArenaVideo(arena);

  let pct, label;
  if (arena >= MAX_ARENA){
    pct = 100;
    label = 'Высшая арена';
  } else {
    pct = ((cups - floor) / STEP) * 100;
    label = 'До арены ' + (arena + 1) + ': ' + ((arena * STEP) - cups) + ' 🏆';
  }
  $('arena-progress').style.width = Math.max(0, Math.min(100, pct)) + '%';
  $('next-label').textContent = label;

  $('arena-floor').textContent =
    'Пол арены: ' + floor + ' 🏆 — ниже не упадёшь';

  document.title = 'Арена ' + arena + ' — Chess Royale';

  markMine(arena);
}

/* ---------------- ник ---------------- */

function openNick(mode){
  nickMode = mode;

  const cur = localStorage.getItem(NICK_KEY) || '';

  $('nickTitle').textContent = (mode === 'create') ? 'Придумай себе ник' : 'Сменить ник';
  $('nickSub').textContent   = (mode === 'create')
    ? 'Ник может повторяться у разных игроков'
    : 'Смена ника стоит ' + NICK_PRICE + ' 💎 · у тебя ' + getGems() + ' 💎';

  $('nickInput').value = cur;
  $('nickErr').textContent = '';
  $('nickOk').disabled = false;
  $('nickOk').textContent = (mode === 'create')
    ? 'Сохранить'
    : 'Сменить за ' + NICK_PRICE + ' 💎';

  $('nickPanel').style.display = 'flex';

  setTimeout(function (){
    try { $('nickInput').focus(); } catch (e){}
  }, 60);
}

function closeNick(){
  $('nickPanel').style.display = 'none';
}

/* бейдж с ником открывает профиль, смена ника — из профиля */
$('profileBadge').onclick = function (){
  if (window.Profile) Profile.open(Profile.self());
};

if (window.Profile){
  Profile.onEditNick = function (){
    openNick(hasOwnNick() ? 'change' : 'create');
  };
}

$('nickLater').onclick = closeNick;

$('nickPanel').onclick = function (e){
  if (e.target === $('nickPanel')) closeNick();
};

document.addEventListener('keydown', function (e){
  if (e.key === 'Escape' && $('nickPanel').style.display === 'flex') closeNick();
});

$('nickOk').onclick = async function (){
  const v = $('nickInput').value.trim();

  if (v.length < 2){
    $('nickErr').textContent = 'Минимум 2 символа';
    return;
  }
  if (v.length > 16){
    $('nickErr').textContent = 'Максимум 16 символов';
    return;
  }

  const isChange = (nickMode === 'change');
  const gems = getGems();

  if (isChange && v === playerName()){
    $('nickErr').textContent = 'Это твой текущий ник';
    return;
  }

  if (isChange && gems < NICK_PRICE){
    $('nickErr').textContent = 'Не хватает ' + (NICK_PRICE - gems) + ' 💎';
    return;
  }

  $('nickOk').disabled = true;
  $('nickErr').textContent = '';

  try { localStorage.setItem(NICK_KEY, v); } catch (e){}

  if (isChange) setGems(gems - NICK_PRICE);

  closeNick();
  render(lastCups);

  let dbOk  = true;
  let dbMsg = '';

  try {
    const res = await sb.rpc('arena_set_name', {
      p_key:  playerKey(),
      p_name: v
    });

    if (res.error){
      dbOk  = false;
      dbMsg = res.error.message || '';
    }
  } catch (e){
    dbOk  = false;
    dbMsg = 'сеть недоступна';
  }

  $('nickOk').disabled = false;

  if (dbOk){
    $('dbWarn').textContent = '';
  } else {
    $('dbWarn').textContent =
      'Ник сохранён на устройстве, но в базу не записан: ' + dbMsg;
  }
};

/* ---------------- список арен ---------------- */

function buildArenaBrowser(){
  if (slidesBuilt) return;

  const track = $('arenaScroll');
  const dots  = $('arenaDots');
  track.innerHTML = '';
  dots.innerHTML  = '';

  for (let n = MAX_ARENA; n >= 1; n--){
    const look = LOOK[n - 1];
    const from = (n - 1) * STEP;

    const range = (n === MAX_ARENA)
      ? from + ' 🏆 и выше'
      : from + ' – ' + (n * STEP) + ' 🏆';

    const cached = getPoster(n);

    const imgStyle = cached
      ? look.grad + ';background-image:url(' + cached + ')'
      : look.grad;

    const slide = document.createElement('div');
    slide.className = 'arena-slide';
    slide.dataset.n = n;
    slide.innerHTML =
      '<div class="arena-slide-badge">ТЫ ЗДЕСЬ</div>' +
      '<div class="arena-slide-img" style="background:' + imgStyle + '">' +
        '<video muted loop playsinline webkit-playsinline preload="auto"></video>' +
        '<span style="' + (cached ? 'display:none' : '') + '">' + look.icon + '</span>' +
      '</div>' +
      '<div class="arena-slide-title">Арена ' + n + ': ' + NAMES[n - 1] + '</div>' +
      '<div class="arena-slide-range">' + range + '</div>' +
      '<div class="arena-slide-rule">' + RULES[n - 1] + '</div>';

    (function (num){
      slide.onclick = function (){ scrollToArena(num, true); };
    })(n);

    track.appendChild(slide);
  }

  for (let n = MAX_ARENA; n >= 1; n--){
    const dot = document.createElement('button');
    dot.className = 'arena-dot';
    dot.dataset.n = n;
    (function (num){
      dot.onclick = function (){ scrollToArena(num, true); };
    })(n);
    dots.appendChild(dot);
  }

  track.addEventListener('scroll', function (){
    window.requestAnimationFrame(updateFromScroll);
  });

  slidesBuilt = true;
}

function slideOf(n){
  return $('arenaScroll').querySelector('.arena-slide[data-n="' + n + '"]');
}

function primeSlideVideo(n){
  const slide = slideOf(n);
  if (!slide) return;

  const v  = slide.querySelector('video');
  const ic = slide.querySelector('span');
  const box = slide.querySelector('.arena-slide-img');
  if (!v || !ic) return;

  const cached = getPoster(n);
  if (cached){
    v.poster = cached;
    if (box) box.style.backgroundImage = 'url(' + cached + ')';
    v.style.display = 'block';
    ic.style.display = 'none';
  }

  const src = videoPath(n);
  if (!src) return;

  if (v.dataset.arena === String(n)) return;

  v.dataset.arena = String(n);
  v.preload = 'auto';
  v.muted = true;

  v.addEventListener('loadeddata', function (){
    grabPoster(v, n);
    if (box && getPoster(n)) box.style.backgroundImage = 'url(' + getPoster(n) + ')';
    v.style.display = 'block';
    ic.style.display = 'none';
  });

  v.addEventListener('error', function (){
    if (!getPoster(n)){
      v.style.display = 'none';
      ic.style.display = '';
    }
  });

  v.src = src;
  try { v.load(); } catch (e){}
}

function primeAllSlideVideos(){
  const order = [viewArena];
  for (let n = MAX_ARENA; n >= 1; n--){
    if (n !== viewArena) order.push(n);
  }

  order.forEach(function (n, i){
    setTimeout(function (){ primeSlideVideo(n); }, i * 150);
  });
}

function loadSlideVideo(n){
  primeSlideVideo(n);

  const slide = slideOf(n);
  if (!slide) return;

  const v = slide.querySelector('video');
  const ic = slide.querySelector('span');
  if (!v) return;

  if (getPoster(n)){
    v.style.display = 'block';
    if (ic) ic.style.display = 'none';
  }

  try { v.play().catch(function(){}); } catch (e){}
}

function markMine(n){
  myArena = n;

  const track = $('arenaScroll');
  if (track){
    const slides = track.querySelectorAll('.arena-slide');
    for (let i = 0; i < slides.length; i++){
      slides[i].classList.toggle('mine', +slides[i].dataset.n === n);
    }
  }

  const dots = $('arenaDots');
  if (dots){
    const list = dots.querySelectorAll('.arena-dot');
    for (let i = 0; i < list.length; i++){
      list[i].classList.toggle('mine', +list[i].dataset.n === n);
    }
  }

  const bar = $('mineBarText');
  if (bar) bar.textContent = n + ' · ' + NAMES[n - 1];
}

function markViewed(n){
  viewArena = n;

  const track = $('arenaScroll');
  if (track){
    const slides = track.querySelectorAll('.arena-slide');
    for (let i = 0; i < slides.length; i++){
      slides[i].classList.toggle('now', +slides[i].dataset.n === n);
    }
  }

  const dots = $('arenaDots');
  if (dots){
    const list = dots.querySelectorAll('.arena-dot');
    for (let i = 0; i < list.length; i++){
      list[i].classList.toggle('on', +list[i].dataset.n === n);
    }
  }

  loadSlideVideo(n);
}

function scrollToArena(n, smooth){
  const track = $('arenaScroll');
  const el = slideOf(n);
  if (!track || !el) return;

  const top = el.offsetTop - (track.clientHeight - el.offsetHeight) / 2;

  if (smooth && track.scrollTo){
    track.scrollTo({ top: top, behavior: 'smooth' });
  } else {
    track.scrollTop = top;
  }
  markViewed(n);
}

function updateFromScroll(){
  const track = $('arenaScroll');
  if (!track) return;

  const center = track.scrollTop + track.clientHeight / 2;
  const slides = track.querySelectorAll('.arena-slide');

  let best = null, bestDist = Infinity;
  for (let i = 0; i < slides.length; i++){
    const s = slides[i];
    const sc = s.offsetTop + s.offsetHeight / 2;
    const d = Math.abs(sc - center);
    if (d < bestDist){ bestDist = d; best = s; }
  }
  if (best) markViewed(+best.dataset.n);
}

function openArenaBrowser(){
  buildArenaBrowser();
  markMine(myArena);
  markViewed(myArena);

  primeAllSlideVideos();

  $('arenaModal').classList.add('open');

  requestAnimationFrame(function (){
    requestAnimationFrame(function (){
      scrollToArena(myArena, false);
    });
  });
}

$('arenaCard').onclick = openArenaBrowser;

$('arenaClose').onclick = function (){
  $('arenaModal').classList.remove('open');

  const vids = $('arenaScroll').querySelectorAll('video');
  for (let i = 0; i < vids.length; i++){
    try { vids[i].pause(); } catch (e){}
  }
};

/* ---------------- загрузка профиля ---------------- */

async function boot(){
  try {
    const res = await sb.rpc('arena_ensure_player', {
      p_key:  playerKey(),
      p_name: playerName(),
      p_seed: 0
    });

    if (res.error) throw res.error;

    $('dbWarn').textContent = '';

    const data = res.data || {};
    const cups = data.cups || 0;

    if (!hasOwnNick() && data.display_name && data.display_name.trim().length >= 2){
      try { localStorage.setItem(NICK_KEY, data.display_name.trim()); } catch (e){}
    }

    render(cups);
    return true;

  } catch (e){
    console.error(e);

    const msg  = (e && (e.message || e.error_description)) || 'неизвестная ошибка';
    const code = (e && e.code) ? ' [' + e.code + ']' : '';

    $('dbWarn').textContent = 'База недоступна' + code + ': ' + msg;
    render(parseInt(localStorage.getItem('cr_trophies') || '0', 10) || 0);
    return false;
  }
}

$('battleBtn').onclick = function (){
  try { sessionStorage.setItem('arenaAutoQueue', '1'); } catch (e){}
  window.location.href = 'chess-arena.html';
};

render(0);
boot();

setTimeout(function (){
  buildArenaBrowser();
  primeAllSlideVideos();
}, 600);

document.addEventListener('visibilitychange', function (){
  if (!document.hidden) boot();
  else {
    const v = $('arenaVideo');
    if (v) { try { v.pause(); } catch (e){} }
  }
});
</script>

<script>
/* всплывающий вызов на дружескую партию */
(function(){
  if (!window.Friends) return;

  function popup(c){
    var o = document.createElement('div');
    o.style.cssText = 'position:fixed;inset:0;background:rgba(2,6,23,.95);z-index:2000;' +
      'display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';
    o.innerHTML =
      '<div style="max-width:330px;width:100%;background:linear-gradient(145deg,#1e293b,#0f172a);' +
        'border:2px solid #22c55e;border-radius:16px;padding:20px">' +
        '<div style="font-size:40px;margin-bottom:8px">⚔️</div>' +
        '<div id="fnm" style="font-size:15px;font-weight:900;margin-bottom:6px"></div>' +
        '<div style="font-size:12px;color:#94a3b8;margin-bottom:14px">' +
          'Вызывает тебя на дружескую партию</div>' +
        '<div style="display:flex;gap:8px">' +
          '<button id="fNo" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#ef4444,#991b1b);color:#fff;font-weight:900;' +
            'font-size:13px">Отклонить</button>' +
          '<button id="fYes" style="flex:1;padding:12px;border:0;border-radius:10px;' +
            'background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;font-weight:900;' +
            'font-size:13px">Играть</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(o);
    o.querySelector('#fnm').textContent = c.from_name || 'Игрок';

    var closed = false;
    var chk = setInterval(async function(){
      if (closed) return;
      var st = await Friends.status(c.id);
      if (!st || st.status !== 'pending'){
        closed = true;
        clearInterval(chk);
        o.remove();
      }
    }, 3000);

    function close(){
      closed = true;
      clearInterval(chk);
      o.remove();
    }

    o.querySelector('#fNo').onclick = async function(){
      close();
      await Friends.answer(c.id, 'declined');
    };

    o.querySelector('#fYes').onclick = async function(){
      close();
      var r = await Friends.answer(c.id, 'accepted');
      if (!r || !r.accepted) return;
      Friends.play(c.id, 'guest', c.from_key, c.from_name, c.from_cups, c.arena);
    };
  }

  setTimeout(function(){ Friends.watch(popup); }, 1500);
})();
</script>
