<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>История партий</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{--dark:#334155;--light:#64748b;--accent:#ffcc00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}

/* ===== НЕБО ===== */
body{
  margin:0;color:#fff;min-height:100vh;min-height:100dvh;padding-bottom:24px;user-select:none;
  background:linear-gradient(180deg,#1f7ae0 0%,#38a3f5 38%,#7dd0fb 72%,#bfe9ff 100%);
  background-attachment:fixed;position:relative;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 170px 55px at 14% 10%,rgba(255,255,255,.8),transparent 70%),
    radial-gradient(ellipse 130px 45px at 21% 12%,rgba(255,255,255,.7),transparent 70%),
    radial-gradient(ellipse 190px 60px at 80% 20%,rgba(255,255,255,.65),transparent 70%),
    radial-gradient(ellipse 150px 45px at 87% 22%,rgba(255,255,255,.55),transparent 70%);
  animation:clouds 44s linear infinite;
}
@keyframes clouds{0%{transform:translateX(0)}50%{transform:translateX(-28px)}100%{transform:translateX(0)}}
body::after{
  content:'';position:fixed;top:0;left:0;right:0;height:4px;z-index:9999;pointer-events:none;
  background:linear-gradient(90deg,#ffe082,#ffb300,#ffe082,#ffb300,#ffe082);
  background-size:200% 100%;animation:goldmove 5s linear infinite;
}
@keyframes goldmove{0%{background-position:0 0}100%{background-position:200% 0}}

/* ===== ШАПКА ===== */
.hist-head{
  display:flex;align-items:center;gap:11px;padding:14px 14px 10px;
  position:relative;z-index:5;
}
.hist-back{
  width:40px;height:40px;flex-shrink:0;border-radius:13px;cursor:pointer;
  background:linear-gradient(180deg,#ffd447,#ff9f1c);
  border:3px solid #fff;color:#5a2d00;font-size:18px;font-weight:900;line-height:1;
  box-shadow:0 4px 0 #b45309,0 6px 14px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.7);
  padding:0;
}
.hist-back:active{transform:translateY(3px);box-shadow:0 1px 0 #b45309}
.hist-title{
  font-size:19px;font-weight:900;letter-spacing:.4px;
  text-shadow:0 2px 0 rgba(0,0,0,.3),0 0 16px rgba(255,212,71,.4);
}

/* ===== СВОДКА ===== */
.summary{
  margin:0 14px 12px;padding:12px 14px;border-radius:16px;
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:linear-gradient(180deg,#2a4a9e,#16306e);
  border:3px solid #ffd447;
  box-shadow:0 6px 0 #0b1b45,0 10px 22px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.2);
  position:relative;z-index:5;
}
.sum-item{flex:1;text-align:center;min-width:0}
.sum-item span{display:block;font-size:9px;font-weight:900;color:#9fc0f0;letter-spacing:.6px;text-transform:uppercase}
.sum-item b{display:block;font-size:18px;font-weight:900;color:#ffd447;margin-top:3px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.sum-item .stars-mini{font-size:13px;letter-spacing:1px}

/* ===== СПИСОК ===== */
.hist-list{padding:2px 14px 30px;position:relative;z-index:5}

.hist-card{
  background:linear-gradient(180deg,#ffffff,#e8f0ff);
  border:3px solid #ffd447;border-radius:16px;
  padding:12px 13px;margin-bottom:11px;cursor:pointer;
  transition:transform .12s;
  box-shadow:0 5px 0 #b45309,0 9px 20px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.8);
  position:relative;overflow:hidden;
}
.hist-card:active{transform:translateY(3px);box-shadow:0 2px 0 #b45309}

.hist-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px}
.hist-opp{
  font-size:14px;font-weight:900;color:#132a54;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
}
.hist-res{
  font-size:10.5px;font-weight:900;letter-spacing:.6px;
  padding:4px 10px;border-radius:9px;flex-shrink:0;
  box-shadow:0 2px 0 rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4);
}
.res-win{color:#fff;background:linear-gradient(180deg,#5ef08a,#22a04a);border:2px solid #fff}
.res-lose{color:#fff;background:linear-gradient(180deg,#f4665e,#c62828);border:2px solid #fff}
.res-draw{color:#fff;background:linear-gradient(180deg,#8fa8cc,#5a7398);border:2px solid #fff}

/* звёзды */
.stars{display:flex;gap:3px;margin-bottom:7px;align-items:center}
.star{
  font-size:19px;line-height:1;
  color:#c7d4e8;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
}
.star.on{
  color:#ffc400;
  text-shadow:0 0 10px rgba(255,196,0,.85),0 2px 0 #b47800;
  animation:starPop .35s ease-out;
}
@keyframes starPop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.stars-note{font-size:10px;font-weight:900;color:#5a7398;margin-left:5px}

.hist-meta{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:#5a7398;font-weight:800;
}
.hist-meta b{color:#0f4fa8;font-weight:900}

.hist-empty{
  text-align:center;color:#fff;font-size:13.5px;padding:50px 20px;line-height:1.6;
  font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.25);
}

/* ===== ПРОСМОТР ПАРТИИ ===== */
#replay{
  position:fixed;inset:0;background:linear-gradient(180deg,#16306e,#080f22);
  z-index:900;display:none;flex-direction:column;align-items:center;
  padding:8px 0 14px;overflow:hidden;
}
#replay.open{display:flex}
.rp-head{width:min(94vw,420px);display:flex;align-items:center;gap:10px;margin-bottom:8px}
.rp-back{
  width:36px;height:36px;flex-shrink:0;border-radius:12px;cursor:pointer;
  background:linear-gradient(180deg,#ffd447,#ff9f1c);
  border:3px solid #fff;color:#5a2d00;font-size:15px;font-weight:900;line-height:1;
  box-shadow:0 3px 0 #b45309;padding:0;
}
.rp-back:active{transform:translateY(2px);box-shadow:0 1px 0 #b45309}
.rp-title{font-size:13px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rp-sub{font-size:10.5px;color:#a8c4ea;margin-top:1px;font-weight:700}

#rpBoardWrap{position:relative}
#rpBoard{
  --side:min(94vw,420px,calc(100dvh - 250px));width:var(--side);height:var(--side);
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:4px solid #ffd447;border-radius:14px;overflow:hidden;
  box-shadow:0 10px 0 #b45309,0 16px 30px rgba(0,0,0,.7);
}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(15px,5.4vw,28px);overflow:hidden}
.cell.light{background:var(--light)}
.cell.dark{background:var(--dark)}
.cell.check{box-shadow:inset 0 0 0 3px #ef4444,inset 0 0 20px rgba(239,68,68,.8)}
.pc{line-height:1;margin-bottom:6px;font-weight:400;pointer-events:none}
.pc.mine{color:#5aa9ec;text-shadow:0 0 6px rgba(90,169,236,.75),0 2px 4px rgba(0,0,0,.95)}
.pc.theirs{color:#ef5350;text-shadow:0 0 6px rgba(239,83,80,.75),0 2px 4px rgba(0,0,0,.95)}

.rp-ctrl{width:min(94vw,420px);margin-top:14px}
#rpSlider{width:100%;height:26px;-webkit-appearance:none;background:transparent;outline:none}
#rpSlider::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:#1e293b;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
#rpSlider::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-7px;
  background:linear-gradient(180deg,#ffe082,#ffb300);border:2px solid #fff;
  box-shadow:0 0 10px rgba(255,179,0,.9);
}
#rpSlider::-moz-range-track{height:7px;border-radius:4px;background:#1e293b}
#rpSlider::-moz-range-thumb{width:20px;height:20px;border:2px solid #fff;border-radius:50%;background:#ffb300}

.rp-time{
  display:flex;justify-content:space-between;font-size:11px;color:#a8c4ea;
  font-weight:900;font-variant-numeric:tabular-nums;margin-top:-2px;
}
.rp-btns{display:flex;gap:6px;margin-top:12px}
.rp-btns button{
  flex:1;padding:12px 4px;border-radius:12px;font-size:12px;font-weight:900;
  border:3px solid #fff;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,#5a7398,#33486b);
  box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.2);
}
.rp-btns button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5)}
#rpPlay{
  background:linear-gradient(180deg,#5ef08a,#1f9e42);
  box-shadow:0 3px 0 #0b5426,inset 0 2px 0 rgba(255,255,255,.35);
}
.rp-note{width:min(94vw,420px);text-align:center;font-size:10.5px;color:#7fa0d0;margin-top:10px;line-height:1.4;font-weight:700}
</style>
</head>
<body>

<div class="hist-head">
  <button class="hist-back" onclick="location.href='chess-main.html'">←</button>
  <div class="hist-title">📜 История партий</div>
</div>

<div class="summary" id="summary">
  <div class="sum-item"><span>Партий</span><b id="sumGames">0</b></div>
  <div class="sum-item"><span>Побед</span><b id="sumWins">0</b></div>
  <div class="sum-item"><span>Звёзды</span><b id="sumStars" class="stars-mini">0</b></div>
</div>

<div class="hist-list" id="histList">
  <div class="hist-empty">Загрузка…</div>
</div>

<div id="replay">
  <div class="rp-head">
    <button class="rp-back" onclick="closeReplay()">←</button>
    <div style="min-width:0">
      <div class="rp-title" id="rpTitle">Партия</div>
      <div class="rp-sub" id="rpSub"></div>
    </div>
  </div>

  <div id="rpBoardWrap">
    <div id="rpBoard"></div>
  </div>

  <div class="rp-ctrl">
    <input type="range" id="rpSlider" min="0" max="1000" value="0">
    <div class="rp-time">
      <span id="rpNow">0:00</span>
      <span id="rpMove">ход 0 / 0</span>
      <span id="rpEnd">0:00</span>
    </div>
    <div class="rp-btns">
      <button id="rpReset">⟲ Сначала</button>
      <button id="rpBack5">−5 с</button>
      <button id="rpPlay">▶ Играть</button>
      <button id="rpFwd5">+5 с</button>
    </div>
    <div class="rp-note" id="rpNote"></div>
  </div>
</div>

<script src="arena.js?v=18"></script>
<script>
const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);

const $ = function (id){ return document.getElementById(id); };

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function fmt(sec){
  const t = Math.max(0, Math.floor(sec || 0));
  return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');
}

function dateRu(iso){
  try {
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return dd + '.' + mm + ' ' + hh + ':' + mi;
  } catch (e){ return ''; }
}

let rows = [];

/* ================= ЗВЁЗДЫ ================= */

/* пороги: 60-100% — три, 30-60% — две, 0-30% — одна */
function starsFor(left, total){
  if (!total || total <= 0) return 0;
  const pct = (left / total) * 100;
  if (pct >= 60) return 3;
  if (pct >= 30) return 2;
  return 1;
}

function countPieces(st, side){
  let n = 0;
  if (!st || !st.board) return 0;
  for (let y = 0; y < 8; y++){
    for (let x = 0; x < 8; x++){
      const pc = st.board[y] && st.board[y][x];
      if (pc && pc.side === side) n++;
    }
  }
  return n;
}

const STAR_KEY = 'cr_stars_cache';
let starCache = {};
try { starCache = JSON.parse(localStorage.getItem(STAR_KEY) || '{}') || {}; } catch (e){ starCache = {}; }

function saveStarCache(){
  try { localStorage.setItem(STAR_KEY, JSON.stringify(starCache)); } catch (e){}
}

/* переигрываем партию и считаем, сколько своих фигур осталось */
function computeStars(row){
  if (!row) return 0;
  if (row.winner !== 'a' && row.winner !== 'b') return 0;
  if (row.winner !== row.my_side) return 0;

  const id = row.match_id;
  if (id && starCache[id] !== undefined) return starCache[id];

  const my = (row.my_side === 'b') ? 'b' : 'a';
  let stars = 0;
  let ok = false;

  try {
    const log = Array.isArray(row.moves) ? row.moves : [];
    const st = freshState(row);

    const start = countPieces(st, my);
    if (!start) return 0;

    let t = 0;
    for (let i = 0; i < log.length; i++){
      const m = log[i];
      if (m.at > t){
        Arena.tick(st, m.at - t);
        t = m.at;
      }
      applyMove(st, m);
      if (st.over) break;
    }

    const left = countPieces(st, my);
    stars = starsFor(left, start);
    ok = true;
  } catch (e){
    ok = false;
  }

  if (ok && id){
    starCache[id] = stars;
    saveStarCache();
  }
  return stars;
}

function starHtml(n){
  if (!n) return '';
  let h = '<div class="stars">';
  for (let i = 1; i <= 3; i++){
    h += '<span class="star' + (i <= n ? ' on' : '') + '">★</span>';
  }
  h += '</div>';
  return h;
}

/* ================= СПИСОК ================= */

async function loadList(){
  const list = $('histList');

  const res = await sb
    .from('arena_replays')
    .select('match_id,my_side,arena,winner,opponent_name,seconds,created_at,setup_a,setup_b,moves')
    .eq('player_key', playerKey())
    .order('created_at', { ascending: false })
    .limit(100);

  if (res.error){
    list.innerHTML = '<div class="hist-empty">Не удалось загрузить историю.<br>' +
      (res.error.message || '') + '</div>';
    return;
  }

  rows = res.data || [];

  if (!rows.length){
    list.innerHTML = '<div class="hist-empty">Пока нет записанных партий.<br>' +
      'Сыграй бой — он появится здесь.</div>';
    $('sumGames').textContent = '0';
    $('sumWins').textContent  = '0';
    $('sumStars').textContent = '0';
    return;
  }

  let html = '';
  let wins = 0;
  let starsTotal = 0;

  rows.forEach(function (r){
    let cls = 'res-draw', txt = 'НИЧЬЯ';

    if (r.winner === 'a' || r.winner === 'b'){
      if (r.winner === r.my_side){ cls = 'res-win'; txt = 'ПОБЕДА'; wins++; }
      else { cls = 'res-lose'; txt = 'ПОРАЖЕНИЕ'; }
    }

    const st = computeStars(r);
    starsTotal += st;

    html +=
      '<div class="hist-card" data-id="' + r.match_id + '">' +
        '<div class="hist-top">' +
          '<div class="hist-opp">' + (r.opponent_name || 'Соперник') + '</div>' +
          '<div class="hist-res ' + cls + '">' + txt + '</div>' +
        '</div>' +
        starHtml(st) +
        '<div class="hist-meta">' +
          '<span>Арена <b>' + (r.arena || 1) + '</b> · ' + dateRu(r.created_at) + '</span>' +
          '<span>' + fmt(r.seconds) + '</span>' +
        '</div>' +
      '</div>';
  });

  list.innerHTML = html;

  $('sumGames').textContent = rows.length;
  $('sumWins').textContent  = wins;
  $('sumStars').textContent = starsTotal + ' ★';

  const cards = list.querySelectorAll('.hist-card');
  for (let i = 0; i < cards.length; i++){
    (function (el){
      el.onclick = function (){ openReplay(el.dataset.id); };
    })(cards[i]);
  }
}

/* ================= ДОСКА ================= */

let cells = [];
let R = null;

function buildCells(){
  const b = $('rpBoard');
  b.innerHTML = '';
  cells = [];

  for (let i = 0; i < 64; i++){
    const d = document.createElement('div');
    d.className = 'cell';
    b.appendChild(d);
    cells.push(d);
  }
}

function freshState(row){
  return Arena.create({
    id: 'replay',
    arena: row.arena || 1,
    players: {
      a: { key:'a', name:'Белые', cups:0 },
      b: { key:'b', name:'Чёрные', cups:0 }
    },
    setups: { a: row.setup_a, b: row.setup_b }
  });
}

function applyMove(st, m){
  if (m.t === 'm'){
    Arena.move(st, m.s, m.fx, m.fy, m.tx, m.ty, m.p || 'q');
    return;
  }

  if (m.t === 'r'){
    Arena.resign(st, m.s);
    return;
  }

  if (!st.drawOffer) st.drawOffer = { a:false, b:false };

  if (m.t === 'd'){
    const foe = (m.s === 'a') ? 'b' : 'a';
    if (st.drawOffer[foe]){
      st.drawOffer.a = false;
      st.drawOffer.b = false;
      Arena.finish(st, 'draw');
    } else {
      st.drawOffer[m.s] = true;
    }
    return;
  }

  if (m.t === 'u'){
    st.drawOffer.a = false;
    st.drawOffer.b = false;
  }
}

function draw(){
  if (!R) return;

  const st = R.st;
  const my = (R.row.my_side === 'b') ? 'b' : 'a';
  const rot = (my === 'b');
  const foe = (my === 'a') ? 'b' : 'a';

  const myCheck = Arena.kingAttacked(st, my);
  const foeCheck = Arena.kingAttacked(st, foe);

  for (let dy = 0; dy < 8; dy++) for (let dx = 0; dx < 8; dx++){
    const x = rot ? 7 - dx : dx;
    const y = rot ? 7 - dy : dy;

    const el = cells[dy * 8 + dx];
    const pc = st.board[y] && st.board[y][x];
    const light = ((x + y) % 2 === 0);

    el.className = 'cell ' + (light ? 'light' : 'dark');
    el.textContent = '';

    if (pc){
      const mine = (pc.side === my);
      const def = Arena.PIECES[pc.type];

      const sp = document.createElement('span');
      sp.className = 'pc ' + (mine ? 'mine' : 'theirs');
      sp.textContent = def ? (mine ? def.w : def.b) : '?';
      el.appendChild(sp);

      if (pc.type === 'king' && ((pc.side === my) ? myCheck : foeCheck)){
        el.classList.add('check');
      }
    }
  }

  const total = R.total || 1;

  $('rpNow').textContent  = fmt(R.curT);
  $('rpEnd').textContent  = fmt(total);
  $('rpMove').textContent = 'ход ' + R.idx + ' / ' + R.log.length;
  $('rpSlider').value = Math.min(1000, Math.round((R.curT / total) * 1000));
}

function advanceTo(target){
  if (!R) return;

  const st = R.st;
  const log = R.log;

  while (R.idx < log.length && log[R.idx].at <= target && !st.over){
    const m = log[R.idx++];
    const dt = Math.max(0, m.at - R.curT);
    if (dt > 0) Arena.tick(st, dt);
    R.curT = Math.max(R.curT, m.at);
    applyMove(st, m);
  }

  if (!st.over && target > R.curT){
    Arena.tick(st, target - R.curT);
    R.curT = target;
  }

  draw();
}

function seek(t){
  if (!R) return;

  R.st  = freshState(R.row);
  R.idx = 0;
  R.curT = 0;

  advanceTo(Math.max(0, Math.min(R.total, t)));
}

/* ================= ВОСПРОИЗВЕДЕНИЕ ================= */

let playTimer = null;

function stopPlay(){
  if (playTimer){ clearInterval(playTimer); playTimer = null; }
  $('rpPlay').textContent = '▶ Играть';
}

function startPlay(){
  if (!R) return;
  stopPlay();

  if (R.curT >= R.total - 0.05){
    seek(0);
  }

  const speed = 1.6;

  $('rpPlay').textContent = '⏸ Пауза';

  playTimer = setInterval(function (){
    if (!R){ stopPlay(); return; }

    const next = R.curT + 0.1 * speed;
    advanceTo(next);

    if (R.curT >= R.total - 0.05 || R.st.over){
      stopPlay();
    }
  }, 100);
}

/* ================= ОТКРЫТИЕ ПАРТИИ ================= */

async function openReplay(id){
  stopPlay();

  const res = await sb
    .from('arena_replays')
    .select('*')
    .eq('match_id', id)
    .eq('player_key', playerKey())
    .maybeSingle();

  if (res.error || !res.data){
    return;
  }

  const row = res.data;
  const log = Array.isArray(row.moves) ? row.moves : [];

  if (!log.length){
    return;
  }

  buildCells();

  let total = 0;
  for (let i = 0; i < log.length; i++){
    if (log[i].at > total) total = log[i].at;
  }
  total = Math.max(total, row.seconds || 0) + 2;

  R = {
    row: row,
    log: log,
    st: null,
    idx: 0,
    curT: 0,
    total: total
  };

  R.st = freshState(row);

  let txt = 'НИЧЬЯ';
  if (row.winner === 'a' || row.winner === 'b'){
    txt = (row.winner === row.my_side) ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ';
  }

  $('rpTitle').textContent = (row.opponent_name || 'Соперник') + ' · ' + txt;

  const st = computeStars(row);
  const starTxt = st ? (' · ' + '★'.repeat(st)) : '';

  $('rpSub').textContent = 'Арена ' + (row.arena || 1) + ' · ' + dateRu(row.created_at) + starTxt;

  $('rpNote').textContent = (row.my_side === 'a')
    ? 'Ты играл светлыми фигурами'
    : 'Ты играл тёмными фигурами';

  $('rpSlider').value = 0;
  draw();
  $('replay').classList.add('open');
}

function closeReplay(){
  stopPlay();
  R = null;
  $('replay').classList.remove('open');
}

/* ================= КНОПКИ ================= */

$('rpPlay').onclick = function (){
  if (playTimer) stopPlay();
  else startPlay();
};

$('rpReset').onclick = function (){
  stopPlay();
  seek(0);
};

$('rpBack5').onclick = function (){
  stopPlay();
  seek(Math.max(0, (R ? R.curT : 0) - 5));
};

$('rpFwd5').onclick = function (){
  stopPlay();
  seek(Math.min(R ? R.total : 0, (R ? R.curT : 0) + 5));
};

$('rpSlider').oninput = function (){
  if (!R) return;
  stopPlay();
  const t = (parseInt(this.value, 10) / 1000) * R.total;
  seek(t);
};

loadList();
</script>
</body>
</html>
