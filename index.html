<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sport Royale</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.history-card { background: #1c1c1e; border-radius: 12px; padding: 15px; margin-bottom: 10px; border: 1px solid #2c2c2e; }
.history-date { color: var(--accent-color); font-weight: bold; font-size: 15px; margin-bottom: 5px; }
.history-food-item { font-size: 12px; color: #fff; margin-bottom: 5px; padding-left: 10px; border-left: 2px solid #34c759; display: flex; justify-content: space-between; }
.history-water-item { font-size: 12px; color: #fff; margin-bottom: 5px; padding-left: 10px; border-left: 2px solid #5ac8fa; display: flex; justify-content: space-between; }
.history-weight-item { font-size: 14px; color: #fff; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; }
.custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
.custom-modal.active { display: flex; }
.custom-modal-content { background: #1c1c1e; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-sizing: border-box; position: relative; max-height: 90vh; overflow-y: auto;}
.custom-modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;}
.compact-panel { background: rgba(28, 28, 30, 0.85); border-radius: 10px; padding: 8px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; min-width: 0; box-sizing: border-box; cursor: pointer; transition: 0.2s;}
.compact-panel:active { background: rgba(50, 50, 55, 0.9); }
.compact-food-list { max-height: 50px; overflow-y: auto; margin-top: 6px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 4px; }
.compact-food-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 2px 5px; border-radius: 4px; margin-bottom: 2px; font-size: 10px; }
.quick-btn { background: #2c2c2e; color: white; border: 1px solid #3a3a3c; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
.water-btn { background: rgba(90, 200, 250, 0.2); border: 1px solid #5ac8fa; color: #5ac8fa; border-radius: 4px; padding: 2px 4px; font-size: 10px; cursor: pointer; font-weight: bold; text-align: center; }
.weight-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; margin-right: 5px; }
.analysis-btn { background: rgba(255, 204, 0, 0.2); border: 1px solid var(--accent-color); color: var(--accent-color); padding: 6px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; margin-top: 10px; }
.diary-btn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 6px; padding: 2px 6px; font-size: 12px; cursor: pointer; }
.diary-btn:active { background: rgba(255,255,255,0.3); }
.chart-container { background: #2c2c2e; border-radius: 12px; padding: 10px; margin-top: 15px; position: relative; height: 200px; width: 100%; box-sizing: border-box;}
.summary-box { background: rgba(52, 199, 89, 0.1); border: 1px solid #34c759; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
.summary-title { font-size: 14px; font-weight: bold; color: #34c759; margin-bottom: 8px; }
.summary-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; text-align: center; }

.streak-badge { position: absolute; top: 15px; left: 15px; background: rgba(255, 87, 34, 0.15); border: 1px solid #ff5722; color: #ff5722; padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; z-index: 40; display: flex; align-items: center; gap: 5px; cursor: pointer; transition: 0.3s; }
@keyframes pulse-fire {
    0% { transform: scale(1); box-shadow: 0 0 15px #ff5722; background: rgba(255, 87, 34, 0.4); color: #fff; }
    50% { transform: scale(1.1); box-shadow: 0 0 25px #ff5722; background: rgba(255, 87, 34, 0.6); color: #fff; }
    100% { transform: scale(1); box-shadow: 0 0 15px #ff5722; background: rgba(255, 87, 34, 0.4); color: #fff; }
}
.streak-pending { animation: pulse-fire 1.5s infinite; border: 2px solid #fff; }

.motivation-toast { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); background: rgba(28, 28, 30, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 2px solid var(--accent-color); border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(255, 204, 0, 0.3); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); width: 90%; max-width: 350px; }
.motivation-toast.show { top: 20px; }
.motivation-icon { font-size: 36px; }
.motivation-text h3 { margin: 0 0 4px 0; color: var(--accent-color); font-size: 16px; }
.motivation-text p { margin: 0; color: #fff; font-size: 13px; line-height: 1.3; }

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 65px;
    background: #1c1c1e;
    border-top: 1px solid #3a3a3c;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 999;
    padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
    background: transparent;
    border: none;
    color: #8e8e93;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    flex: 1;
    height: 100%;
    gap: 4px;
    transition: 0.2s;
}
.nav-btn span.icon { font-size: 22px; }
.nav-btn.active { color: #ffcc00; }
.nav-btn.chess-active { color: #af52de; }
.overlay { padding-bottom: 75px !important; }
</style>
</head>
<body class="male-theme">

<div class="bottom-nav">
    <button class="nav-btn active" onclick="window.location.reload()">
        <span class="icon">🏋️</span>
        <span>Sport App</span>
    </button>
    <button class="nav-btn chess-active" onclick="window.location.href='chess-game.html?v=100'">
        <span class="icon">♟️</span>
        <span>Chess Royale</span>
    </button>
</div>

<div id="auth-screen" class="screen active auth-screen">
<div class="auth-container"><div class="auth-content"><div class="auth-title">Sport Royale</div><div class="inspiration-text">Стань лучшей версией себя.<br>Начни прямо сейчас.</div><div class="auth-buttons"><button class="auth-btn tg-btn" onclick="loginWithTelegram()">✈️ Продолжить через Telegram</button><div class="auth-divider"><span>или</span></div><button class="auth-btn email-btn" onclick="showEmailForm()">✉️ Войти по Email</button></div></div></div>
</div>

<div id="email-screen" class="screen">
<div class="inner-screen">
<button class="back-btn" onclick="closeScreen('email-screen')">← Назад</button>
<h1 style="text-align: center; margin-bottom: 30px;">Вход / Регистрация</h1>
<div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="your@email.com"></div>
<div class="form-group"><label>Пароль</label><input type="password" id="auth-password" placeholder="Минимум 6 символов"></div>
<button class="btn" onclick="handleEmailAuth()" id="email-submit-btn">Продолжить</button>
</div>
</div>

<div id="dashboard-screen" class="screen">
<video id="character-video" class="video-background" autoplay loop muted playsinline></video>
<div class="overlay" style="justify-content: flex-end; padding-bottom: 10px;">
<div id="streak-display" class="streak-badge" onclick="claimStreakReward()">🔥 0</div>

<div style="display: flex; justify-content: space-between; position: absolute; top: 0px; left: 0px; right: 0px; z-index: 30; padding: 5px 10px; gap: 5px;">
<button class="btn" style="background-color: rgba(44,44,46,0.7); color: white; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; flex: 1; margin-left: 70px;" onclick="openProfileSettings()">⚙️ Настр.</button>
<button class="btn" style="background-color: rgba(255,59,48,0.2); color: #ff3b30; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; flex: 1; border: 1px solid #ff3b30;" onclick="logout()">Выйти</button>
</div>
<div class="top-info" style="margin-top: 0; margin-bottom: auto;">
<div class="character-level" id="char-level" style="font-size: 14px;">Уровень 1</div>
<div class="character-title" id="char-title" style="font-size: 28px;">Странник</div>
<div class="xp-bar-container"><div class="xp-bar" id="xp-bar"></div></div>
<p class="xp-text" id="xp-text" style="font-size: 11px;">0 / 100 XP</p>
<div style="text-align: center;">
<button class="weight-btn" onclick="openWeightDiary()">⚖️ <span id="current-weight-display">0</span> кг</button>
<button class="analysis-btn" onclick="openGlobalStatsModal()">📈 Анализ</button>
</div>
</div>
<div class="bottom-panel" style="gap: 8px;">
<div class="stats-row" style="margin-bottom: 0;">
<div class="stat-box" style="padding: 8px;"><p style="font-size: 10px;">Норма</p><h3 id="calories-norm" style="font-size: 16px;">0 ккал</h3></div>
<div class="stat-box" style="padding: 8px;"><p style="font-size: 10px;">Сожжено</p><h3 id="burned-total" style="font-size: 16px;">0 ккал</h3></div>
</div>
<div style="display: flex; gap: 8px; margin-bottom: 4px; width: 100%; box-sizing: border-box;">
<div class="compact-panel" style="flex: 1; border-color: rgba(90, 200, 250, 0.3);" onclick="openWaterDiary()">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
<div style="display: flex; flex-direction: column;"><h4 style="margin: 0; color: #5ac8fa; font-size: 10px; text-transform: uppercase;">💧 Вода</h4><span style="font-size: 11px; color: #fff; font-weight: bold; margin-top: 2px;"><span id="eaten-water">0</span>/<span id="norm-water">2000</span></span></div>
<button class="diary-btn" onclick="event.stopPropagation(); openWaterDiary()">📜 Дневник</button>
</div>
<div style="display: flex; gap: 3px; align-items: stretch; margin-top: 5px;" onclick="event.stopPropagation();">
<button class="water-btn" style="flex: 1;" onclick="addWater(200)">+200</button>
<button class="water-btn" style="flex: 1;" onclick="addWater(500)">+500</button>
<button id="custom-water-quick-btn" class="water-btn" style="flex: 1.5; background: rgba(90, 200, 250, 0.1);" onclick="quickAddCustomWater()">+Своя</button>
</div>
<div id="today-water-list" class="compact-food-list" style="border-color: rgba(90, 200, 250, 0.2);"></div>
</div>
<div class="compact-panel" style="flex: 1;" onclick="openFoodDiary()">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
<div style="display: flex; flex-direction: column;"><h4 style="margin: 0; color: #fff; font-size: 10px; text-transform: uppercase;">🍏 Еда</h4><span style="font-size: 11px; color: #8e8e93; margin-top: 2px;">КБЖУ</span></div>
<button class="diary-btn" onclick="event.stopPropagation(); openFoodDiary()">📜 Дневник</button>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2px; font-size: 10px; text-align: center; margin-top: 5px;">
<div style="color: var(--accent-color); background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px;"><span id="eaten-cal">0</span> Ккал</div>
<div style="background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px;"><span id="eaten-prot">0</span> Бел.</div>
<div style="background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px;"><span id="eaten-fat">0</span> Жир.</div>
<div style="background: rgba(255,255,255,0.05); border-radius: 4px; padding: 2px;"><span id="eaten-carb">0</span> Угл.</div>
</div>
<div id="today-food-list" class="compact-food-list"></div>
<div style="display: none;"><span id="norm-cal"></span><span id="norm-prot"></span><span id="norm-fat"></span><span id="norm-carb"></span></div>
</div>
</div>
<div class="action-grid" style="margin-top: 4px;">
<button class="action-btn" onclick="window.location.href='camera.html'" style="padding: 10px 5px;"><h3 style="font-size: 20px; margin-bottom: 2px;">📸</h3><p style="font-size: 10px;">Еда</p></button>
<button class="action-btn" onclick="window.location.href='workout.html'" style="padding: 10px 5px;"><h3 style="font-size: 20px; margin-bottom: 2px;">💪</h3><p style="font-size: 10px;">Треня</p></button>
<button class="action-btn" onclick="window.location.href='timer.html'" style="padding: 10px 5px;"><h3 style="font-size: 20px; margin-bottom: 2px;">⏱</h3><p style="font-size: 10px;">Таймер</p></button>
<button class="action-btn" onclick="window.location.href='leaderboard.html'" style="padding: 10px 5px;"><h3 style="font-size: 20px; margin-bottom: 2px;">🏆</h3><p style="font-size: 10px;">Рейтинг</p></button>
</div>
</div>
</div>
</div>

<!-- ОСТАЛЬНЫЕ ЭКРАНЫ И МОДАЛКИ БЕЗ ИЗМЕНЕНИЙ (они скрыты в этом листинге для краткости, но в полном коде присутствуют) -->
<!-- ... (все остальные div'ы экранов воды, еды, веса, настроек, модалок) ... -->

<script src="quotes.js"></script>
<script src="app.js"></script>
</body>
</html>
