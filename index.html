```html
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <!-- Обязательный скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            text-align: center;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: var(--tg-theme-button-color, #3390ec);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Привет, Telegram!</h1>
    <p>Это мое первое Mini App.</p>
    <button onclick="alert('Работает!')">Нажми меня</button>
    
    <script>
        // Инициализация
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // Развернуть на весь экран
        
        // Вывод имени пользователя (если открыто внутри Telegram)
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.querySelector('h1').innerText = `Привет, ${tg.initDataUnsafe.user.first_name}!`;
        }
    </script>
</body>
</html>
