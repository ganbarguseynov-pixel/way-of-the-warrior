<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sport App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #007aff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { font-size: 28px; margin: 0 0 10px 0; font-weight: bold; }
        .header p { color: var(--hint-color); font-size: 15px; margin: 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--hint-color); }
        input, select {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--secondary-bg);
            background-color: var(--secondary-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--button-color); }

        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }

        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            margin-top: auto;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        
        .hidden { display: none !important; }
        
        #success-screen {
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
        }
        .emoji-big { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="onboarding-screen">
        <div class="header">
            <h1>Добро пожаловать!</h1>
            <p>Давай настроим твой профиль для достижения цели</p>
        </div>

        <div class="form-group">
            <label>Ваша цель</label>
            <select id="goal">
                <option value="lose">Похудеть</option>
                <option value="gain">Набрать мышечную массу</option>
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Возраст</label>
                <input type="number" id="age" placeholder="Например: 25" min="10" max="100">
            </div>
            <div class="form-group">
                <label>Пол</label>
                <select id="gender">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Вес (кг)</label>
                <input type="number" id="weight" placeholder="70" min="30" max="250">
            </div>
            <div class="form-group">
                <label>Рост (см)</label>
                <input type="number" id="height" placeholder="175" min="100" max="250">
            </div>
        </div>

        <button class="btn" onclick="saveProfile()">Продолжить</button>
    </div>

    <div id="success-screen" class="hidden">
        <div class="emoji-big">🔥</div>
        <h1>Отлично, <span id="user-name">друг</span>!</h1>
        <p style="color: var(--hint-color); margin-bottom: 30px;">Твой профиль создан. Теперь мы сможем рассчитать твою норму калорий.</p>
        <button class="btn" onclick="Telegram.WebApp.close()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
        }

        function saveProfile() {
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const goal = document.getElementById('goal').value;

            if (!age || !weight || !height) {
                tg.showAlert("Пожалуйста, заполни все поля!");
                return;
            }

            const userProfile = { age, gender, weight, height, goal };

            tg.CloudStorage.setItem('profile', JSON.stringify(userProfile), (err, success) => {
                if (success) {
                    document.getElementById('onboarding-screen').classList.add('hidden');
                    document.getElementById('success-screen').classList.remove('hidden');
                } else {
                    tg.showAlert("Ошибка сохранения");
                }
            });
        }
    </script>
</body>
</html>
