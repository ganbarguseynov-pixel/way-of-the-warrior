<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sport App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1c1c1e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #007aff);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #2c2c2e);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .header h1 { font-size: 28px; margin: 0 0 10px 0; font-weight: bold; }
        .header p { color: var(--hint-color); font-size: 15px; margin: 0; }
        
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: var(--hint-color); }
        input, select {
            width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--secondary-bg);
            background-color: var(--secondary-bg); color: var(--text-color); font-size: 16px;
            box-sizing: border-box; outline: none;
        }
        input:focus, select:focus { border-color: var(--button-color); }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }

        .btn {
            background-color: var(--button-color); color: var(--button-text-color); border: none;
            padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 600; width: 100%;
            margin-top: auto; cursor: pointer; transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .hidden { display: none !important; }
        
        /* Стили для Главного экрана */
        .dashboard-card {
            background-color: var(--secondary-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 15px;
        }
        .dashboard-card h2 { font-size: 18px; margin: 0 0 10px 0; }
        .dashboard-card .big-number { font-size: 36px; font-weight: bold; color: var(--button-color); margin: 0; }
        .dashboard-card p { color: var(--hint-color); margin: 5px 0 0 0; font-size: 14px; }
        
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .action-btn {
            background-color: var(--secondary-bg);
            border: none;
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            color: var(--text-color);
            cursor: pointer;
        }
        .action-btn h3 { margin: 0 0 5px 0; font-size: 16px; }
        .action-btn p { margin: 0; color: var(--hint-color); font-size: 12px; }
        .action-btn:active { opacity: 0.7; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: Знакомство -->
    <div id="onboarding-screen">
        <div class="header">
            <h1>Добро пожаловать!</h1>
            <p>Давай настроим твой профиль для достижения цели</p>
        </div>

        <div class="form-group">
            <label>Ваша цель</label>
            <select id="goal">
                <option value="lose">Похудеть</option>
                <option value="gain">Набрать мышечную массу</option>
            </select>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Возраст</label>
                <input type="number" id="age" placeholder="Например: 25" min="10" max="100">
            </div>
            <div class="form-group">
                <label>Пол</label>
                <select id="gender">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Вес (кг)</label>
                <input type="number" id="weight" placeholder="70" min="30" max="250">
            </div>
            <div class="form-group">
                <label>Рост (см)</label>
                <input type="number" id="height" placeholder="175" min="100" max="250">
            </div>
        </div>

        <button class="btn" onclick="saveProfile()">Продолжить</button>
    </div>

    <!-- ЭКРАН 2: Главный экран (Дашборд) -->
    <div id="dashboard-screen" class="hidden">
        <div class="header" style="text-align: left; margin-bottom: 20px;">
            <h1 style="font-size: 24px;">Привет, <span id="user-name">друг</span>!</h1>
            <p id="goal-text">Твоя цель: Похудеть</p>
        </div>

        <div class="dashboard-card">
            <h2>Твоя дневная норма</h2>
            <p class="big-number" id="calories-norm">0 <span style="font-size: 16px; color: var(--hint-color);">ккал</span></p>
            <p>Рассчитано на основе твоих данных</p>
        </div>

        <div class="action-grid">
            <button class="action-btn" onclick="alert('Скоро здесь появится ИИ!')">
                <h3>📸 Сфоткать еду</h3>
                <p>Узнать калории</p>
            </button>
            <button class="action-btn" onclick="alert('Скоро здесь появятся тренировки!')">
                <h3>💪 Тренировка</h3>
                <p>Комплекс на сегодня</p>
            </button>
            <button class="action-btn" onclick="alert('Скоро здесь появится таймер!')">
                <h3>⏱ Таймер</h3>
                <p>Начать упражнение</p>
            </button>
            <button class="action-btn" onclick="alert('Скоро здесь появится рейтинг!')">
                <h3>🏆 Рейтинг</h3>
                <p>Место в топе</p>
            </button>
        </div>
        
        <button class="btn" style="background-color: transparent; color: var(--hint-color); margin-top: 0;" onclick="resetProfile()">Сбросить профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Имя пользователя
        let tgUserName = "друг";
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            tgUserName = tg.initDataUnsafe.user.first_name;
            document.getElementById('user-name').innerText = tgUserName;
        }

        // Функция расчета калорий (Mifflin-St Jeor)
        function calculateCalories(weight, height, age, gender, goal) {
            let bmr;
            if (gender === 'male') {
                bmr = 10 * weight + 6.25 * height - 5 * age + 5;
            } else {
                bmr = 10 * weight + 6.25 * height - 5 * age - 161;
            }
            // Умножаем на коэффициент активности (возьмем средний 1.375)
            let tdee = bmr * 1.375; 
            
            if (goal === 'lose') return Math.round(tdee - 500); // Дефицит
            if (goal === 'gain') return Math.round(tdee + 500); // Профицит
            return Math.round(tdee);
        }

        // Загрузка профиля при старте
        function loadProfile() {
            tg.CloudStorage.getItem('profile', (err, result) => {
                if (result) {
                    const profile = JSON.parse(result);
                    
                    // Считаем калории
                    const calories = calculateCalories(profile.weight, profile.height, profile.age, profile.gender, profile.goal);
                    
                    // Обновляем UI
                    document.getElementById('calories-norm').innerHTML = `${calories} <span style="font-size: 16px; color: var(--hint-color);">ккал</span>`;
                    document.getElementById('goal-text').innerText = profile.goal === 'lose' ? 'Твоя цель: Похудеть' : 'Твоя цель: Набрать массу';
                    
                    // Переключаем экраны
                    document.getElementById('onboarding-screen').classList.add('hidden');
                    document.getElementById('dashboard-screen').classList.remove('hidden');
                }
            });
        }

        // Сохранение профиля
        function saveProfile() {
            const age = document.getElementById('age').value;
            const gender = document.getElementById('gender').value;
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            const goal = document.getElementById('goal').value;

            if (!age || !weight || !height) {
                tg.showAlert("Пожалуйста, заполни все поля!");
                return;
            }

            const userProfile = { age, gender, weight, height, goal };

            tg.CloudStorage.setItem('profile', JSON.stringify(userProfile), (err, success) => {
                if (success) {
                    loadProfile(); // Сразу перезагружаем и показываем дашборд
                } else {
                    tg.showAlert("Ошибка сохранения");
                }
            });
        }

        // Сброс профиля для теста
        function resetProfile() {
            tg.CloudStorage.removeItem('profile', () => {
                location.reload();
            });
        }

        // Запускаем проверку при открытии
        loadProfile();
    </script>
</body>
</html>
