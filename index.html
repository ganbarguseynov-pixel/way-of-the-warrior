<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sport App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
<style>
.compact-panel { background: rgba(28, 28, 30, 0.85); border-radius: 12px; padding: 12px; margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); position: relative; }
.compact-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 5px; text-align: center; }
.compact-val { font-size: 13px; font-weight: bold; white-space: nowrap; }
.compact-val span { font-size: 10px; color: #8e8e93; font-weight: normal; }
.compact-label { font-size: 9px; color: #8e8e93; text-transform: uppercase; margin-top: 2px; }
.compact-food-list { max-height: 80px; overflow-y: auto; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; }
.compact-food-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 11px; }
.custom-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
.custom-modal.active { display: flex; }
.custom-modal-content { background: #1c1c1e; border-radius: 16px; padding: 20px; width: 100%; max-width: 320px; box-sizing: border-box; position: relative; }
.custom-modal-close { position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.1); border: none; color: white; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body class="male-theme">

<div id="auth-screen" class="screen active auth-screen">
<div class="auth-container">
<div class="auth-content">
<div class="auth-title">Sport App</div>
<div class="inspiration-text">Стань лучшей версией себя.<br>Начни прямо сейчас.</div>
<div class="auth-buttons">
<button class="auth-btn tg-btn" onclick="loginWithTelegram()">✈️ Продолжить через Telegram</button>
<div class="auth-divider"><span>или</span></div>
<button class="auth-btn email-btn" onclick="showEmailForm()">✉️ Войти по Email</button>
</div>
</div>
</div>
</div>

<div id="email-screen" class="screen">
<div class="inner-screen">
<button class="back-btn" onclick="closeScreen('email-screen')">← Назад</button>
<h1 style="text-align: center; margin-bottom: 30px;">Вход / Регистрация</h1>
<div class="form-group"><label>Email</label><input type="email" id="auth-email" placeholder="your@email.com"></div>
<div class="form-group"><label>Пароль</label><input type="password" id="auth-password" placeholder="Минимум 6 символов"></div>
<button class="btn" onclick="handleEmailAuth()" id="email-submit-btn">Продолжить</button>
</div>
</div>

<div id="dashboard-screen" class="screen">
<video id="character-video" class="video-background" loop muted playsinline></video>
<div class="overlay">
<div style="display: flex; justify-content: space-between; position: absolute; top: 0px; left: 0px; right: 0px; z-index: 30; padding: 10px 15px;">
<button class="btn" style="background-color: rgba(44,44,46,0.7); color: white; width: auto; padding: 6px 12px; font-size: 12px; margin: 0;" onclick="openProfileSettings()">⚙️ Настройки</button>
<button class="btn" style="background-color: rgba(255,59,48,0.2); color: #ff3b30; width: auto; padding: 6px 12px; font-size: 12px; margin: 0; border: 1px solid #ff3b30;" onclick="logout()">Выйти</button>
</div>
<div class="top-info" style="margin-top: 40px;">
<div class="character-level" id="char-level" style="font-size: 12px;">Уровень 1</div>
<div class="character-title" id="char-title" style="font-size: 26px;">Странник</
