<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Шахматные арены</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{ --dark:#334155; --light:#64748b; --accent:#b5541f; --bg:#0f172a; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

body{
  margin:0;background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;min-height:100dvh;
  padding:8px 0 80px;user-select:none;overflow-x:hidden;
  transition:background .3s;
}
.hidden{display:none!important}

#verTag{
  position:fixed;left:8px;bottom:74px;z-index:1300;
  font-size:10px;font-weight:900;color:#facc15;letter-spacing:.5px;
  background:#0f172a;border:1px solid #facc15;
  padding:3px 8px;border-radius:6px;pointer-events:none;
}

/* ---------- ЛОББИ ---------- */
#lobby{width:95vw;max-width:400px;text-align:center;margin-top:20px}
.card{
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:1px solid #334155;border-radius:14px;
  padding:18px;margin-bottom:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#pName{font-size:16px;font-weight:700;color:#94a3b8}
#pCups{font-size:38px;font-weight:900;color:#ffcc00;margin:4px 0;
  text-shadow:0 0 22px rgba(255,204,0,.4)}
#pArena{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent)}
#pFloor{font-size:11px;color:#64748b;margin-top:6px}
#progWrap{height:8px;background:#020617;border-radius:5px;overflow:hidden;margin-top:10px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#b5541f,#ffcc00);transition:width .4s}

#playBtn{
  width:100%;padding:16px;border:0;border-radius:12px;
  font-size:17px;font-weight:900;letter-spacing:1px;cursor:pointer;
  background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;
  box-shadow:0 6px 16px rgba(34,197,94,.35);transition:transform .1s;
}
#playBtn:active{transform:scale(.98)}
#playBtn.searching{background:linear-gradient(145deg,#475569,#1e293b);
  box-shadow:0 6px 16px rgba(0,0,0,.5)}
#playBtn:disabled{opacity:.45;cursor:not-allowed}

#statusMsg{font-size:13px;color:#ffcc00;min-height:36px;margin-top:10px;line-height:1.35}
#ruleBox{font-size:12px;color:#94a3b8;line-height:1.45;margin-top:10px;min-height:34px}

#bootErr{
  margin-top:12px;padding:12px;border-radius:10px;
  background:rgba(239,68,68,.12);border:1px solid #7f1d1d;
  text-align:left;
}
#bootErrHead{
  font-size:12px;font-weight:900;color:#fca5a5;margin-bottom:6px;
  letter-spacing:.5px;
}
#bootErrText{
  font-size:11px;color:#fecaca;line-height:1.45;
  word-break:break-word;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  max-height:150px;overflow-y:auto;
}
#retryBtn{
  width:100%;margin-top:10px;padding:10px;border-radius:9px;
  border:1px solid #b91c1c;background:linear-gradient(145deg,#ef4444,#991b1b);
  color:#fff;font-size:13px;font-weight:800;cursor:pointer;
}

/* ---------- БОЙ ---------- */
#battle{display:flex;flex-direction:column;align-items:center;width:100%}

#topBar{
  width:95vw;max-width:400px;display:flex;justify-content:space-between;
  align-items:center;font-size:12px;margin-bottom:6px;color:#94a3b8;
}
#topBar b{color:#ffcc00}
#timeLabel{font-weight:900;font-variant-numeric:tabular-nums;font-size:15px}

#enemyElix{
  width:95vw;max-width:400px;height:14px;background:#020617;
  border-radius:8px;overflow:hidden;margin-bottom:6px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.8);
}
#enemyElixFill{height:100%;width:50%;
  background:linear-gradient(180deg,#a855f7,#4c1d95);transition:width .15s}

#board{
  width:95vw;max-width:400px;aspect-ratio:1/1;
  display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);
  border:3px solid #334155;border-radius:12px;overflow:hidden;
  background:var(--dark);box-shadow:0 12px 34px rgba(0,0,0,.85);
}
.cell{position:relative;display:flex;align-items:center;justify-content:center;
  font-size:clamp(18px,6.4vw,32px);cursor:pointer}
.cell.light{background:var(--light)}
.cell.dark{background:var(--dark)}
.cell.sel{outline:3px solid #4ade80;outline-offset:-3px}
.cell.move::after{
  content:'';position:absolute;width:24%;height:24%;border-radius:50%;
  background:radial-gradient(circle,#ffcc00,#b8860b);
  box-shadow:0 0 8px rgba(255,204,0,.9);
}
.cell.cap::after{content:'';position:absolute;inset:6%;
  border:3px solid #ef4444;border-radius:50%}
.cell.trap{background:#6b1212!important;box-shadow:inset 0 0 14px #ff3b3b}
.cell.chain::before{content:'⛓';position:absolute;color:#d4a017;
  font-size:55%;opacity:.95}
.cell.sleep{filter:grayscale(.85) brightness(.55)}
.piece{position:relative;z-index:3;line-height:1;
  text-shadow:0 2px 4px rgba(0,0,0,.9)}
.piece.mine{color:#ffe9c4}
.piece.theirs{color:#9ec9ef}

.king-hp{
  position:absolute;bottom:2px;left:10%;width:80%;
  height:4px;border-radius:3px;background:#000;z-index:5;
  box-shadow:0 0 0 1px rgba(0,0,0,.7);
}
.king-hp i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg,#22c55e,#86efac)}
.king-hp.low i{background:linear-gradient(90deg,#ef4444,#fca5a5)}

#myElix{
  position:relative;
  width:95vw;max-width:400px;height:16px;background:#020617;
  border-radius:8px;overflow:hidden;margin:6px 0;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.8);
}
#myElixFill{height:100%;width:50%;
  background:linear-gradient(180deg,#ff6b7a,#7f1d1d);transition:width .15s}
#speedTag{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:900;color:#fff;letter-spacing:.3px;
  text-shadow:0 1px 3px #000,0 0 6px #000;z-index:4;
}

#hand{width:95vw;max-width:400px;display:flex;gap:6px;margin-bottom:6px}
.hcard{
  flex:1;background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #3a3a3c;border-radius:10px;aspect-ratio:3/4;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;cursor:pointer;position:relative;padding:4px;
  transition:transform .12s,border-color .2s;
}
.hcard.on{border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.5);
  transform:translateY(-3px)}
.hcard.off{opacity:.35;cursor:not-allowed}
.hcard .s{font-size:22px}
.hcard .n{font-size:9px;color:#94a3b8}
.hcard .c{
  position:absolute;top:-6px;left:-6px;
  background:linear-gradient(145deg,#c084fc,#7c3aed);
  width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;
}

#tools{width:95vw;max-width:400px;display:flex;gap:6px}
#tools button{
  flex:1;padding:10px;border-radius:10px;font-size:12px;font-weight:700;
  border:1px solid #475569;
  background:linear-gradient(145deg,#475569,#1e293b);color:#fff;cursor:pointer;
}
#tools button:disabled{opacity:.3;cursor:not-allowed}

/* ---------- РЕЗУЛЬТАТ ---------- */
#overlay{
  position:fixed;inset:0;background:rgba(2,6,23,.92);
  display:flex;align-items:center;justify-content:center;
  z-index:900;padding:20px;
}
.ov{
  text-align:center;padding:26px 30px;
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #334155;border-radius:16px;
  max-width:340px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
}
.ov h2{margin:0 0 6px;font-size:26px}
.ov p{margin:0 0 14px;color:#94a3b8;font-size:13px}
.ov .big{font-size:30px;font-weight:900;color:#ffcc00;margin:8px 0}
.ov .sub{font-size:12px;color:#64748b;margin-bottom:10px;min-height:16px}
.ov button{
  width:100%;padding:13px;border:0;border-radius:10px;
  font-size:15px;font-weight:800;margin-top:8px;
  background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;cursor:pointer;
}

/* ---------- УВЕДОМЛЕНИЕ ---------- */
#toast{
  position:fixed;bottom:84px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:#1e293b;border:1px solid #475569;color:#ffcc00;
  padding:9px 16px;border-radius:8px;font-size:12.5px;
  opacity:0;transition:.2s;pointer-events:none;z-index:950;
  max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- НАВИГАЦИЯ ---------- */
.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;height:68px;
  background:linear-gradient(180deg,#1a1a2e,#0f0f1e);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-around;align-items:center;
  z-index:999;padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  background:transparent;border:none;color:#94a3b8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;font-weight:bold;cursor:pointer;flex:1;height:100%;gap:3px;
}
.nav-btn .icon-wrap{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#2a2a3e,#15151f);
}
.nav-btn .icon{font-size:20px}
.nav-btn.active{color:#ffcc00}
.nav-btn.active .icon-wrap{background:linear-gradient(145deg,#ffcc00,#ff9500)}

/* ---------- ТЕМЫ АРЕН ---------- */
body[data-arena="1"] {--dark:#33241c;--light:#4a3428;--accent:#b5541f;--bg:#0f0b09}
body[data-arena="2"] {--dark:#2a2b1f;--light:#3f4230;--accent:#8a8f4a;--bg:#0d0e0a}
body[data-arena="3"] {--dark:#6b5236;--light:#8d6d49;--accent:#c0c8cf;--bg:#181210}
body[data-arena="4"] {--dark:#2c1a1a;--light:#432626;--accent:#c0392b;--bg:#0d0808}
body[data-arena="5"] {--dark:#3b2a1c;--light:#573b26;--accent:#e0a458;--bg:#100c08}
body[data-arena="6"] {--dark:#3a3f42;--light:#565e62;--accent:#9fb6c4;--bg:#0c0e0f}
body[data-arena="7"] {--dark:#1c1414;--light:#332222;--accent:#8b1a1a;--bg:#080505}
body[data-arena="8"] {--dark:#1b1b22;--light:#2b2b38;--accent:#3b6fd4;--bg:#08080c}
body[data-arena="9"] {--dark:#262a1a;--light:#3a4028;--accent:#6a8f3a;--bg:#0a0c07}
body[data-arena="10"]{--dark:#a89880;--light:#ded4c2;--accent:#c9a227;--bg:#0d0b08}
body[data-arena="10"] .piece.mine{color:#7a4a10;text-shadow:0 0 3px #fff8e0}
body[data-arena="10"] .piece.theirs{color:#1b3a5e;text-shadow:0 0 3px #dfeaf5}
</style>
</head>
<body data-arena="1">

<div id="verTag">v6</div>

<!-- ================= ЛОББИ ================= -->
<div id="lobby">
  <div class="card">
    <div id="pName">Загрузка…</div>
    <div id="pCups">0</div>
    <div id="pArena"></div>
    <div id="pFloor"></div>
    <div id="progWrap"><div id="progFill"></div></div>
  </div>
  <button id="playBtn" disabled>В БОЙ</button>
  <div id="statusMsg"></div>
  <div id="ruleBox"></div>

  <div id="bootErr" class="hidden">
    <div id="bootErrHead">База не отвечает</div>
    <div id="bootErrText"></div>
    <button id="retryBtn">Повторить</button>
  </div>
</div>

<!-- ================= БОЙ ================= -->
<div id="battle" class="hidden">
  <div id="topBar">
    <span id="oppLabel">Соперник</span>
    <span>Ставка <b id="stakeWin">+30</b> /
      <b id="stakeLose" style="color:#ef4444">−30</b></span>
    <span id="timeLabel">5:00</span>
  </div>

  <div id="enemyElix"><div id="enemyElixFill"></div></div>
  <div id="board"></div>
  <div id="myElix"><div id="myElixFill"></div><span id="speedTag"></span></div>
  <div id="hand"></div>

  <div id="tools">
    <button id="nightBtn" disabled>Судная ночь</button>
    <button id="resignBtn">Сдаться</button>
  </div>
</div>

<!-- ================= РЕЗУЛЬТАТ ================= -->
<div id="overlay" class="hidden">
  <div class="ov">
    <h2 id="ovTitle"></h2>
    <p id="ovArena"></p>
    <div class="big" id="ovDelta"></div>
    <div class="sub" id="ovCups"></div>
    <div class="sub" id="ovNote"></div>
    <button id="ovBtn">В меню</button>
  </div>
</div>

<div id="toast"></div>

<!-- ================= НАВИГАЦИЯ ================= -->
<div class="bottom-nav">
  <button class="nav-btn" onclick="location.href='chess-shop.html'">
    <div class="icon-wrap"><span class="icon">🎁</span></div><span>Магазин</span></button>
  <button class="nav-btn" onclick="location.href='chess-deck.html'">
    <div class="icon-wrap"><span class="icon">🃏</span></div><span>Колода</span></button>
  <button class="nav-btn" onclick="location.href='chess-arena.html'">
    <div class="icon-wrap"><span class="icon">⚔️</span></div><span>Бой</span></button>
  <button class="nav-btn" onclick="location.href='chess-social.html'">
    <div class="icon-wrap"><span class="icon">🛡️</span></div><span>Общение</span></button>
  <button class="nav-btn" onclick="location.href='leaderboard.html'">
    <div class="icon-wrap"><span class="icon">🏆</span></div><span>Рейтинг</span></button>
</div>

<script src="arena.js"></script>
<script src="net.js"></script>
<script>
/* ================= ПОДКЛЮЧЕНИЕ ================= */

const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);

const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch (e){}

const $ = function (id){ return document.getElementById(id); };

let pending = null;
let sel     = null;
let cells   = [];
let cellSig = [];        // подпись каждой клетки — неизменное не перерисовываем
let handSig = '';        // подпись руки
let lastTimeTxt = '';
let lastSpeedTxt = '';
let searching = false;

/* ================= УВЕДОМЛЕНИЕ ================= */

let toastTimer = null;
function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ t.classList.remove('show'); }, 2200);
}

/* ================= КЛЮЧ ИГРОКА ================= */

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function playerName(){
  return localStorage.getItem('userName') || 'Игрок';
}

/* ================= ЛОББИ ================= */

function renderLobby(){
  const me = Net.me;
  if (!me) return;

  const arena = Arena.arenaOf(me.cups);
  const floor = Arena.floorOf(me.cups);

  $('pName').textContent  = me.display_name || playerName();
  $('pCups').textContent  = me.cups + ' 🏆';
  $('pArena').textContent = 'АРЕНА ' + arena + ' · ' +
                            Arena.ARENAS[arena - 1].name.toUpperCase();
  $('pFloor').textContent = 'Пол арены: ' + floor + ' 🏆 — ниже не упадёшь';

  let pct;
  if (arena >= Arena.MAX_ARENA) pct = 100;
  else pct = ((me.cups - floor) / Arena.STEP) * 100;
  $('progFill').style.width = Math.max(0, Math.min(100, pct)) + '%';

  $('ruleBox').textContent = Arena.ARENAS[arena - 1].rule;
  document.body.dataset.arena = arena;
}

/* ================= ПОИСК ================= */

async function startSearch(){
  if (searching) return;
  if (!Net.me) return;

  searching = true;
  $('playBtn').classList.add('searching');
  $('playBtn').textContent = 'ОТМЕНА';
  await Net.findMatch();
}

function stopSearch(){
  searching = false;
  $('playBtn').classList.remove('searching');
  $('playBtn').textContent = 'В БОЙ';
}

$('playBtn').onclick = async function (){
  if (searching){
    await Net.cancelQueue();
    stopSearch();
    $('statusMsg').textContent = '';
    return;
  }
  startSearch();
};

/* ================= СОБЫТИЯ СЕТИ ================= */

Net.on('status', function (d){
  $('statusMsg').textContent = d.text || '';
});

Net.on('error', function (d){
  toast(d.message);
});

Net.on('start', function (info){
  stopSearch();
  $('statusMsg').textContent = '';

  $('lobby').classList.add('hidden');
  $('battle').classList.remove('hidden');
  $('overlay').classList.add('hidden');
  $('bootErr').classList.add('hidden');

  pending = null;
  sel = null;
  lastTimeTxt = '';
  lastSpeedTxt = '';
  document.body.dataset.arena = info.arena;

  buildBoard();

  for (let i = 0; i < cellSig.length; i++) cellSig[i] = '';
  handSig = '';

  const myCups  = Net.me ? Net.me.cups : 0;
  const oppCups = (info.opponent && info.opponent.cups) || 0;
  const diff = myCups - oppCups;
  const win  = diff === 0 ? 30 : (diff < 0 ? 31 : 29);
  const lose = Arena.lossFor(myCups, win);

  $('oppLabel').textContent =
    (info.opponent ? info.opponent.name : 'Соперник') + ' (' + oppCups + ' 🏆)';
  $('stakeWin').textContent  = '+' + win;
  $('stakeLose').textContent = '−' + lose;

  if (info.state){
    render(info.state);
  } else {
    $('timeLabel').textContent = '…';
    toast('Восстанавливаем бой…');
  }
});

Net.on('state', function (s){ render(s); });

Net.on('resumeFailed', async function (){
  toast('Бой уже не восстановить.');
  await Net.leaveMatch();
  $('battle').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  await Net.refresh();
  renderLobby();
});

Net.on('result', async function (r){
  stopSearch();

  $('battle').classList.add('hidden');
  $('overlay').classList.remove('hidden');

  const won  = r.winner === r.mySide;
  const draw = r.winner === 'draw';

  $('ovTitle').textContent = draw ? 'НИЧЬЯ' : (won ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ');
  $('ovTitle').style.color = draw ? '#9fb6c4' : (won ? '#ffcc00' : '#ef4444');
  $('ovArena').textContent = 'Арена «' + Arena.ARENAS[Net.arena - 1].name + '»';

  const sign = r.delta > 0 ? '+' : '';
  $('ovDelta').textContent = draw ? '±0' : sign + r.delta + ' 🏆';
  $('ovDelta').style.color = r.delta < 0 ? '#ef4444' : '#ffcc00';
  $('ovCups').textContent = r.before + ' → ' + r.after;

  const arenaNow  = Arena.arenaOf(r.after);
  const arenaThen = Arena.arenaOf(r.before);

  if (arenaNow > arenaThen){
    $('ovNote').textContent = '⬆ НОВАЯ АРЕНА: ' + Arena.ARENAS[arenaNow - 1].name;
    $('ovNote').style.color = '#22c55e';
  } else if (arenaNow < arenaThen){
    $('ovNote').textContent = '⬇ Ты выпал на арену «' + Arena.ARENAS[arenaNow - 1].name + '»';
    $('ovNote').style.color = '#ef4444';
  } else if (!draw && r.delta === 0){
    $('ovNote').textContent = 'Пол арены: ниже ' + r.floor + ' не падаешь';
    $('ovNote').style.color = '#64748b';
  } else {
    $('ovNote').textContent = '';
  }

  await Net.leaveMatch();
  await Net.refresh();
  renderLobby();
});

$('ovBtn').onclick = async function (){
  $('overlay').classList.add('hidden');
  $('battle').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  await Net.refresh();
  renderLobby();
};

/* ================= ДОСКА ================= */

function buildBoard(){
  if (cells.length) return;
  const b = $('board');
  for (let i = 0; i < 64; i++){
    const d = document.createElement('div');
    d.className = 'cell';
    (function (idx){
      d.onclick = function (){ onCell(idx % 8, Math.floor(idx / 8)); };
    })(i);
    b.appendChild(d);
    cells.push(d);
    cellSig.push('');
  }
}

function toCanon(dx, dy){
  return Net.mySide === 'a' ? [dx, dy] : [7 - dx, 7 - dy];
}

function onCell(dx, dy){
  const s = Net.state;
  if (!s || s.over) return;

  const my = Net.mySide;
  const xy = toCanon(dx, dy);
  const x = xy[0], y = xy[1];
  const pc = s.board[y][x];

  if (pending){
    const p = Arena.PIECES[pending];

    if (s.hand[my].indexOf(pending) < 0){
      pending = null;
      toast('Этой карты больше нет в руке');
      return;
    }
    if (s.nightMode > 0){
      toast('Судная ночь: выставлять нельзя');
      return;
    }
    if (s.energy[my] < p.cost){
      toast('Мало эликсира: нужно ' + p.cost);
      return;
    }

    const home = my === 'a' ? y >= 4 : y <= 3;
    if (!home || pc){
      toast('Только своя половина и только пустая клетка');
      return;
    }

    Net.intent({ t:'place', type:pending, x:x, y:y });
    pending = null;
    return;
  }

  if (sel){
    const same = (pc && pc.side === my && sel.x === x && sel.y === y);

    if (same){
      sel = null;
      render(s);
      return;
    }

    if (pc && pc.side === my){
      if (pc.chained){ Net.intent({ t:'unlock', x:x, y:y }); return; }
      if (pc.asleep){ toast('Фигура спит. Её разбудит только взятие.'); return; }
      sel = { x:x, y:y };
      render(s);
      return;
    }

    const legal = Arena.legalMoves(s, sel.x, sel.y);
    let ok = false;
    for (let i = 0; i < legal.length; i++){
      if (legal[i][0] === x && legal[i][1] === y){ ok = true; break; }
    }

    if (!ok){
      sel = null;
      render(s);
      toast('Так ходить нельзя');
      return;
    }

    Net.intent({ t:'move', fx:sel.x, fy:sel.y, tx:x, ty:y });
    sel = null;
    return;
  }

  if (pc && pc.side === my){
    if (pc.chained){
      Net.intent({ t:'unlock', x:x, y:y });
      return;
    }
    if (pc.asleep){
      toast('Фигура спит. Её разбудит только взятие.');
      return;
    }
    sel = { x:x, y:y };
    render(s);
  }
}

/* ================= ОТРИСОВКА ================= */

function render(s){
  if (!s) return;

  const my  = Net.mySide;
  const rot = (my === 'b');

  if (sel){
    const p = s.board[sel.y] && s.board[sel.y][sel.x];
    if (!p || p.side !== my) sel = null;
  }
  if (pending && s.hand[my].indexOf(pending) < 0) pending = null;

  const moveSet = {};
  if (sel){
    const legal = Arena.legalMoves(s, sel.x, sel.y);
    for (let i = 0; i < legal.length; i++){
      moveSet[legal[i][0] + ':' + legal[i][1]] = true;
    }
  }

  for (let dy = 0; dy < 8; dy++) for (let dx = 0; dx < 8; dx++){
    const idx = dy * 8 + dx;
    const x = rot ? 7 - dx : dx;
    const y = rot ? 7 - dy : dy;

    const el = cells[idx];
    const pc = s.board[y] && s.board[y][x];

    const isLight = ((x + y) % 2 === 0);
    const isSel   = !!(sel && sel.x === x && sel.y === y);
    const key     = x + ':' + y;
    const isMove  = !!moveSet[key];
    const isCap   = isMove && !!pc;

    let trapOn = false;
    if (s.arena === 1 && s.traps){
      for (let i = 0; i < s.traps.length; i++){
        const t = s.traps[i];
        if (t.x === x && t.y === y && t.revealed){ trapOn = true; break; }
      }
    }

    const homeHint = pending
      ? ((my === 'a' ? y >= 4 : y <= 3) && !pc)
      : false;

    let sig = (isLight ? 'L' : 'D');
    if (pc){
      sig += pc.type + pc.side + (pc.asleep ? 'a' : '') + (pc.chained ? 'c' : '');
      if (pc.type === 'king' && pc.maxHp > 1) sig += 'h' + pc.hp;
    }
    if (trapOn)   sig += 'T';
    if (isSel)    sig += 'S';
    if (isMove)   sig += (isCap ? 'C' : 'M');
    if (homeHint) sig += 'H';

    if (cellSig[idx] === sig) continue;
    cellSig[idx] = sig;

    el.className = 'cell ' + (isLight ? 'light' : 'dark');
    el.textContent = '';

    if (trapOn) el.classList.add('trap');

    if (pc){
      if (pc.asleep)  el.classList.add('sleep');
      if (pc.chained) el.classList.add('chain');

      const sp = document.createElement('span');
      const mine = (pc.side === my);
      sp.className = 'piece ' + (mine ? 'mine' : 'theirs');
      sp.textContent = mine ? Arena.PIECES[pc.type].w : Arena.PIECES[pc.type].b;
      el.appendChild(sp);

      if (pc.type === 'king' && pc.maxHp > 1 && typeof pc.hp === 'number'){
        const bar = document.createElement('div');
        bar.className = 'king-hp' + (pc.hp / pc.maxHp <= 0.34 ? ' low' : '');
        const fill = document.createElement('i');
        fill.style.width = Math.max(0, Math.min(100, (pc.hp / pc.maxHp) * 100)) + '%';
        bar.appendChild(fill);
        el.appendChild(bar);
      }
    }

    if (isSel)    el.classList.add('sel');
    if (isMove)   el.classList.add(isCap ? 'cap' : 'move');
    if (homeHint) el.classList.add('move');
  }

  /* эликсир */
  const myE = s.energy[my];
  const opE = s.energy[my === 'a' ? 'b' : 'a'];
  $('myElixFill').style.width    = (myE * 10) + '%';
  $('enemyElixFill').style.width = (opE * 10) + '%';

  const rate = Arena.energyRate(s);
  const speedTxt = rate > 1 ? ('⚡×' + rate) : '';
  if (speedTxt !== lastSpeedTxt){
    lastSpeedTxt = speedTxt;
    $('speedTag').textContent = speedTxt;
  }

  /* таймер */
  const tl = $('timeLabel');
  let timeTxt = '';
  let timeColor = '';

  if (s.arena === 10){
    timeTxt = '∞';
  } else if (s.nightMode > 0){
    timeTxt = 'НОЧЬ ' + Math.ceil(s.nightMode);
  } else {
    let left = s.timeLeft;
    if (typeof left !== 'number' || !isFinite(left)) left = Arena.MAIN_TIME;

    const t = Math.max(0, Math.ceil(left));
    const txt = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');

    if (s.phase === 'overtime'){
      timeTxt = 'ДОП ' + txt;
      timeColor = '#ef4444';
    } else if (left <= Arena.FAST_FROM){
      timeTxt = txt;
      timeColor = '#f59e0b';
    } else {
      timeTxt = txt;
    }
  }

  if (timeTxt !== lastTimeTxt){
    lastTimeTxt = timeTxt;
    tl.textContent = timeTxt;
  }
  if (tl.style.color !== timeColor) tl.style.color = timeColor;

  /* судная ночь */
  $('nightBtn').disabled = !(
    s.arena === 8 &&
    !s.nightUsed[my] &&
    s.hand[my].indexOf('king') < 0 &&
    !s.over
  );

  /* рука — перерисовываем только когда реально поменялась */
  const cards = s.hand[my];
  let hs = cards.join(',') + '|' + pending + '|' + myE.toFixed(1);
  if (hs !== handSig){
    handSig = hs;

    const hand = $('hand');
    hand.innerHTML = '';

    for (let i = 0; i < cards.length; i++){
      const type = cards[i];
      const p = Arena.PIECES[type];
      const can = myE >= p.cost;

      const d = document.createElement('div');
      d.className = 'hcard' +
        (pending === type ? ' on' : '') +
        (can ? '' : ' off');

      d.innerHTML =
        '<div class="c">' + p.cost + '</div>' +
        '<div class="s">' + p.w + '</div>' +
        '<div class="n">' + p.name + '</div>';

      (function (t, enabled){
        d.onclick = function (){
          if (!enabled){ toast('Мало эликсира'); return; }
          pending = (pending === t) ? null : t;
          sel = null;
          render(Net.state);
        };
      })(type, can);

      hand.appendChild(d);
    }
  }
}

/* ================= КНОПКИ ================= */

$('nightBtn').onclick = function (){
  Net.intent({ t:'night' });
};

$('resignBtn').onclick = function (){
  if (confirm('Сдаться? Это поражение и минус кубки.')) Net.resign();
};

/* ================= ОШИБКА ПОДКЛЮЧЕНИЯ ================= */

function showBootError(e){
  let msg = 'неизвестная ошибка';
  let extra = '';

  if (e){
    if (typeof e === 'string') msg = e;
    else {
      msg = e.message || e.error_description || e.msg || e.details || msg;
      if (e.code) extra += ' [' + e.code + ']';
      if (e.hint) extra += '\n' + e.hint;
    }
  }

  $('bootErrText').textContent = msg + extra;
  $('bootErr').classList.remove('hidden');
  $('statusMsg').textContent = '';
  $('playBtn').disabled = true;
  $('pName').textContent = 'База не подключена';
  $('pCups').textContent = '—';
  $('pArena').textContent = '';
}

/* ================= СТАРТ ================= */

function autoQueueRequested(){
  try {
    if (sessionStorage.getItem('arenaAutoQueue') === '1'){
      sessionStorage.removeItem('arenaAutoQueue');
      return true;
    }
  } catch (e){}

  try {
    const q = new URLSearchParams(window.location.search);
    if (q.get('auto') === '1') return true;
  } catch (e){}

  return false;
}

async function boot(){
  const auto = autoQueueRequested();

  $('bootErr').classList.add('hidden');
  $('playBtn').disabled = true;

  try {
    const seed = parseInt(localStorage.getItem('cr_trophies') || '0', 10) || 0;

    await Net.init({
      client: sb,
      key: playerKey(),
      name: playerName(),
      seed: seed
    });

    $('playBtn').disabled = false;

    const resumed = await Net.tryResume();

    if (resumed) return;

    renderLobby();

    if (auto) startSearch();

  } catch (e){
    console.error(e);
    showBootError(e);
  }
}

$('retryBtn').onclick = function (){
  boot();
};

boot();
</script>
