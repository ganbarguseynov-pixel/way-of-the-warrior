<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Шахматные арены</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
:root{ --dark:#334155; --light:#64748b; --accent:#b5541f; --bg:#0f172a; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  overscroll-behavior:none;
  touch-action:manipulation;
}

body{
  margin:0;background:var(--bg);color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;min-height:100dvh;
  user-select:none;
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
.hidden{display:none!important}

body.battle-mode .bottom-nav{display:none!important}
body.battle-mode #verTag{display:none!important}

#verTag{
  position:fixed;left:8px;bottom:74px;z-index:1300;
  font-size:10px;font-weight:900;color:#facc15;letter-spacing:.5px;
  background:#0f172a;border:1px solid #facc15;
  padding:3px 8px;border-radius:6px;pointer-events:none;
}

#lobby{
  width:95vw;max-width:400px;text-align:center;
  margin:20px auto 0;
  max-height:calc(100dvh - 100px);
  overflow-y:auto;
}
.card{
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:1px solid #334155;border-radius:14px;
  padding:18px;margin-bottom:12px;
  box-shadow:0 8px 22px rgba(0,0,0,.6);
}
#pName{font-size:16px;font-weight:700;color:#94a3b8}
#pCups{font-size:38px;font-weight:900;color:#ffcc00;margin:4px 0;
  text-shadow:0 0 22px rgba(255,204,0,.4)}
#pArena{font-size:13px;font-weight:700;letter-spacing:1px;color:var(--accent)}
#pFloor{font-size:11px;color:#64748b;margin-top:6px}
#progWrap{height:8px;background:#020617;border-radius:5px;overflow:hidden;margin-top:10px}
#progFill{height:100%;width:0;background:linear-gradient(90deg,#b5541f,#ffcc00);transition:width .4s}

#playBtn{
  width:100%;padding:16px;border:0;border-radius:12px;
  font-size:17px;font-weight:900;letter-spacing:1px;cursor:pointer;
  background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;
  box-shadow:0 6px 16px rgba(34,197,94,.35);
}
#playBtn:active{transform:scale(.98)}
#playBtn.searching{background:linear-gradient(145deg,#475569,#1e293b);
  box-shadow:0 6px 16px rgba(0,0,0,.5)}
#playBtn:disabled{opacity:.45;cursor:not-allowed}

#statusMsg{font-size:13px;color:#ffcc00;min-height:36px;margin-top:10px;line-height:1.35}
#ruleBox{font-size:12px;color:#94a3b8;line-height:1.45;margin-top:10px;min-height:34px}

#bootErr{
  margin-top:12px;padding:12px;border-radius:10px;
  background:rgba(239,68,68,.12);border:1px solid #7f1d1d;
  text-align:left;
}
#bootErrHead{font-size:12px;font-weight:900;color:#fca5a5;margin-bottom:6px;letter-spacing:.5px}
#bootErrText{
  font-size:11px;color:#fecaca;line-height:1.45;word-break:break-word;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  max-height:150px;overflow-y:auto;
}
#retryBtn{
  width:100%;margin-top:10px;padding:10px;border-radius:9px;
  border:1px solid #b91c1c;background:linear-gradient(145deg,#ef4444,#991b1b);
  color:#fff;font-size:13px;font-weight:800;cursor:pointer;
}

#battle{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  padding:6px 0 calc(8px + env(safe-area-inset-bottom));
  overflow:hidden;
  z-index:5;
}
#battle > *{flex-shrink:0}

#topBar{
  width:min(95vw,420px);
  display:flex;justify-content:space-between;
  align-items:center;
  font-size:12px;height:22px;margin-bottom:8px;color:#94a3b8;
}
#topBar b{color:#ffcc00}
#timeLabel{
  font-weight:900;font-variant-numeric:tabular-nums;font-size:15px;
  min-width:52px;text-align:right;
}

#checkBar{
  width:min(95vw,420px);
  height:24px;line-height:24px;
  text-align:center;
  font-size:12px;font-weight:900;letter-spacing:1.2px;
  color:#fff;border-radius:8px;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  background:linear-gradient(145deg,#ef4444,#991b1b);
  box-shadow:0 0 18px rgba(239,68,68,.55);
  visibility:hidden;
  opacity:0;
}
#checkBar.on{visibility:visible;opacity:1;animation:barPulse .8s infinite alternate}
@keyframes barPulse{from{opacity:.72}to{opacity:1}}

.elix-wrap{
  position:relative;
  width:min(95vw,420px);
  height:22px;
  background:#020617;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:6px;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.8);
  border:1px solid rgba(255,255,255,.1);
}
.elix-fill{
  position:absolute;left:0;top:0;height:100%;
  width:50%;
  transition:width .2s linear;
}
#myElixFill{background:linear-gradient(180deg,#ff6b7a,#7f1d1d)}
.elix-num{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:900;
  color:#fff;
  letter-spacing:.5px;
  z-index:3;
  text-shadow:0 1px 3px #000,0 0 6px #000,0 0 3px #000;
  pointer-events:none;
}
.elix-label{
  position:absolute;left:8px;top:50%;transform:translateY(-50%);
  font-size:9px;font-weight:900;letter-spacing:.6px;
  color:rgba(255,255,255,.8);
  z-index:3;pointer-events:none;
  text-shadow:0 1px 3px #000;
}

#board{
  --side:min(95vw, 420px, calc(100dvh - 175px));
  width:var(--side);
  height:var(--side);
  display:grid;
  grid-template-columns:repeat(8,1fr);
  grid-template-rows:repeat(8,1fr);
  border:3px solid #334155;border-radius:12px;overflow:hidden;
  background:var(--dark);
  box-shadow:0 12px 34px rgba(0,0,0,.85);
  position:relative;
  contain:layout paint;
}
.cell{
  position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:clamp(15px,5vw,26px);
  cursor:pointer;
  overflow:hidden;
}
.cell.light{background:var(--light)}
.cell.dark{background:var(--dark)}
.cell.sel{outline:3px solid #4ade80;outline-offset:-3px}
.cell.move::after{
  content:'';position:absolute;width:24%;height:24%;border-radius:50%;
  background:radial-gradient(circle,#ffcc00,#b8860b);
  box-shadow:0 0 8px rgba(255,204,0,.9);
}
.cell.cap::after{content:'';position:absolute;inset:6%;
  border:3px solid #ef4444;border-radius:50%}
.cell.check{box-shadow:inset 0 0 0 3px #ef4444,inset 0 0 20px rgba(239,68,68,.8)}
.cell.check .piece{animation:checkPulse .65s infinite alternate}
@keyframes checkPulse{from{filter:brightness(1)}to{filter:brightness(1.9)}}

.piece{
  position:relative;z-index:3;line-height:1;
  margin-bottom:7px;
  font-weight:400;
  pointer-events:none;
}

.piece.mine{
  color:#5aa9ec;
  text-shadow:0 0 6px rgba(90,169,236,.75),0 2px 4px rgba(0,0,0,.95);
}

.piece.theirs{
  color:#ef5350;
  text-shadow:0 0 6px rgba(239,83,80,.75),0 2px 4px rgba(0,0,0,.95);
}

.cost-badge{
  position:absolute;top:0;right:0;
  width:36%;height:36%;
  max-width:15px;max-height:15px;
  border-radius:50%;
  background:linear-gradient(145deg,#c084fc,#7c3aed);
  color:#fff;
  font-size:8px;font-weight:900;line-height:1;
  display:flex;align-items:center;justify-content:center;
  border:1px solid #fff;
  z-index:9;
  box-shadow:0 1px 3px rgba(0,0,0,.8);
  pointer-events:none;
}

.hp-bar{
  position:absolute;
  bottom:7px;left:8%;width:84%;
  height:7px;
  border-radius:3px;
  background:#000;
  border:1px solid #000;
  z-index:8;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.8);
  pointer-events:none;
}
.hp-fill{
  position:absolute;left:0;top:0;height:100%;
  background:linear-gradient(180deg,#34c759,#34c759aa);
  z-index:1;
}
.hp-fill.mid{background:linear-gradient(180deg,#ffcc00,#ffcc00aa)}
.hp-fill.low{background:linear-gradient(180deg,#ff3b30,#ff3b30aa)}
.hp-lvl{
  position:relative;z-index:2;
  font-size:6px;font-weight:900;color:#000;
  line-height:1;
}
.hp-text{
  position:absolute;
  bottom:-1px;left:0;width:100%;
  text-align:center;
  font-size:6px;font-weight:bold;color:#fff;
  z-index:9;
  white-space:nowrap;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 1px 2px rgba(0,0,0,.9);
  pointer-events:none;
}

#myElix{margin-top:6px;margin-bottom:0}
#speedTag{
  position:absolute;right:7px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:900;color:#ffe08a;letter-spacing:.3px;
  text-shadow:0 1px 3px #000,0 0 6px #000;z-index:4;pointer-events:none;
}

#tools{width:min(95vw,420px);display:flex;gap:6px;margin-top:10px}
#tools button{
  flex:1;padding:11px 4px;border-radius:10px;font-size:12px;font-weight:800;
  border:1px solid #475569;
  background:linear-gradient(145deg,#475569,#1e293b);color:#fff;cursor:pointer;
}
#tools button:disabled{opacity:.35;cursor:not-allowed}

#promoPanel{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(92vw,340px);
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #5aa9ec;border-radius:16px;
  padding:16px;z-index:980;
  box-shadow:0 18px 46px rgba(0,0,0,.92);
  text-align:center;
}
#promoTitle{
  font-size:13px;font-weight:900;color:#e2e8f0;
  letter-spacing:.5px;margin-bottom:12px;line-height:1.35;
}
#promoRow{display:flex;gap:8px}
.promo-opt{
  flex:1;border:2px solid #334155;border-radius:12px;
  background:#0f172a;cursor:pointer;
  padding:8px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
}
.promo-opt:active{border-color:#5aa9ec;background:#132033}
.promo-glyph{
  font-size:30px;line-height:1;color:#5aa9ec;
  text-shadow:0 0 8px rgba(90,169,236,.7),0 2px 4px rgba(0,0,0,.9);
}
.promo-name{font-size:9.5px;font-weight:800;color:#94a3b8}
#promoCancel{
  width:100%;margin-top:10px;padding:9px;border-radius:9px;
  border:1px solid #475569;background:transparent;
  color:#94a3b8;font-size:12px;font-weight:800;cursor:pointer;
}

#drawPanel{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:140px;width:min(92vw,380px);
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #22c55e;border-radius:14px;
  padding:14px;text-align:center;z-index:960;
  box-shadow:0 14px 40px rgba(0,0,0,.9);
}
#drawPanelText{font-size:13px;font-weight:800;color:#e2e8f0;margin-bottom:10px}
#drawPanelBtns{display:flex;gap:8px}
#drawPanelBtns button{
  flex:1;padding:11px;border-radius:10px;border:0;
  font-size:13px;font-weight:900;cursor:pointer;color:#fff;
}
#drawAccept{background:linear-gradient(145deg,#22c55e,#15803d)}
#drawDecline{background:linear-gradient(145deg,#ef4444,#991b1b)}

#overlay{
  position:fixed;inset:0;background:rgba(2,6,23,.92);
  display:flex;align-items:center;justify-content:center;
  z-index:900;padding:20px;
  overflow-y:auto;
}
.ov{
  text-align:center;padding:26px 30px;
  background:linear-gradient(145deg,#1e293b,#0f172a);
  border:2px solid #334155;border-radius:16px;
  max-width:340px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.8);
}
.ov h2{margin:0 0 6px;font-size:26px}
.ov p{margin:0 0 14px;color:#94a3b8;font-size:13px}
.ov .big{font-size:30px;font-weight:900;color:#ffcc00;margin:8px 0}
.ov .sub{font-size:12px;color:#64748b;margin-bottom:10px;min-height:16px}
.ov button{
  width:100%;padding:13px;border:0;border-radius:10px;
  font-size:15px;font-weight:800;margin-top:8px;
  background:linear-gradient(145deg,#22c55e,#15803d);color:#fff;cursor:pointer;
}

#toast{
  position:fixed;bottom:140px;left:50%;
  transform:translateX(-50%) translateY(10px);
  background:#1e293b;border:1px solid #475569;color:#ffcc00;
  padding:9px 16px;border-radius:8px;font-size:12.5px;
  opacity:0;transition:opacity .2s;
  pointer-events:none;z-index:950;
  max-width:80vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.bottom-nav{
  position:fixed;bottom:0;left:0;width:100%;height:68px;
  background:linear-gradient(180deg,#1a1a2e,#0f0f1e);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;justify-content:space-around;align-items:center;
  z-index:999;padding-bottom:env(safe-area-inset-bottom);
}
.nav-btn{
  background:transparent;border:none;color:#94a3b8;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:9px;font-weight:bold;cursor:pointer;flex:1;height:100%;gap:3px;
}
.nav-btn .icon-wrap{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#2a2a3e,#15151f);
}
.nav-btn .icon{font-size:20px}
.nav-btn.active{color:#ffcc00}
.nav-btn.active .icon-wrap{background:linear-gradient(145deg,#ffcc00,#ff9500)}

</style>

<script>
const sb = supabase.createClient(
  'https://qnpriwfxzuoymoumdtrl.supabase.co',
  'sb_publishable_1jTWcnb3WvNMi79DXYU7Tw_RWKIVcsF'
);

const tg = window.Telegram.WebApp;
try { tg.ready(); tg.expand(); } catch (e){}

const $ = function (id){ return document.getElementById(id); };

let sel     = null;
let cells   = [];
let cellSig = [];
let lastTimeTxt = '';
let lastSpeedTxt = '';
let searching = false;

let checkState = -1;
let drawState  = '';

let promoPending = null;

let toastTimer = null;
function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function (){ t.classList.remove('show'); }, 2000);
}

function playerKey(){
  const tgId = localStorage.getItem('tgId');
  if (tgId) return 'tg:' + tgId;

  const email = localStorage.getItem('currentEmail') || localStorage.getItem('linkedEmail');
  if (email) return 'email:' + email.toLowerCase();

  let anon = localStorage.getItem('arenaAnonId');
  if (!anon){
    anon = 'anon:' + Math.random().toString(36).slice(2, 10);
    localStorage.setItem('arenaAnonId', anon);
  }
  return anon;
}

function playerName(){
  return localStorage.getItem('userName') || 'Игрок';
}

function renderLobby(){
  const me = Net.me;
  if (!me) return;

  const arena = Arena.arenaOf(me.cups);
  const floor = Arena.floorOf(me.cups);

  $('pName').textContent  = me.display_name || playerName();
  $('pCups').textContent  = me.cups + ' 🏆';
  $('pArena').textContent = 'АРЕНА ' + arena + ' · ' +
                            Arena.ARENAS[arena - 1].name.toUpperCase();
  $('pFloor').textContent = 'Пол арены: ' + floor + ' 🏆 — ниже не упадёшь';

  let pct;
  if (arena >= Arena.MAX_ARENA) pct = 100;
  else pct = ((me.cups - floor) / Arena.STEP) * 100;
  $('progFill').style.width = Math.max(0, Math.min(100, pct)) + '%';

  $('ruleBox').textContent = Arena.ARENAS[arena - 1].rule;
  document.body.dataset.arena = arena;
}

async function startSearch(){
  if (searching) return;
  if (!Net.me) return;

  searching = true;
  $('playBtn').classList.add('searching');
  $('playBtn').textContent = 'ОТМЕНА';
  await Net.findMatch();
}

function stopSearch(){
  searching = false;
  $('playBtn').classList.remove('searching');
  $('playBtn').textContent = 'В БОЙ';
}

$('playBtn').onclick = async function (){
  if (searching){
    await Net.cancelQueue();
    stopSearch();
    $('statusMsg').textContent = '';
    return;
  }
  startSearch();
};

Net.on('status', function (d){
  $('statusMsg').textContent = d.text || '';
});

Net.on('error', function (d){
  toast(d.message);
});

Net.on('start', function (info){
  stopSearch();
  $('statusMsg').textContent = '';

  document.body.classList.add('battle-mode');

  $('lobby').classList.add('hidden');
  $('battle').classList.remove('hidden');
  $('overlay').classList.add('hidden');
  $('bootErr').classList.add('hidden');
  $('drawPanel').classList.add('hidden');
  $('promoPanel').classList.add('hidden');

  sel = null;
  promoPending = null;
  checkState = -1;
  drawState = '';
  lastTimeTxt = '';
  lastSpeedTxt = '';
  document.body.dataset.arena = info.arena;

  buildBoard();

  for (let i = 0; i < cellSig.length; i++) cellSig[i] = '';

  const myCups  = Net.me ? Net.me.cups : 0;
  const oppCups = (info.opponent && info.opponent.cups) || 0;
  const diff = myCups - oppCups;
  const win  = diff === 0 ? 30 : (diff < 0 ? 31 : 29);
  const lose = Arena.lossFor(myCups, win);

  $('oppLabel').textContent =
    (info.opponent ? info.opponent.name : 'Соперник') + ' (' + oppCups + ' 🏆)';
  $('stakeWin').textContent  = '+' + win;
  $('stakeLose').textContent = '−' + lose;

  if (info.state){
    render(info.state);
  } else {
    $('timeLabel').textContent = '…';
    toast('Собираем доску…');
  }
});

Net.on('state', function (s){ render(s); });

Net.on('resumeFailed', async function (){
  toast('Соперник не вернулся. Засчитано поражение.');
  document.body.classList.remove('battle-mode');
  await Net.leaveMatch();
  $('battle').classList.add('hidden');
  $('promoPanel').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  await Net.refresh();
  renderLobby();
});

Net.on('result', async function (r){
  stopSearch();

  document.body.classList.remove('battle-mode');

  $('battle').classList.add('hidden');
  $('checkBar').classList.remove('on');
  $('drawPanel').classList.add('hidden');
  $('promoPanel').classList.add('hidden');
  $('overlay').classList.remove('hidden');

  promoPending = null;

  const won  = r.winner === r.mySide;
  const draw = r.winner === 'draw';

  $('ovTitle').textContent = draw ? 'НИЧЬЯ' : (won ? 'ПОБЕДА' : 'ПОРАЖЕНИЕ');
  $('ovTitle').style.color = draw ? '#9fb6c4' : (won ? '#ffcc00' : '#ef4444');
  $('ovArena').textContent = 'Арена «' + Arena.ARENAS[Net.arena - 1].name + '»';

  const sign = r.delta > 0 ? '+' : '';
  $('ovDelta').textContent = draw ? '±0' : sign + r.delta + ' 🏆';
  $('ovDelta').style.color = r.delta < 0 ? '#ef4444' : '#ffcc00';
  $('ovCups').textContent = r.before + ' → ' + r.after;

  const arenaNow  = Arena.arenaOf(r.after);
  const arenaThen = Arena.arenaOf(r.before);

  if (arenaNow > arenaThen){
    $('ovNote').textContent = '⬆ НОВАЯ АРЕНА: ' + Arena.ARENAS[arenaNow - 1].name;
    $('ovNote').style.color = '#22c55e';
  } else if (arenaNow < arenaThen){
    $('ovNote').textContent = '⬇ Ты выпал на арену «' + Arena.ARENAS[arenaNow - 1].name + '»';
    $('ovNote').style.color = '#ef4444';
  } else if (!draw && r.delta === 0){
    $('ovNote').textContent = 'Пол арены: ниже ' + r.floor + ' не падаешь';
    $('ovNote').style.color = '#64748b';
  } else {
    $('ovNote').textContent = '';
  }

  await Net.leaveMatch();
  await Net.refresh();
  renderLobby();
});

$('ovBtn').onclick = async function (){
  document.body.classList.remove('battle-mode');
  $('overlay').classList.add('hidden');
  $('battle').classList.add('hidden');
  $('promoPanel').classList.add('hidden');
  $('lobby').classList.remove('hidden');
  await Net.refresh();
  renderLobby();
};

function buildBoard(){
  if (cells.length) return;
  const b = $('board');
  for (let i = 0; i < 64; i++){
    const d = document.createElement('div');
    d.className = 'cell';
    (function (idx){
      d.onclick = function (){ onCell(idx % 8, Math.floor(idx / 8)); };
    })(i);
    b.appendChild(d);
    cells.push(d);
    cellSig.push('');
  }
}

function toCanon(dx, dy){
  return Net.mySide === 'a' ? [dx, dy] : [7 - dx, 7 - dy];
}

function onCell(dx, dy){
  const s = Net.state;
  if (!s || s.over) return;
  if (promoPending) return;

  const my = Net.mySide;
  const xy = toCanon(dx, dy);
  const x = xy[0], y = xy[1];
  const pc = s.board[y][x];

  if (sel){
    if (pc && pc.side === my && sel.x === x && sel.y === y){
      sel = null;
      render(s);
      return;
    }

    if (pc && pc.side === my){
      sel = { x:x, y:y };
      render(s);
      return;
    }

    const legal = Arena.legalMoves(s, sel.x, sel.y);
    let ok = false;
    for (let i = 0; i < legal.length; i++){
      if (legal[i][0] === x && legal[i][1] === y){ ok = true; break; }
    }

    if (!ok){
      sel = null;
      render(s);
      toast(Arena.kingAttacked(s, my) ? 'Шах! Уходи из-под удара' : 'Так ходить нельзя');
      return;
    }

    const mover = s.board[sel.y][sel.x];
    const need  = Arena.moveCost(s, mover);
    if (Math.floor(s.energy[my]) < need){
      sel = null;
      render(s);
      toast('Нужно ' + need + ' эликсира');
      return;
    }

    if (Arena.isPromotion(s, sel.x, sel.y, x, y)){
      promoPending = { fx: sel.x, fy: sel.y, tx: x, ty: y };
      sel = null;
      render(s);
      $('promoPanel').classList.remove('hidden');
      return;
    }

    Net.intent({ t:'move', fx:sel.x, fy:sel.y, tx:x, ty:y });
    sel = null;
    return;
  }

  if (pc && pc.side === my){
    sel = { x:x, y:y };
    render(s);
  }
}

function choosePromo(key){
  if (!promoPending) return;

  const mv = promoPending;
  promoPending = null;
  $('promoPanel').classList.add('hidden');

  Net.intent({
    t:'move',
    fx: mv.fx, fy: mv.fy,
    tx: mv.tx, ty: mv.ty,
    promo: key
  });
}

const promoOpts = document.querySelectorAll('.promo-opt');
for (let i = 0; i < promoOpts.length; i++){
  (function (el){
    el.onclick = function (){ choosePromo(el.dataset.promo); };
  })(promoOpts[i]);
}

$('promoCancel').onclick = function (){
  promoPending = null;
  $('promoPanel').classList.add('hidden');
  if (Net.state) render(Net.state);
};

function updateDrawUI(s, my, opp){
  const offer = s.drawOffer || { a:false, b:false };
  const mine   = !!offer[my];
  const theirs = !!offer[opp];

  const key = (mine ? '1' : '0') + (theirs ? '1' : '0') + (s.over ? 'X' : '');
  if (key === drawState) return;
  drawState = key;

  const btn = $('drawBtn');
  if (mine){
    btn.textContent = '⏳ Ждём';
    btn.disabled = true;
  } else {
    btn.textContent = '🤝 Ничья';
    btn.disabled = !!s.over;
  }

  if (theirs && !s.over) $('drawPanel').classList.remove('hidden');
  else $('drawPanel').classList.add('hidden');
}

function pieceHp(pc){
  const hp  = (typeof pc.hp === 'number' && isFinite(pc.hp)) ? pc.hp : 1;
  const max = (typeof pc.maxHp === 'number' && isFinite(pc.maxHp) && pc.maxHp > 0) ? pc.maxHp : 1;
  return { hp: hp, max: max };
}

function renderElix(s, my){
  let myE = (typeof s.energy[my] === 'number' && isFinite(s.energy[my])) ? s.energy[my] : 0;
  myE = Math.max(0, Math.min(10, Math.floor(myE)));

  $('myElixFill').style.width = (myE * 10) + '%';
  $('myElixNum').textContent  = myE + ' / 10';
}

function render(s){
  if (!s) return;

  const my  = Net.mySide;
  const opp = (my === 'a') ? 'b' : 'a';
  const rot = (my === 'b');

  let myCheck = false, opCheck = false;

  if (s.check){
    myCheck = !!s.check[my];
    opCheck = !!s.check[opp];
  } else if (Arena && typeof Arena.kingAttacked === 'function'){
    myCheck = Arena.kingAttacked(s, my);
    opCheck = Arena.kingAttacked(s, opp);
  }

  const nowState = myCheck ? 1 : (opCheck ? 2 : 0);
  if (nowState !== checkState){
    checkState = nowState;
    const bar = $('checkBar');
    if (nowState === 1){
      bar.textContent = 'ШАХ! УХОДИ ИЗ-ПОД УДАРА';
      bar.classList.add('on');
    } else if (nowState === 2){
      bar.textContent = 'ШАХ У СОПЕРНИКА';
      bar.classList.add('on');
    } else {
      bar.classList.remove('on');
    }
  }

  updateDrawUI(s, my, opp);

  if (sel){
    const p = s.board[sel.y] && s.board[sel.y][sel.x];
    if (!p || p.side !== my) sel = null;
  }

  const moveSet = {};
  if (sel){
    const legal = Arena.legalMoves(s, sel.x, sel.y);
    for (let i = 0; i < legal.length; i++){
      moveSet[legal[i][0] + ':' + legal[i][1]] = true;
    }
  }

  for (let dy = 0; dy < 8; dy++) for (let dx = 0; dx < 8; dx++){
    const idx = dy * 8 + dx;
    const x = rot ? 7 - dx : dx;
    const y = rot ? 7 - dy : dy;

    const el = cells[idx];
    const pc = s.board[y] && s.board[y][x];

    const isLight = ((x + y) % 2 === 0);
    const isSel   = !!(sel && sel.x === x && sel.y === y);
    const key     = x + ':' + y;
    const isMove  = !!moveSet[key];
    const isCap   = isMove && !!pc;

    const kingChk = !!(pc && pc.type === 'king' &&
                       ((pc.side === my) ? myCheck : opCheck));

    let sig = (isLight ? 'L' : 'D');
    if (pc){
      const h = pieceHp(pc);
      sig += pc.type + pc.side + 'h' + h.hp + '/' + h.max;
    }
    if (kingChk) sig += 'K';
    if (isSel)   sig += 'S';
    if (isMove)  sig += (isCap ? 'C' : 'M');

    if (cellSig[idx] === sig) continue;
    cellSig[idx] = sig;

    el.className = 'cell ' + (isLight ? 'light' : 'dark');
    el.textContent = '';

    if (kingChk) el.classList.add('check');

    if (pc){
      const mine = (pc.side === my);
      const def  = Arena.PIECES[pc.type];

      const sp = document.createElement('span');
      sp.className = 'piece ' + (mine ? 'mine' : 'theirs');
      sp.textContent = def ? (mine ? def.w : def.b) : '?';
      el.appendChild(sp);

      if (def && typeof def.cost === 'number'){
        const cb = document.createElement('div');
        cb.className = 'cost-badge';
        cb.textContent = def.cost;
        el.appendChild(cb);
      }

      const h = pieceHp(pc);
      const pct = Math.max(0, Math.min(100, (h.hp / h.max) * 100));

      let cls = 'hp-fill';
      if (pct <= 30) cls += ' low';
      else if (pct <= 60) cls += ' mid';

      const bar = document.createElement('div');
      bar.className = 'hp-bar';

      const fill = document.createElement('div');
      fill.className = cls;
      fill.style.width = pct + '%';
      bar.appendChild(fill);

      const lvl = document.createElement('span');
      lvl.className = 'hp-lvl';
      lvl.textContent = '1';
      bar.appendChild(lvl);

      el.appendChild(bar);

      const txt = document.createElement('div');
      txt.className = 'hp-text';
      txt.textContent = h.hp + '/' + h.max;
      el.appendChild(txt);
    }

    if (isSel)  el.classList.add('sel');
    if (isMove) el.classList.add(isCap ? 'cap' : 'move');
  }

  renderElix(s, my);

  const rate = Arena.energyRate(s);
  const speedTxt = rate > 1 ? ('⚡×' + rate) : '';
  if (speedTxt !== lastSpeedTxt){
    lastSpeedTxt = speedTxt;
    $('speedTag').textContent = speedTxt;
  }

  const tl = $('timeLabel');
  let timeTxt = '';
  let timeColor = '';

  let left = s.timeLeft;
  if (typeof left !== 'number' || !isFinite(left)) left = Arena.MAIN_TIME;

  const t = Math.max(0, Math.ceil(left));
  const txt = Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0');

  if (s.phase === 'overtime'){
    timeTxt = 'ДОП ' + txt;
    timeColor = '#ef4444';
  } else if (left <= Arena.FAST_FROM){
    timeTxt = txt;
    timeColor = '#f59e0b';
  } else {
    timeTxt = txt;
  }

  if (timeTxt !== lastTimeTxt){
    lastTimeTxt = timeTxt;
    tl.textContent = timeTxt;
  }
  if (tl.style.color !== timeColor) tl.style.color = timeColor;
}

$('drawBtn').onclick = function (){
  Net.intent({ t:'draw' });
};

$('drawAccept').onclick = function (){
  Net.intent({ t:'draw' });
};

$('drawDecline').onclick = function (){
  Net.intent({ t:'undraw' });
};

$('resignBtn').onclick = function (){
  if (confirm('Сдаться? Это поражение и минус кубки.')) Net.resign();
};

function showBootError(e){
  let msg = 'неизвестная ошибка';
  let extra = '';

  if (e){
    if (typeof e === 'string') msg = e;
    else {
      msg = e.message || e.error_description || e.msg || e.details || msg;
      if (e.code) extra += ' [' + e.code + ']';
      if (e.hint) extra += '\n' + e.hint;
    }
  }

  $('bootErrText').textContent = msg + extra;
  $('bootErr').classList.remove('hidden');
  $('statusMsg').textContent = '';
  $('playBtn').disabled = true;
  $('pName').textContent = 'База не подключена';
  $('pCups').textContent = '—';
  $('pArena').textContent = '';
}

function autoQueueRequested(){
  try {
    if (sessionStorage.getItem('arenaAutoQueue') === '1'){
      sessionStorage.removeItem('arenaAutoQueue');
      return true;
    }
  } catch (e){}

  try {
    const q = new URLSearchParams(window.location.search);
    if (q.get('auto') === '1') return true;
  } catch (e){}

  return false;
}

async function boot(){
  const auto = autoQueueRequested();

  $('bootErr').classList.add('hidden');
  $('playBtn').disabled = true;

  try {
    const seed = parseInt(localStorage.getItem('cr_trophies') || '0', 10) || 0;

    await Net.init({
      client: sb,
      key: playerKey(),
      name: playerName(),
      seed: seed
    });

    $('playBtn').disabled = false;

    const resumed = await Net.tryResume();

    if (resumed) return;

    renderLobby();

    if (auto) startSearch();

  } catch (e){
    console.error(e);
    showBootError(e);
  }
}

$('retryBtn').onclick = function (){
  boot();
};

document.addEventListener('visibilitychange', function (){
  if (!document.hidden && typeof Net.checkAway === 'function'){
    Net.checkAway();
  }
});

boot();
</script>
